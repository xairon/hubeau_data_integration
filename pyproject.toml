# Hub'Eau Data Integration Pipeline
# Modern Python project configuration (PEP 621 standard)
# Uses uv for ultra-fast dependency management

[project]
name = "hubeau-pipeline"
version = "1.0.0"
description = "Hub'Eau data integration pipeline with Dagster + DLT"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Nicolas Ringuet"}
]
keywords = ["data-pipeline", "dagster", "dlt", "hubeau", "water-data"]

# ═══════════════════════════════════════════════════════════
# CORE DEPENDENCIES (Production)
# ═══════════════════════════════════════════════════════════

dependencies = [
    # Core Dagster
    "dagster==1.8.8",
    "dagster-webserver==1.8.8",
    "dagster-postgres==0.24.8",
    "dagster-dlt==0.23.8",  # Dagster-DLT integration

    # DLT with destinations
    "dlt[postgres,filesystem,duckdb]==0.4.12",
    "jsonpath-ng==1.6.1",
    "psutil==5.9.6",

    # Database clients
    "psycopg[binary]==3.1.13",
    "neo4j==5.15.0",

    # HTTP and caching
    "httpx==0.26.0",
    "tenacity==8.2.3",
    "redis==5.0.1",
    "requests==2.31.0",

    # S3/MinIO
    "boto3==1.34.0",
    "botocore==1.34.0",
    "s3fs==2024.3.1",

    # Data processing
    "pandas==2.2.0",
    "pyarrow==15.0.0",
    "numpy==1.26.0",

    # Geospatial
    "geopandas==0.14.0",
    "shapely==2.0.2",
    "pyproj==3.6.1",

    # RDF and ontologies
    "rdflib==7.0.0",
    "owlrl==6.0.2",

    # WFS and OGC services
    "owslib==0.29.2",

    # Utilities
    "python-dotenv==1.0.0",
    "pydantic==2.5.3",
    "python-dateutil==2.8.2",
    "click>=8.0.0",
    "pyyaml>=6.0",

    # Monitoring and logging
    "structlog==23.2.0",
    "prometheus-client==0.19.0",

    # Math and statistics
    "scipy==1.11.4",
    "scikit-learn==1.3.2",
]

# ═══════════════════════════════════════════════════════════
# OPTIONAL DEPENDENCIES (Groups)
# ═══════════════════════════════════════════════════════════

[project.optional-dependencies]
# Development tools
dev = [
    "pytest==8.0.0",
    "pytest-asyncio==0.23.2",
    "pytest-cov==4.1.0",
    "black==23.11.0",
    "flake8==6.1.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

# Documentation
docs = [
    "mkdocs==1.5.3",
    "mkdocs-material==9.4.8",
]

# Orchestrator-only dependencies (lightweight)
orchestrator = [
    "dagster==1.8.8",
    "dagster-webserver==1.8.8",
    "dagster-postgres==0.24.8",
    "dagster-dlt==0.23.8",
    "psycopg[binary]==3.1.13",
    "httpx==0.26.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "python-dotenv==1.0.0",
    "pydantic==2.5.3",
    "structlog==23.2.0",
    "prometheus-client==0.19.0",
    "dlt==0.4.12",  # Minimal DLT (no heavy destinations)
]

# Worker-only dependencies (full stack)
worker = [
    "dagster==1.8.8",
    "dagster-dlt==0.23.8",
    "psycopg[binary]==3.1.13",
    "neo4j==5.15.0",
    "httpx==0.26.0",
    "tenacity==8.2.3",
    "redis==5.0.1",
    "dlt[postgres,filesystem,duckdb]==0.4.12",
    "jsonpath-ng==1.6.1",
    "psutil==5.9.6",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "boto3==1.34.0",
    "botocore==1.34.0",
    "s3fs==2024.3.1",
    "pandas==2.2.0",
    "pyarrow==15.0.0",
    "numpy==1.26.0",
    "geopandas==0.14.0",
    "shapely==2.0.2",
    "pyproj==3.6.1",
    "rdflib==7.0.0",
    "owlrl==6.0.2",
    "owslib==0.29.2",
    "requests==2.31.0",
    "python-dotenv==1.0.0",
    "pydantic==2.5.3",
    "python-dateutil==2.8.2",
    "structlog==23.2.0",
    "prometheus-client==0.19.0",
    "scipy==1.11.4",
    "scikit-learn==1.3.2",
]

# All dependencies (for local development)
all = [
    "hubeau-pipeline[dev,docs]",
]

# ═══════════════════════════════════════════════════════════
# BUILD SYSTEM (PEP 517/518)
# ═══════════════════════════════════════════════════════════

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ═══════════════════════════════════════════════════════════
# TOOL CONFIGURATIONS
# ═══════════════════════════════════════════════════════════

[tool.dagster]
module_name = "hubeau_pipeline"

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 120
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true for stricter typing
ignore_missing_imports = true
