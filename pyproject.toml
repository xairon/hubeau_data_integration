# Hub'Eau Data Pipeline
# Simple PostgreSQL ingestion pipeline

[project]
name = "hubeau-pipeline"
version = "1.0.0"
description = "Hub'Eau data pipeline - Simple PostgreSQL ingestion with Dagster"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Nicolas Ringuet"}
]
keywords = ["data-pipeline", "dagster", "hubeau", "water-data", "postgresql"]

# ═══════════════════════════════════════════════════════════
# CORE DEPENDENCIES (Production)
# ═══════════════════════════════════════════════════════════

dependencies = [
    # Core Dagster
    "dagster==1.11.14",
    "dagster-webserver==1.11.14",
    "dagster-postgres==0.27.14",
    "dagster-dlt==0.27.14",  # Dagster-DLT integration
    "dagster-dbt==0.27.14",  # Dagster-DBT integration
    "dbt-core==1.7.0",
    "dbt-postgres==1.7.0",

    # DLT with destinations
    "dlt[postgres,filesystem]==0.4.12",
    "jsonpath-ng==1.6.1",
    "psutil==5.9.6",

    # Database clients
    "psycopg[binary]==3.1.13",

    # HTTP and caching
    "httpx==0.26.0",
    "tenacity==8.2.3",
    "redis==5.0.1",
    "requests==2.31.0",

    # S3/MinIO
    "boto3==1.34.0",
    "botocore==1.34.0",
    "s3fs==2024.3.1",

    # Data processing
    "pandas==2.2.0",
    "pyarrow==15.0.0",
    "numpy==1.26.0",

    # Geospatial (PostGIS load: geopandas.to_postgis, read_file gpkg)
    "geopandas==0.14.0",
    "shapely==2.0.2",
    "pyproj==3.6.1",
    "pyogrio>=0.7.0,<0.13",
    "sqlalchemy>=2.0.0",
    "geoalchemy2>=0.14.0",

    # Utilities
    "python-dotenv==1.0.0",
    "protobuf<5.0.0",  # Fix for dbt/google-api compatibility
    "pydantic==2.5.3",
    "python-dateutil==2.8.2",
    "click>=8.0.0",
    "pyyaml>=6.0",

    # ERA5 / Copernicus CDS
    # Updated to new CADS API client (December 2024)
    # Note: cads-api-client requires cdsapi for legacy compatibility
    "cads-api-client>=1.0.0",
    "cdsapi>=0.7.7",  # Required by cads-api-client.legacy_api_client
    "xarray>=2023.12.0",  # NetCDF data processing
    "h5py>=3.10.0",  # HDF5 support (required by h5netcdf)
    "h5netcdf>=1.3.0",  # NetCDF engine for xarray
    "netCDF4>=1.6.5",  # Alternative NetCDF engine

    # Monitoring and logging
    "structlog==23.2.0",
    "prometheus-client==0.19.0",

    # ML — SoftCLT embeddings + MiniRocket univariate
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "hdbscan>=0.8.33",
    "umap-learn>=0.5.0",
    "optuna>=3.0.0",
    "aeon>=1.0.0",
    "pastas>=1.7.0",
]

# ═══════════════════════════════════════════════════════════
# OPTIONAL DEPENDENCIES (Groups)
# ═══════════════════════════════════════════════════════════

[project.optional-dependencies]
# Development tools
dev = [
    "pytest==8.0.0",
    "pytest-asyncio==0.23.2",
    "pytest-cov==4.1.0",
    "black==23.11.0",
    "flake8==6.1.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

# Documentation
docs = [
    "mkdocs==1.5.3",
    "mkdocs-material==9.4.8",
]

# Orchestrator-only dependencies (lightweight)
orchestrator = [
    "dagster==1.11.14",
    "dagster-webserver==1.11.14",
    "dagster-postgres==0.27.14",
    "dagster-dlt==0.27.14",
    "psycopg[binary]==3.1.13",
    "httpx==0.26.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "python-dotenv==1.0.0",
    "pydantic==2.5.3",
    "structlog==23.2.0",
    "prometheus-client==0.19.0",
    "dlt==0.4.12",  # Minimal DLT (no heavy destinations)
]

# Worker-only dependencies (full stack)
worker = [
    "dagster==1.11.14",
    "dagster-dlt==0.27.14",
    "dagster-dbt==0.27.14",
    "psycopg[binary]==3.1.13",
    "httpx==0.26.0",
    "tenacity==8.2.3",
    "redis==5.0.1",
    "dlt[postgres,filesystem]==0.4.12",
    "jsonpath-ng==1.6.1",
    "psutil==5.9.6",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "boto3==1.34.0",
    "botocore==1.34.0",
    "s3fs==2024.3.1",
    "pandas==2.2.0",
    "pyarrow==15.0.0",
    "numpy==1.26.0",
    "geopandas==0.14.0",
    "shapely==2.0.2",
    "pyproj==3.6.1",
    "pyogrio>=0.7.0,<0.13",
    "requests==2.31.0",
    "python-dotenv==1.0.0",
    "protobuf<5.0.0",  # Fix for dbt/google-api compatibility
    "pydantic==2.5.3",
    "python-dateutil==2.8.2",
    "structlog==23.2.0",
    "prometheus-client==0.19.0",
    "cads-api-client>=1.0.0",  # Updated to new CADS API
    "cdsapi>=0.7.7",  # Required by cads-api-client
    "xarray>=2023.12.0",  # NetCDF data processing
    "h5py>=3.10.0",  # HDF5 support (required by h5netcdf)
    "h5netcdf>=1.3.0",  # NetCDF engine for xarray
    "netCDF4>=1.6.5",  # Alternative NetCDF engine
    "dbt-core==1.7.0",
    "dbt-postgres==1.7.0",
    # ML — SoftCLT embeddings
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "hdbscan>=0.8.33",
    "umap-learn>=0.5.0",
    "optuna>=3.0.0",
    "pastas>=1.7.0",
]

# All dependencies (for local development)
all = [
    "hubeau-pipeline[dev,docs]",
]

# ═══════════════════════════════════════════════════════════
# BUILD SYSTEM (PEP 517/518)
# ═══════════════════════════════════════════════════════════

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ═══════════════════════════════════════════════════════════
# TOOL CONFIGURATIONS
# ═══════════════════════════════════════════════════════════

[tool.dagster]
module_name = "hubeau_pipeline"

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | known_failures
)/
'''

[tool.ruff]
line-length = 120
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true for stricter typing
ignore_missing_imports = true
