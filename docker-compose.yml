# Hub'Eau Pipeline - Docker Compose Configuration
# Production & Development deployment
# Hot reload enabled: edit code → save → reload in UI (2-3s)

services:
  # Dagster metadata database
  dagster_postgres:
    image: postgres:16-alpine
    container_name: brgm-dagster-postgres
    environment:
      POSTGRES_PASSWORD: ${DAGSTER_PG_PASSWORD}
      POSTGRES_DB: dagster
    volumes:
      - dagster_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d dagster"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Hub'Eau database (PostGIS)
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: brgm-postgres
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-scripts/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # DLT Worker - Pipeline execution
  dlt_worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    image: hubeau-worker:latest
    container_name: brgm-dlt-worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DAGSTER_HOME: /app/dagster_home
      PYTHONPATH: /app/src:/app
      PYTHONDONTWRITEBYTECODE: 1  # Prevent .pyc creation for clean reloads
      # Database credentials
      PG_HOST: ${PG_HOST}
      PG_PORT: ${PG_PORT}
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      POSTGIS_HOST: ${POSTGIS_HOST}
      POSTGIS_PORT: ${POSTGIS_PORT}
      POSTGIS_DB: ${POSTGIS_DB}
      POSTGIS_USER: ${POSTGIS_USER}
      POSTGIS_PASSWORD: ${POSTGIS_PASSWORD}
      # Hub'Eau schema
      HUBEAU_SCHEMA: ${HUBEAU_SCHEMA}
      HUBEAU_SCHEMA_DIR: /app/scripts/schema
      # DLT PostgreSQL destination credentials
      DESTINATION__POSTGRES__CREDENTIALS__DATABASE: ${PG_DB}
      DESTINATION__POSTGRES__CREDENTIALS__USERNAME: ${PG_USER}
      DESTINATION__POSTGRES__CREDENTIALS__PASSWORD: ${PG_PASSWORD}
      DESTINATION__POSTGRES__CREDENTIALS__HOST: ${PG_HOST}
      DESTINATION__POSTGRES__CREDENTIALS__PORT: ${PG_PORT}
    volumes:
      # Hot reload: mount source code (remove for production)
      - ./src:/app/src
      - ./configs:/app/configs
      - ./scripts:/app/scripts
      - ./dagster_home:/app/dagster_home
      - ./data/csv_inbox:/app/data/csv_inbox
      - ./data/csv_archive:/app/data/csv_archive
    command: ["dagster", "code-server", "start", "-h", "0.0.0.0", "-p", "4000", "-f", "/app/src/hubeau_pipeline/grpc_server.py"]
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 4000)); s.close()"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: unless-stopped

  # Dagster Web UI
  dagster_webserver:
    build:
      context: .
      dockerfile: docker/orchestrator/Dockerfile
    image: hubeau-orchestrator:latest
    container_name: brgm-dagster-webserver
    depends_on:
      dagster_postgres:
        condition: service_healthy
      dlt_worker:
        condition: service_healthy
    environment:
      DAGSTER_HOME: /app/dagster_home
      PYTHONDONTWRITEBYTECODE: 1  # Prevent .pyc creation for clean reloads
      DAGSTER_PG_HOST: ${DAGSTER_PG_HOST}
      DAGSTER_PG_PORT: ${DAGSTER_PG_PORT}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB}
      DAGSTER_PG_USER: ${DAGSTER_PG_USER}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD}
      PYTHONPATH: /app
      # Application database credentials
      PG_HOST: ${PG_HOST}
      PG_PORT: ${PG_PORT}
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      HUBEAU_SCHEMA_DIR: /app/scripts/schema
    volumes:
      - ./dagster_home:/app/dagster_home
      - ./configs:/app/configs:ro
      - ./scripts:/app/scripts:ro
      - ./data/csv_inbox:/app/data/csv_inbox:ro
      - ./data/csv_archive:/app/data/csv_archive:ro
    command: ["dagster-webserver","-h","0.0.0.0","-p","3000","-w","/app/dagster_home/workspace.yaml"]
    ports:
      - "8080:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/server_info || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # Dagster Daemon - Schedules & Sensors
  dagster_daemon:
    image: hubeau-orchestrator:latest
    container_name: brgm-dagster-daemon
    depends_on:
      dagster_postgres:
        condition: service_healthy
      dlt_worker:
        condition: service_healthy
    environment:
      DAGSTER_HOME: /app/dagster_home
      PYTHONDONTWRITEBYTECODE: 1  # Prevent .pyc creation for clean reloads
      DAGSTER_PG_HOST: ${DAGSTER_PG_HOST}
      DAGSTER_PG_PORT: ${DAGSTER_PG_PORT}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB}
      DAGSTER_PG_USER: ${DAGSTER_PG_USER}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD}
      PYTHONPATH: /app
      # Application database credentials
      PG_HOST: ${PG_HOST}
      PG_PORT: ${PG_PORT}
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      HUBEAU_SCHEMA_DIR: /app/scripts/schema
    volumes:
      - ./dagster_home:/app/dagster_home
      - ./configs:/app/configs:ro
      - ./scripts:/app/scripts:ro
      - ./data/csv_inbox:/app/data/csv_inbox:ro
      - ./data/csv_archive:/app/data/csv_archive:ro
    command: ["dagster-daemon","run"]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # Adminer - PostgreSQL Web UI
  adminer:
    image: adminer:latest
    container_name: brgm-adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark

  # Portainer - Docker management UI
  portainer:
    image: portainer/portainer-ce:latest
    container_name: brgm-portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  postgres_data:
    driver: local
  dagster_pg_data:
    driver: local
  portainer_data:
    driver: local
