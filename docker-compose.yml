# Hub'Eau Pipeline - Docker Compose Configuration
# Zero-config deployment: git clone → docker compose build → docker compose up -d
# Optional .env file for custom values (fallback to defaults if not present)

services:
  # Dagster metadata database
  dagster_postgres:
    image: postgres:16-alpine
    container_name: brgm-dagster-postgres
    environment:
      POSTGRES_PASSWORD: ${DAGSTER_PG_PASSWORD}
      POSTGRES_DB: dagster
    volumes:
      - dagster_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d dagster" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    mem_limit: 1G
    restart: unless-stopped

  # Hub'Eau database (PostGIS + TimescaleDB)
  # ATTENTION: Ne PAS ajouter de "command:" sur l'image HA - cela bypass l'entrypoint Patroni !
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: brgm-postgres
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB:-postgres}
      POSTGRES_USER: ${PG_USER:-postgres}
    volumes:
      - postgres_data:/home/postgres/pgdata
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "49502:5432" # PostgreSQL - fixed port
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    shm_size: 5g  # requis pour shared_buffers=4GB (défaut Docker=64MB → crash)
    mem_limit: 48G  # plafond burst (baseline ~4GB idle, pic ~20GB pendant dbt)
    restart: unless-stopped

  # PostgreSQL Performance Tuning (via Patroni REST API)
  # Runs once after postgres is healthy - settings persist across restarts
  postgres_tuning:
    image: python:3-alpine
    container_name: brgm-postgres-tuning
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${PG_USER:-postgres}
      PGPASSWORD: ${PG_PASSWORD}
      PGDATABASE: ${PG_DB:-postgres}
    volumes:
      - ./docker/postgres/apply-tuning.py:/app/apply-tuning.py:ro
    command: ["python", "/app/apply-tuning.py"]
    restart: "no"

  # DLT Worker - Pipeline execution (GPU-enabled for ML embeddings)
  dlt_worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    image: hubeau-worker:latest
    container_name: brgm-dlt-worker
    depends_on:
      postgres:
        condition: service_healthy
      dagster_postgres:
        condition: service_healthy
    # NB: pas de bloc deploy.resources.devices nvidia — aucune dépendance GPU
    # (ni torch ni cuda dans pyproject.toml ou src/). La réservation présente
    # auparavant faisait échouer `docker compose up` sur toute machine sans
    # nvidia-container-toolkit, avec « could not select device driver "nvidia" ».
    environment:
      DAGSTER_HOME: /app/dagster_home
      PYTHONPATH: /app/src:/app
      PYTHONDONTWRITEBYTECODE: 1
      # Dagster storage database (used by dagster.yaml for run storage, event logs, sensors)
      DAGSTER_PG_HOST: ${DAGSTER_PG_HOST:-dagster_postgres}
      DAGSTER_PG_PORT: ${DAGSTER_PG_PORT:-5432}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
      DAGSTER_PG_USER: ${DAGSTER_PG_USER:-postgres}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD}
      # Application database credentials
      PG_HOST: ${PG_HOST:-postgres}
      PG_PORT: ${PG_PORT:-5432}
      PG_DB: ${PG_DB:-postgres}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD}
      # Hub'Eau schema
      HUBEAU_SCHEMA: ${HUBEAU_SCHEMA:-hubeau}
      HUBEAU_SCHEMA_DIR: /app/scripts/schema
      # DLT PostgreSQL destination credentials
      DESTINATION__POSTGRES__CREDENTIALS__DATABASE: ${PG_DB:-postgres}
      DESTINATION__POSTGRES__CREDENTIALS__USERNAME: ${PG_USER:-postgres}
      DESTINATION__POSTGRES__CREDENTIALS__PASSWORD: ${PG_PASSWORD}
      DESTINATION__POSTGRES__CREDENTIALS__HOST: ${PG_HOST:-postgres}
      DESTINATION__POSTGRES__CREDENTIALS__PORT: ${PG_PORT:-5432}
      # ERA5 Copernicus CDS API key
      COPERNICUS_API_KEY: ${COPERNICUS_API_KEY:-}
      # Force dbt parse on load to ensure manifest is fresh (fixes KeyError on tests)
      DAGSTER_DBT_PARSE_PROJECT_ON_LOAD: "1"
      # Scheduling: sensors drive dbt chain, schedules drive Bronze ingestion
      DAGSTER_ENABLE_SCHEDULES: ${DAGSTER_ENABLE_SCHEDULES:-true}
      DAGSTER_ENABLE_SENSORS: ${DAGSTER_ENABLE_SENSORS:-true}
    volumes:
      # Hot reload: mount source code
      - ./src:/app/src
      - ./configs:/app/configs
      - ./scripts:/app/scripts
      - ./dagster_home:/app/dagster_home
    command: [ "dagster", "code-server", "start", "-h", "0.0.0.0", "-p", "4000", "-m", "hubeau_pipeline.definitions" ]
    ports:
      - "49505:8080"   # dbt docs serve (lancer manuellement: docker exec -it brgm-dlt-worker dbt docs serve --port 8080)
    expose:
      - "4000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 4000)); s.close()" ]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    mem_limit: 32G  # dbt + ML training (GPU VRAM separate; training pads 2936 series → ~12-16G RAM peak)
    restart: unless-stopped

  # Dagster Web UI
  # ⚠️ NO USER CODE — communicates with worker (code location) via GRPC
  dagster_webserver:
    build:
      context: .
      dockerfile: docker/orchestrator/Dockerfile
    image: hubeau-orchestrator:latest
    container_name: brgm-dagster-webserver
    depends_on:
      dagster_postgres:
        condition: service_healthy
      dlt_worker:
        condition: service_healthy
    environment:
      DAGSTER_HOME: /app/dagster_home
      DAGSTER_PG_HOST: ${DAGSTER_PG_HOST:-dagster_postgres}
      DAGSTER_PG_PORT: ${DAGSTER_PG_PORT:-5432}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
      DAGSTER_PG_USER: ${DAGSTER_PG_USER:-postgres}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD}
    volumes:
      - ./dagster_home:/app/dagster_home
    command: [ "dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/app/dagster_home/workspace.yaml" ]
    ports:
      - "49500:3000" # Dagster UI - fixed port
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/server_info || exit 1" ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    mem_limit: 2G
    restart: unless-stopped

  # Dagster Daemon - Schedules, Sensors & Run Queue
  # ⚠️ NO USER CODE — delegates run execution to worker via GRPC
  dagster_daemon:
    image: hubeau-orchestrator:latest
    container_name: brgm-dagster-daemon
    depends_on:
      dagster_postgres:
        condition: service_healthy
      dlt_worker:
        condition: service_healthy
    environment:
      DAGSTER_HOME: /app/dagster_home
      DAGSTER_PG_HOST: ${DAGSTER_PG_HOST:-dagster_postgres}
      DAGSTER_PG_PORT: ${DAGSTER_PG_PORT:-5432}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
      DAGSTER_PG_USER: ${DAGSTER_PG_USER:-postgres}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD}
    volumes:
      - ./dagster_home:/app/dagster_home
    command: [ "dagster-daemon", "run", "-w", "/app/dagster_home/workspace.yaml" ]
    healthcheck:
      test: [ "CMD-SHELL", "dagster-daemon liveness-check || exit 1" ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    mem_limit: 2G
    restart: unless-stopped

  # Adminer - Database Management UI
  adminer:
    image: adminer:4.8.1
    container_name: brgm-adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "49501:8080" # Adminer UI
    volumes:
      - ./docker/adminer/adminer.css:/var/www/html/adminer.css:ro
    mem_limit: 256M

volumes:
  # ============================================================================
  # VOLUMES PERSISTANTS - PROTECTION MAXIMALE CONTRE SUPPRESSION ACCIDENTELLE
  # ============================================================================
  # IMPORTANT: Les volumes externes ne sont PAS supprimés par "docker compose down -v"
  # Ils doivent être créés manuellement AVANT le premier démarrage:
  #   docker volume create brgm_postgres_data
  #   docker volume create brgm_dagster_pg_data
  # ============================================================================
  postgres_data:
    external: true
    name: brgm_postgres_data
  dagster_pg_data:
    external: true
    name: brgm_dagster_pg_data
