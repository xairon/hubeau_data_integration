# Hub'Eau Data Pipeline - Architecture Distribuée
# Orchestrator (Dagster) + Workers (DLT) + Storage + Monitoring

services:
  # ═══════════════════════════════════════════════════════════
  # ORCHESTRATION LAYER (Léger - Dagster uniquement)
  # ═══════════════════════════════════════════════════════════

  dagster_postgres:
    image: postgres:16
    container_name: dagster_postgres
    environment:
      POSTGRES_PASSWORD: ${DAGSTER_PG_PASSWORD}
      POSTGRES_DB: dagster
    volumes:
      - dagster_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d dagster"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - hubeau_network

  dagster_webserver:
    build:
      context: .
      dockerfile: docker/orchestrator/Dockerfile
    image: hubeau-orchestrator:latest
    container_name: dagster_webserver
    depends_on:
      dagster_postgres:
        condition: service_healthy
      dlt_worker:
        condition: service_healthy
    environment:
      DAGSTER_HOME: /app/dagster_home
      DAGSTER_PG_HOST: dagster_postgres
      DAGSTER_PG_DB: dagster
      DAGSTER_PG_USER: postgres
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD}
      PYTHONPATH: /app
    volumes:
      - ./dagster_home:/app/dagster_home
      - ./configs:/app/configs:ro
    command: ["dagster-webserver","-h","0.0.0.0","-p","3000","-w","/app/dagster_home/workspace.yaml"]
    ports:
      - "8080:3000"
    networks:
      - hubeau_network

  dagster_daemon:
    image: hubeau-orchestrator:latest
    container_name: dagster_daemon
    depends_on:
      dagster_postgres:
        condition: service_healthy
      dlt_worker:
        condition: service_healthy
    environment:
      DAGSTER_HOME: /app/dagster_home
      DAGSTER_PG_HOST: dagster_postgres
      DAGSTER_PG_DB: dagster
      DAGSTER_PG_USER: postgres
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD}
      PYTHONPATH: /app
    volumes:
      - ./dagster_home:/app/dagster_home
      - ./configs:/app/configs:ro
    command: ["dagster-daemon","run"]
    networks:
      - hubeau_network

  # ═══════════════════════════════════════════════════════════
  # EXECUTION LAYER (Lourd - DLT Workers avec scaling)
  # ═══════════════════════════════════════════════════════════

  dlt_worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    image: hubeau-worker:latest
    container_name: dlt_worker
    environment:
      DAGSTER_HOME: /app/dagster_home
      PYTHONPATH: /app/src:/app
      # Database credentials
      PG_PASSWORD: ${PG_PASSWORD}
      PG_HOST: ${PG_HOST:-postgres}
      PG_PORT: ${PG_PORT:-5432}
      PG_DB: ${PG_DB:-postgres}
      PG_USER: ${PG_USER:-postgres}
      # Hub'Eau schema
      HUBEAU_SCHEMA: ${HUBEAU_SCHEMA:-hubeau}
      # DLT PostgreSQL destination credentials
      DESTINATION__POSTGRES__CREDENTIALS__DATABASE: ${PG_DB:-postgres}
      DESTINATION__POSTGRES__CREDENTIALS__USERNAME: ${PG_USER:-postgres}
      DESTINATION__POSTGRES__CREDENTIALS__PASSWORD: ${PG_PASSWORD}
      DESTINATION__POSTGRES__CREDENTIALS__HOST: ${PG_HOST:-postgres}
      DESTINATION__POSTGRES__CREDENTIALS__PORT: ${PG_PORT:-5432}
      # Prometheus metrics
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs:ro
      - ./scripts:/app/scripts:ro
      - ./dagster_home:/app/dagster_home:ro
    command: ["dagster", "api", "grpc", "-h", "0.0.0.0", "-p", "4000", "-m", "hubeau_pipeline"]
    expose:
      - "4000"  # GRPC API (internal)
      - "9091"  # Prometheus metrics
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 4000)); s.close()"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    deploy:
      replicas: 1  # ✅ Augmente à 2-3 pour scaling horizontal
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    networks:
      - hubeau_network

  # ═══════════════════════════════════════════════════════════
  # DATA STORAGE LAYER
  # ═══════════════════════════════════════════════════════════

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-scripts/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - hubeau_network

  postgis:
    image: postgis/postgis:16-3.4
    container_name: postgis
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./docker/init-scripts/postgis:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - hubeau_network

  # ═══════════════════════════════════════════════════════════
  # MONITORING LAYER (Observability)
  # ═══════════════════════════════════════════════════════════

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - hubeau_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - hubeau_network

  # ═══════════════════════════════════════════════════════════
  # UTILITIES
  # ═══════════════════════════════════════════════════════════

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@brgm.fr
      PGADMIN_DEFAULT_PASSWORD: BrgmPgAdmin2024!
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    depends_on:
      - postgres
      - postgis
    networks:
      - hubeau_network

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      postgres:
        condition: service_healthy
      postgis:
        condition: service_healthy
    networks:
      - hubeau_network

# ═══════════════════════════════════════════════════════════
# VOLUMES
# ═══════════════════════════════════════════════════════════

volumes:
  dagster_pg: {}
  postgres_data: {}
  postgis_data: {}
  prometheus_data: {}
  grafana_data: {}

# ═══════════════════════════════════════════════════════════
# NETWORKS
# ═══════════════════════════════════════════════════════════

networks:
  hubeau_network:
    driver: bridge
