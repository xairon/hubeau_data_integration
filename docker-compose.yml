version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: brgm-postgres-1
    environment:
      POSTGRES_USER: hubeau_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hubeau_password}
      POSTGRES_DB: hubeau_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-scripts/postgres:/docker-entrypoint-initdb.d
      - ./docker/postgres.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubeau_user -d hubeau_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
