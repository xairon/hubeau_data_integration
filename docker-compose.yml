# Hub'Eau Pipeline - Docker Compose Configuration
# Zero-config deployment: git clone → docker compose build → docker compose up -d
# Optional .env file for custom values (fallback to defaults if not present)

services:
  # Dagster metadata database
  # Dagster metadata database
  dagster_postgres:
    image: postgres:16-alpine
    container_name: brgm-dagster-postgres
    environment:
      POSTGRES_PASSWORD: ${DAGSTER_PG_PASSWORD:-REDACTED}
      POSTGRES_DB: dagster
    volumes:
      - dagster_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d dagster" ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Hub'Eau database (PostGIS + TimescaleDB)
  # ATTENTION: Ne PAS ajouter de "command:" sur l'image HA - cela bypass l'entrypoint Patroni !
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: brgm-postgres
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:-REDACTED}
      POSTGRES_DB: ${PG_DB:-postgres}
      POSTGRES_USER: ${PG_USER:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "49502:5432" # PostgreSQL - fixed port
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # DLT Worker - Pipeline execution
  dlt_worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    image: hubeau-worker:latest
    container_name: brgm-dlt-worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DAGSTER_HOME: /app/dagster_home
      PYTHONPATH: /app/src:/app
      PYTHONDONTWRITEBYTECODE: 1
      # Database credentials
      PG_HOST: ${PG_HOST:-postgres}
      PG_PORT: ${PG_PORT:-5432}
      PG_DB: ${PG_DB:-postgres}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-REDACTED}
      POSTGIS_HOST: ${POSTGIS_HOST:-postgres}
      POSTGIS_PORT: ${POSTGIS_PORT:-5432}
      POSTGIS_DB: ${POSTGIS_DB:-postgres}
      POSTGIS_USER: ${POSTGIS_USER:-postgres}
      POSTGIS_PASSWORD: ${POSTGIS_PASSWORD:-REDACTED}
      # Hub'Eau schema
      HUBEAU_SCHEMA: ${HUBEAU_SCHEMA:-hubeau}
      HUBEAU_SCHEMA_DIR: /app/scripts/schema
      # DLT PostgreSQL destination credentials
      DESTINATION__POSTGRES__CREDENTIALS__DATABASE: ${PG_DB:-postgres}
      DESTINATION__POSTGRES__CREDENTIALS__USERNAME: ${PG_USER:-postgres}
      DESTINATION__POSTGRES__CREDENTIALS__PASSWORD: ${PG_PASSWORD:-REDACTED}
      DESTINATION__POSTGRES__CREDENTIALS__HOST: ${PG_HOST:-postgres}
      DESTINATION__POSTGRES__CREDENTIALS__PORT: ${PG_PORT:-5432}
      # Force dbt parse on load to ensure manifest is fresh (fixes KeyError on tests)
      DAGSTER_DBT_PARSE_PROJECT_ON_LOAD: "1"
    volumes:
      # Hot reload: mount source code
      - ./src:/app/src
      - ./configs:/app/configs
      - ./scripts:/app/scripts
      - ./dagster_home:/app/dagster_home
    command: [ "dagster", "code-server", "start", "-h", "0.0.0.0", "-p", "4000", "-m", "hubeau_pipeline.definitions" ]
    expose:
      - "4000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 4000)); s.close()" ]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: unless-stopped

  # Dagster Web UI
  dagster_webserver:
    build:
      context: .
      dockerfile: docker/orchestrator/Dockerfile
    image: hubeau-orchestrator:latest
    container_name: brgm-dagster-webserver
    depends_on:
      dagster_postgres:
        condition: service_healthy
      dlt_worker:
        condition: service_healthy
    environment:
      DAGSTER_HOME: /app/dagster_home
      PYTHONDONTWRITEBYTECODE: 1
      DAGSTER_PG_HOST: ${DAGSTER_PG_HOST:-dagster_postgres}
      DAGSTER_PG_PORT: ${DAGSTER_PG_PORT:-5432}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
      DAGSTER_PG_USER: ${DAGSTER_PG_USER:-postgres}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD:-REDACTED}
      PYTHONPATH: /app
      # Application database credentials
      PG_HOST: ${PG_HOST:-postgres}
      PG_PORT: ${PG_PORT:-5432}
      PG_DB: ${PG_DB:-postgres}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-REDACTED}
      HUBEAU_SCHEMA_DIR: /app/scripts/schema
    volumes:
      - ./dagster_home:/app/dagster_home
      - ./configs:/app/configs:ro
      - ./scripts:/app/scripts:ro
    command: [ "dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/app/dagster_home/workspace.yaml" ]
    ports:
      - "49500:3000" # Dagster UI - fixed port
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/server_info || exit 1" ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # Dagster Daemon - Schedules & Sensors
  dagster_daemon:
    image: hubeau-orchestrator:latest
    container_name: brgm-dagster-daemon
    depends_on:
      dagster_postgres:
        condition: service_healthy
      dlt_worker:
        condition: service_healthy
    environment:
      DAGSTER_HOME: /app/dagster_home
      PYTHONDONTWRITEBYTECODE: 1
      DAGSTER_PG_HOST: ${DAGSTER_PG_HOST:-dagster_postgres}
      DAGSTER_PG_PORT: ${DAGSTER_PG_PORT:-5432}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
      DAGSTER_PG_USER: ${DAGSTER_PG_USER:-postgres}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD:-REDACTED}
      PYTHONPATH: /app
      # Application database credentials
      PG_HOST: ${PG_HOST:-postgres}
      PG_PORT: ${PG_PORT:-5432}
      PG_DB: ${PG_DB:-postgres}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-REDACTED}
      HUBEAU_SCHEMA_DIR: /app/scripts/schema
    volumes:
      - ./dagster_home:/app/dagster_home
      - ./configs:/app/configs:ro
      - ./scripts:/app/scripts:ro
    command: [ "dagster-daemon", "run" ]
    healthcheck:
      test: [ "CMD-SHELL", "dagster-daemon health-check || exit 1" ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # Adminer - Database Management UI
  adminer:
    image: adminer:latest
    container_name: brgm-adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "49501:8080" # Adminer UI

  # Redis - Cache for Superset
  redis:
    image: redis:7-alpine
    container_name: brgm-redis
    restart: unless-stopped

  # CloudBeaver - Web SQL Client
  cloudbeaver:
    image: dbeaver/cloudbeaver:24.3.0
    container_name: brgm-cloudbeaver
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "49503:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
      # Mount initial configuration to workspace (auto-configure)
      - ./docker/cloudbeaver/data-sources.json:/opt/cloudbeaver/workspace/GlobalConfiguration/data-sources.json
    restart: unless-stopped

  # Apache Superset - BI & Visualization
  superset:
    image: apache/superset:4.0.0
    container_name: brgm-superset
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY:-your-secret-key-change-in-production}"
      # Connect to the main postgres container, separate DB 'superset'
      SUPERSET_SQLALCHEMY_DATABASE_URI: "postgresql://postgres:${PG_PASSWORD:-REDACTED}@postgres:5432/superset"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      SUPERSET_CONFIG_PATH: "/app/superset_config.py"
      # Admin credentials (used by docker-init.sh)
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@hubeau.com}
    volumes:
      - ./docker/superset/superset_config.py:/app/superset_config.py
      - ./docker/superset/docker-init.sh:/app/docker-init.sh
      - ./docker/superset/datasources.yaml:/app/datasources.yaml
    ports:
      - "49504:8088"
    entrypoint: [ "/bin/bash", "-c", "cp /app/docker-init.sh /tmp/docker-init.sh && chmod +x /tmp/docker-init.sh && sed -i 's/\\r$//' /tmp/docker-init.sh && /bin/bash /tmp/docker-init.sh" ]
    restart: unless-stopped

volumes:
  # ATTENTION: Ne JAMAIS utiliser "docker compose down -v" ou "docker system prune --volumes"
  # Ces commandes SUPPRIMENT les données !
  # Pour arrêter : docker compose down (sans -v)
  # Pour nettoyer les images : docker system prune (sans --volumes)
  postgres_data:
    driver: local
    # Pour rendre le volume "externe" (protection contre suppression accidentelle), décommenter:
    # external: true
    # Puis créer manuellement: docker volume create hubeau_data_integration_postgres_data
  dagster_pg_data:
    driver: local
  cloudbeaver_data:
    driver: local
