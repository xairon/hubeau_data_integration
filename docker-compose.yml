# Hub'Eau Pipeline - Docker Compose Configuration
# Zero-config deployment: git clone → docker compose build → docker compose up -d
# Optional .env file for custom values (fallback to defaults if not present)

services:
  # Dagster metadata database
  dagster_postgres:
    image: postgres:16-alpine
    container_name: brgm-dagster-postgres
    environment:
      POSTGRES_PASSWORD: ${DAGSTER_PG_PASSWORD:-REDACTED}
      POSTGRES_DB: dagster
    volumes:
      - dagster_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d dagster" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    mem_limit: 2G
    restart: unless-stopped

  # Hub'Eau database (PostGIS + TimescaleDB)
  # ATTENTION: Ne PAS ajouter de "command:" sur l'image HA - cela bypass l'entrypoint Patroni !
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: brgm-postgres
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:-REDACTED}
      POSTGRES_DB: ${PG_DB:-postgres}
      POSTGRES_USER: ${PG_USER:-postgres}
    volumes:
      - postgres_data:/home/postgresql/pgdata
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "49502:5432" # PostgreSQL - fixed port
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 12G
    restart: unless-stopped

  # DLT Worker - Pipeline execution
  dlt_worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    image: hubeau-worker:latest
    container_name: brgm-dlt-worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DAGSTER_HOME: /app/dagster_home
      PYTHONPATH: /app/src:/app
      PYTHONDONTWRITEBYTECODE: 1
      # Database credentials
      PG_HOST: ${PG_HOST:-postgres}
      PG_PORT: ${PG_PORT:-5432}
      PG_DB: ${PG_DB:-postgres}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-REDACTED}
      POSTGIS_HOST: ${POSTGIS_HOST:-postgres}
      POSTGIS_PORT: ${POSTGIS_PORT:-5432}
      POSTGIS_DB: ${POSTGIS_DB:-postgres}
      POSTGIS_USER: ${POSTGIS_USER:-postgres}
      POSTGIS_PASSWORD: ${POSTGIS_PASSWORD:-REDACTED}
      # Hub'Eau schema
      HUBEAU_SCHEMA: ${HUBEAU_SCHEMA:-hubeau}
      HUBEAU_SCHEMA_DIR: /app/scripts/schema
      # DLT PostgreSQL destination credentials
      DESTINATION__POSTGRES__CREDENTIALS__DATABASE: ${PG_DB:-postgres}
      DESTINATION__POSTGRES__CREDENTIALS__USERNAME: ${PG_USER:-postgres}
      DESTINATION__POSTGRES__CREDENTIALS__PASSWORD: ${PG_PASSWORD:-REDACTED}
      DESTINATION__POSTGRES__CREDENTIALS__HOST: ${PG_HOST:-postgres}
      DESTINATION__POSTGRES__CREDENTIALS__PORT: ${PG_PORT:-5432}
      # Force dbt parse on load to ensure manifest is fresh (fixes KeyError on tests)
      DAGSTER_DBT_PARSE_PROJECT_ON_LOAD: "1"
    volumes:
      # Hot reload: mount source code
      - ./src:/app/src
      - ./configs:/app/configs
      - ./scripts:/app/scripts
      - ./dagster_home:/app/dagster_home
    command: [ "dagster", "code-server", "start", "-h", "0.0.0.0", "-p", "4000", "-m", "hubeau_pipeline.definitions" ]
    ports:
      - "49505:8080"   # dbt docs serve (lancer manuellement: docker exec -it brgm-dlt-worker dbt docs serve --port 8080)
    expose:
      - "4000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 4000)); s.close()" ]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    mem_limit: 8G
    restart: unless-stopped

  # Dagster Web UI
  dagster_webserver:
    build:
      context: .
      dockerfile: docker/orchestrator/Dockerfile
    image: hubeau-orchestrator:latest
    container_name: brgm-dagster-webserver
    depends_on:
      dagster_postgres:
        condition: service_healthy
      dlt_worker:
        condition: service_healthy
    environment:
      DAGSTER_HOME: /app/dagster_home
      PYTHONDONTWRITEBYTECODE: 1
      DAGSTER_PG_HOST: ${DAGSTER_PG_HOST:-dagster_postgres}
      DAGSTER_PG_PORT: ${DAGSTER_PG_PORT:-5432}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
      DAGSTER_PG_USER: ${DAGSTER_PG_USER:-postgres}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD:-REDACTED}
      PYTHONPATH: /app
      # Application database credentials
      PG_HOST: ${PG_HOST:-postgres}
      PG_PORT: ${PG_PORT:-5432}
      PG_DB: ${PG_DB:-postgres}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-REDACTED}
      HUBEAU_SCHEMA_DIR: /app/scripts/schema
    volumes:
      - ./dagster_home:/app/dagster_home
      - ./configs:/app/configs:ro
      - ./scripts:/app/scripts:ro
    command: [ "dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/app/dagster_home/workspace.yaml" ]
    ports:
      - "49500:3000" # Dagster UI - fixed port
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/server_info || exit 1" ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    mem_limit: 2G
    restart: unless-stopped

  # Dagster Daemon - Schedules & Sensors
  dagster_daemon:
    image: hubeau-orchestrator:latest
    container_name: brgm-dagster-daemon
    depends_on:
      dagster_postgres:
        condition: service_healthy
      dlt_worker:
        condition: service_healthy
    environment:
      DAGSTER_HOME: /app/dagster_home
      PYTHONDONTWRITEBYTECODE: 1
      DAGSTER_PG_HOST: ${DAGSTER_PG_HOST:-dagster_postgres}
      DAGSTER_PG_PORT: ${DAGSTER_PG_PORT:-5432}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
      DAGSTER_PG_USER: ${DAGSTER_PG_USER:-postgres}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD:-REDACTED}
      PYTHONPATH: /app
      # Application database credentials
      PG_HOST: ${PG_HOST:-postgres}
      PG_PORT: ${PG_PORT:-5432}
      PG_DB: ${PG_DB:-postgres}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-REDACTED}
      HUBEAU_SCHEMA_DIR: /app/scripts/schema
    volumes:
      - ./dagster_home:/app/dagster_home
      - ./configs:/app/configs:ro
      - ./scripts:/app/scripts:ro
    command: [ "dagster-daemon", "run" ]
    healthcheck:
      test: [ "CMD-SHELL", "dagster-daemon health-check || exit 1" ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    mem_limit: 2G
    restart: unless-stopped

  # Adminer - Database Management UI
  adminer:
    image: adminer:latest
    container_name: brgm-adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "49501:8080" # Adminer UI
    mem_limit: 512M

  # Redis - Cache for Superset
  redis:
    image: redis:7-alpine
    container_name: brgm-redis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 512M

  # CloudBeaver - Web SQL Client
  cloudbeaver:
    image: dbeaver/cloudbeaver:24.3.0
    container_name: brgm-cloudbeaver
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "49503:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
      # Mount initial configuration to workspace (auto-configure)
      - ./docker/cloudbeaver/data-sources.json:/opt/cloudbeaver/workspace/GlobalConfiguration/data-sources.json
    mem_limit: 2G
    restart: unless-stopped

  # ============================================================================
  # Monitoring Stack (Prometheus + Grafana + cAdvisor + postgres_exporter)
  # ============================================================================

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: brgm-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "49508:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    mem_limit: 1G
    restart: unless-stopped

  # Grafana - Dashboards & Visualization
  # Login: admin / admin (change on first login)
  grafana:
    image: grafana/grafana:latest
    container_name: brgm-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "49507:3000"
    mem_limit: 512M
    restart: unless-stopped

  # cAdvisor - Docker container metrics exporter
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: brgm-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose:
      - "8080"
    mem_limit: 512M
    restart: unless-stopped

  # PostgreSQL Exporter - PG metrics for Prometheus
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: brgm-postgres-exporter
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://${PG_USER:-postgres}:${PG_PASSWORD:-REDACTED}@postgres:5432/${PG_DB:-postgres}?sslmode=disable"
    expose:
      - "9187"
    mem_limit: 256M
    restart: unless-stopped

  # Netdata - Monitoring (containers + PostgreSQL)
  # Dashboard: http://localhost:49506
  netdata:
    image: netdata/netdata:stable
    container_name: brgm-netdata
    hostname: brgm-netdata
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "49506:19999"
    volumes:
      # Host metrics (Docker Desktop Linux VM)
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      # Docker container metrics
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # PostgreSQL collector config
      - ./docker/netdata/go.d/postgres.conf:/etc/netdata/go.d/postgres.conf:ro
      # Health alerts overrides (disable noisy per-chunk TimescaleDB alerts)
      - ./docker/netdata/health.d/postgres.conf:/etc/netdata/health.d/postgres.conf:ro
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    mem_limit: 512M
    restart: unless-stopped

  # Apache Superset - BI & Visualization
  superset:
    image: apache/superset:4.0.0
    container_name: brgm-superset
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY:-your-secret-key-change-in-production}"
      # Connect to the main postgres container, separate DB 'superset'
      SUPERSET_SQLALCHEMY_DATABASE_URI: "postgresql://postgres:${PG_PASSWORD:-REDACTED}@postgres:5432/superset"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      SUPERSET_CONFIG_PATH: "/app/superset_config.py"
      # Admin credentials (used by docker-init.sh)
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@hubeau.com}
    volumes:
      - ./docker/superset/superset_config.py:/app/superset_config.py
      - ./docker/superset/docker-init.sh:/app/docker-init.sh
      - ./docker/superset/datasources.yaml:/app/datasources.yaml
    ports:
      - "49504:8088"
    entrypoint: [ "/bin/bash", "-c", "cp /app/docker-init.sh /tmp/docker-init.sh && chmod +x /tmp/docker-init.sh && sed -i 's/\\r$//' /tmp/docker-init.sh && /bin/bash /tmp/docker-init.sh" ]
    mem_limit: 4G
    restart: unless-stopped

volumes:
  # ============================================================================
  # VOLUMES PERSISTANTS - PROTECTION MAXIMALE CONTRE SUPPRESSION ACCIDENTELLE
  # ============================================================================
  # IMPORTANT: Les volumes externes ne sont PAS supprimés par "docker compose down -v"
  # Ils doivent être créés manuellement AVANT le premier démarrage:
  #   docker volume create brgm_postgres_data
  #   docker volume create brgm_dagster_pg_data
  #   docker volume create brgm_cloudbeaver_data
  # ============================================================================
  postgres_data:
    external: true
    name: brgm_postgres_data
  dagster_pg_data:
    external: true
    name: brgm_dagster_pg_data
  cloudbeaver_data:
    external: true
    name: brgm_cloudbeaver_data
