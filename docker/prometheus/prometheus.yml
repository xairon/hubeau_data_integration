## Prometheus Configuration
## Scrapes metrics from postgres_exporter and cAdvisor

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # PostgreSQL metrics via postgres_exporter
  - job_name: "postgresql"
    static_configs:
      - targets: ["postgres_exporter:9187"]

  # Docker container metrics via cAdvisor (rootless Docker - cgroup mode)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Rootless Docker: cAdvisor ne peut pas résoudre les noms de containers.
      # Les métriques ont un label id=/user.slice/.../docker-<hash>.scope
      # On extrait les 12 premiers caractères du hash comme container_id.
      # Utiliser "docker ps" pour voir la correspondance hash → nom.
      - source_labels: [id]
        regex: '.*/docker-([a-f0-9]{12})[a-f0-9]*\.scope'
        target_label: container_id
        replacement: '${1}'
