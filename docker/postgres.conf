# ========================================
# PostgreSQL optimise pour VPS 8GB RAM
# ========================================

# Connections
max_connections = 50

# Memoire (25% de 8GB = 2GB)
shared_buffers = 2GB
work_mem = 20MB
maintenance_work_mem = 256MB
effective_cache_size = 4GB

# WAL
wal_buffers = 16MB
checkpoint_timeout = 15min
max_wal_size = 2GB
min_wal_size = 512MB

# Query planner
random_page_cost = 1.1  # SSD

# Autovacuum
autovacuum = on
autovacuum_max_workers = 2
autovacuum_vacuum_cost_limit = 200

# Logging
log_min_duration_statement = 1000
log_line_prefix = '%t [%p]: [%l-1] '
