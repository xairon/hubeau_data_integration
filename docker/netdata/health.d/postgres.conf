# Désactiver les alertes cache hit ratio par chunk TimescaleDB
# Ces chunks compressés ont naturellement un faible cache hit ratio
# quand ils sont décompressés par un job (comportement normal).
# On garde uniquement l'alerte au niveau base de données globale.

# Disable per-table cache hit ratio alerts (too noisy with TimescaleDB chunks)
 alarm: postgres_table_cache_io_ratio
    on: postgres.table_cache_io_ratio
    os: *
 every: 0
  crit: 0
  warn: 0
  info: disabled - too noisy with TimescaleDB compressed chunks

# Disable per-index cache hit ratio alerts (same reason)
 alarm: postgres_index_cache_io_ratio
    on: postgres.index_cache_io_ratio
    os: *
 every: 0
  crit: 0
  warn: 0
  info: disabled - too noisy with TimescaleDB compressed chunks
