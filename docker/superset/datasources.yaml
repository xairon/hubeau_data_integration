# Format: Superset import_datasources (database_name, tables, table_name, schema, columns).
# Aligné sur les tables réellement présentes en base (bronze / silver / gold).
#
# Après modification : ré-importer les datasources :
#   docker exec <conteneur_superset> superset import_datasources -p /app/datasources.yaml
# Ou redémarrer le conteneur Superset (l'init ré-importe au démarrage).
databases:
  - database_name: Hubeau Data Warehouse
    sqlalchemy_uri: postgresql://postgres:${PG_PASSWORD:-REDACTED}@postgres:5432/postgres
    tables:
      # --- Bronze (tables existantes) ---
      - table_name: tme_entites_hydrogeo
        schema: bronze
        description: "Entités hydrogéologiques TME (brut) — calque nappes / unités aquifères"
        columns:
          - column_name: code_eh
            filterable: true
            groupby: true
          - column_name: libelle_eh
            filterable: true
            groupby: true
          - column_name: geometry
            verbose_name: "Géométrie (PostGIS)"
      # --- Silver (tables existantes) ---
      - table_name: stg_tme_entites
        schema: silver
        description: "Entités hydrogéologiques TME (silver) — calque nappes / unités aquifères"
        columns:
          - column_name: code_eh
            filterable: true
            groupby: true
          - column_name: libelle_eh
            filterable: true
            groupby: true
          - column_name: geometry
            verbose_name: "Géométrie (PostGIS)"
      - table_name: stg_piezo_stations
        schema: silver
        description: "Stations piézométriques (silver) — points avec géométrie"
        columns:
          - column_name: code_bss
            filterable: true
            groupby: true
          - column_name: geometry
            verbose_name: "Géométrie (PostGIS)"
      # --- Gold (tables existantes) ---
      - table_name: stations_piezo_carte
        schema: gold
        description: "Stations piézo prêtes carte : 1 ligne/station avec geom + TME (code_eh, libelle_eh) + alerte/tendance."
        columns:
          - column_name: code_bss
            filterable: true
            groupby: true
          - column_name: geom
            verbose_name: "Géométrie (PostGIS)"
          - column_name: code_eh
            filterable: true
            groupby: true
          - column_name: libelle_eh
            filterable: true
            groupby: true
          - column_name: niveau_alerte
            filterable: true
            groupby: true
          - column_name: tendance_classification
            filterable: true
            groupby: true
          - column_name: nom_commune
            filterable: true
            groupby: true
          - column_name: nom_departement
            filterable: true
            groupby: true
      - table_name: int_era5_grid_points
        schema: gold
        description: "Grille ERA5 (points) — calque météo"
        columns:
          - column_name: era5_latitude
          - column_name: era5_longitude
          - column_name: geom
            verbose_name: "Géométrie (PostGIS)"
      - table_name: hubeau_daily_chroniques
        schema: gold
        description: "Chroniques quotidiennes piézo : 1 ligne = 1 station × 1 jour. Piézo + météo ERA5 + TME (code_eh, libelle_eh)."
        main_dttm_col: date
        columns:
          - column_name: date
            is_dttm: true
            filterable: true
            groupby: true
          - column_name: code_bss
            filterable: true
            groupby: true
          - column_name: niveau_nappe_eau
            verbose_name: "Niveau Nappe (m NGF)"
            is_metric: true
          - column_name: temperature_2m
            verbose_name: "Température (°C)"
            is_metric: true
          - column_name: total_precipitation
            verbose_name: "Précipitations (m)"
            is_metric: true
          - column_name: nom_departement
            filterable: true
            groupby: true
          - column_name: nom_commune
            filterable: true
            groupby: true
      - table_name: dim_piezo_stations
        schema: gold
        description: "Stations piézométriques (points) — calque stations piézo"
        columns:
          - column_name: geom
            verbose_name: "Géométrie (PostGIS)"
          - column_name: code_bss
            filterable: true
            groupby: true
          - column_name: nom_departement
            filterable: true
            groupby: true
          - column_name: tendance_classification
            filterable: true
            groupby: true
          - column_name: niveau_alerte
            filterable: true
            groupby: true
      - table_name: fct_monthly_chroniques
        schema: gold
        description: "Chroniques mensuelles piézo : 1 ligne/station/mois (moyennes, min, max)"
        main_dttm_col: mois
        columns:
          - column_name: mois
            is_dttm: true
            filterable: true
            groupby: true
          - column_name: code_bss
            filterable: true
            groupby: true
          - column_name: niveau_moyen
            is_metric: true
          - column_name: nom_departement
            filterable: true
            groupby: true
      - table_name: fct_yearly_stats
        schema: gold
        description: "Statistiques annuelles piézo : 1 ligne/station/année (bilans, percentiles)"
        columns:
          - column_name: annee
            filterable: true
            groupby: true
          - column_name: code_bss
            filterable: true
            groupby: true
          - column_name: niveau_moyen_annuel
            is_metric: true
          - column_name: nom_departement
            filterable: true
            groupby: true
      - table_name: int_daily_measurements
        schema: gold
        description: "Mesures quotidiennes piézo agrégées (intermediate)"
      - table_name: int_era5_for_all_stations
        schema: gold
        description: "ERA5 filtré pour toutes les stations piézo + hydro (intermediate)"
      - table_name: int_station_era5_mapping
        schema: gold
        description: "Mapping stations piézo ↔ grille ERA5 + TME (code_eh, libelle_eh)"
