# Configuration Dagster pour Hub'Eau
# Limitation des runs concurrents pour éviter les conflits DLT

storage:
  postgres:
    postgres_db:
      hostname:
        env: DAGSTER_PG_HOST
      port:
        env: DAGSTER_PG_PORT
      db_name:
        env: DAGSTER_PG_DB
      username:
        env: DAGSTER_PG_USER
      password:
        env: DAGSTER_PG_PASSWORD

# Run coordinator avec limitation stricte
# DLT ne supporte pas bien les runs concurrents avec le même pipeline
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 1  # ✅ Un seul run à la fois pour éviter conflits DLT
    tag_concurrency_limits:
      - key: "dagster/concurrency_key"
        limit: 1  # Un seul run par concurrency_key

telemetry:
  enabled: false