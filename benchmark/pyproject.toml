[project]
name = "embedding-benchmark"
version = "0.1.0"
description = "Benchmark de méthodes d'embedding pour séries temporelles hydrologiques"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # DB
    "psycopg2-binary>=2.9.0",

    # Data
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",

    # ML core
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "hdbscan>=0.8.33",
    "umap-learn>=0.5.0",
    "tqdm>=4.65.0",
    "joblib>=1.3.0",

    # Methods
    "momentfm>=0.1.4",
    "chronos-forecasting>=2.0.0",
    "tsfresh>=0.20.0",

    # Viz
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",

    # UI
    "streamlit>=1.30.0",

    # Config
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embedding_benchmark"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
