# Hub'Eau Pipeline — Variante SANDBOX BUILD (test "Portainer build-from-git")
# ----------------------------------------------------------------------------
# Hypothèse à valider : l'ancienne conclusion "Portainer mutualisé interdit
# build:" reposait sur une erreur "forbidden properties" qui était en réalité
# causée par `mem_limit` (seule propriété réellement listée par compose-go ;
# `build` n'y figure PAS). mem_limit ayant été supprimé, on teste si un stack
# BUILD (sans bind mounts) passe désormais.
#
# Différences avec docker-compose.sandbox.yml :
#   - les 4 images custom sont BUILDÉES par Portainer depuis le repo Git
#     (context: ., dockerfile: ...) au lieu d'être pull depuis le registry
#   - PLUS de REGISTRY_PREFIX / IMAGE_TAG / deploy token nécessaires
#   - TOUJOURS aucun bind mount (le code est COPY dans les Dockerfiles)
#
# Si Portainer refuse le build → lire l'ERREUR EXACTE (nomme-t-elle "build" ?
# une policy bind-mount ? "forbidden properties" + quelle propriété ?).
# Sinon → revenir à docker-compose.sandbox.yml (pull registry).

services:
  # ---- Métadonnées Dagster -------------------------------------------------
  dagster_postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${DAGSTER_PG_PASSWORD}
      POSTGRES_DB: dagster
    volumes:
      - dagster_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d dagster" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  # ---- Base Hub'Eau (PostGIS + TimescaleDB) --------------------------------
  # Image custom : init.sql intégré (pas de bind mount). ATTENTION: pas de
  # "command:" sur l'image HA (bypass entrypoint Patroni).
  postgres:
    build:
      context: .
      dockerfile: docker/sandbox/postgres.Dockerfile
    image: hubeau-postgres-sandbox:sandbox
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB:-postgres}
      POSTGRES_USER: ${PG_USER:-postgres}
    volumes:
      - postgres_data:/home/postgres/pgdata
    ports:
      - "${BIND_ADDR:-0.0.0.0}:49502:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 24G        # POC : plafond réduit vs 48G en prod
    restart: unless-stopped

  # ---- Worker (exécution pipeline via GRPC) --------------------------------
  # Image custom worker : src/configs/dagster_home intégrés (pas de bind mount).
  dlt_worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    image: hubeau-worker:sandbox
    depends_on:
      - postgres
      - dagster_postgres
    environment:
      DAGSTER_HOME: /app/dagster_home
      PYTHONPATH: /app/src:/app
      PYTHONDONTWRITEBYTECODE: 1
      DAGSTER_PG_HOST: ${DAGSTER_PG_HOST:-dagster_postgres}
      DAGSTER_PG_PORT: ${DAGSTER_PG_PORT:-5432}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
      DAGSTER_PG_USER: ${DAGSTER_PG_USER:-postgres}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD}
      PG_HOST: ${PG_HOST:-postgres}
      PG_PORT: ${PG_PORT:-5432}
      PG_DB: ${PG_DB:-postgres}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD}
      POSTGIS_HOST: ${POSTGIS_HOST:-postgres}
      POSTGIS_PORT: ${POSTGIS_PORT:-5432}
      POSTGIS_DB: ${POSTGIS_DB:-postgres}
      POSTGIS_USER: ${POSTGIS_USER:-postgres}
      POSTGIS_PASSWORD: ${POSTGIS_PASSWORD}
      HUBEAU_SCHEMA: ${HUBEAU_SCHEMA:-hubeau}
      DESTINATION__POSTGRES__CREDENTIALS__DATABASE: ${PG_DB:-postgres}
      DESTINATION__POSTGRES__CREDENTIALS__USERNAME: ${PG_USER:-postgres}
      DESTINATION__POSTGRES__CREDENTIALS__PASSWORD: ${PG_PASSWORD}
      DESTINATION__POSTGRES__CREDENTIALS__HOST: ${PG_HOST:-postgres}
      DESTINATION__POSTGRES__CREDENTIALS__PORT: ${PG_PORT:-5432}
      COPERNICUS_API_KEY: ${COPERNICUS_API_KEY:-}
      DAGSTER_DBT_PARSE_PROJECT_ON_LOAD: "1"
      DAGSTER_ENABLE_SCHEDULES: ${DAGSTER_ENABLE_SCHEDULES:-true}
      DAGSTER_ENABLE_SENSORS: ${DAGSTER_ENABLE_SENSORS:-true}
      # POC : restreindre la portée du bootstrap (allowlist job_name:partition_key)
      BOOTSTRAP_PARTITIONS: ${BOOTSTRAP_PARTITIONS:-}
      BOOTSTRAP_CONTINUE_ON_ERROR: ${BOOTSTRAP_CONTINUE_ON_ERROR:-false}
    command: [ "dagster", "code-server", "start", "-h", "0.0.0.0", "-p", "4000", "-m", "hubeau_pipeline.definitions" ]
    expose:
      - "4000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 4000)); s.close()" ]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 16G        # POC : dbt only (plus d'entraînement ML)
    restart: unless-stopped

  # ---- Dagster Web UI (NO USER CODE, GRPC → worker) ------------------------
  # Build l'image orchestrator ; le daemon la RÉUTILISE par tag.
  dagster_webserver:
    build:
      context: .
      dockerfile: docker/orchestrator/Dockerfile
    image: hubeau-orchestrator:sandbox
    depends_on:
      - dagster_postgres
      - dlt_worker
    environment:
      DAGSTER_HOME: /app/dagster_home
      DAGSTER_PG_HOST: ${DAGSTER_PG_HOST:-dagster_postgres}
      DAGSTER_PG_PORT: ${DAGSTER_PG_PORT:-5432}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
      DAGSTER_PG_USER: ${DAGSTER_PG_USER:-postgres}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD}
    command: [ "dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/app/dagster_home/workspace.yaml" ]
    ports:
      - "${BIND_ADDR:-0.0.0.0}:49500:3000"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/server_info || exit 1" ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

  # ---- Dagster Daemon (schedules + sensors + run queue) --------------------
  # Pas de build : réutilise l'image orchestrator buildée par dagster_webserver.
  dagster_daemon:
    image: hubeau-orchestrator:sandbox
    depends_on:
      - dagster_postgres
      - dlt_worker
    environment:
      DAGSTER_HOME: /app/dagster_home
      DAGSTER_PG_HOST: ${DAGSTER_PG_HOST:-dagster_postgres}
      DAGSTER_PG_PORT: ${DAGSTER_PG_PORT:-5432}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
      DAGSTER_PG_USER: ${DAGSTER_PG_USER:-postgres}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD}
    command: [ "dagster-daemon", "run", "-w", "/app/dagster_home/workspace.yaml" ]
    healthcheck:
      test: [ "CMD-SHELL", "dagster-daemon liveness-check || exit 1" ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

  # ---- Adminer (admin DB léger, zéro config) -------------------------------
  adminer:
    image: adminer:4.8.1
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "${BIND_ADDR:-0.0.0.0}:49501:8080"
    deploy:
      resources:
        limits:
          memory: 256M

# ----------------------------------------------------------------------------
# Volumes NOMMÉS (non-externes) : Portainer les crée automatiquement, préfixés
# par le nom du stack. Aucune reprise de données — bootstrap from scratch.
# ----------------------------------------------------------------------------
volumes:
  postgres_data:
  dagster_pg_data:
