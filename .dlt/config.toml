# Configuration DLT pour Hub'Eau
# Ce fichier contient les paramètres de configuration généraux

[sources.hubeau]
# URL de base de l'API Hub'Eau
base_url = "https://hubeau.eaufrance.fr/api"

# Limites de rate
rate_limit = 10  # requêtes par seconde
retry_count = 3   # nombre de retries
timeout = 30      # timeout en secondes

# Configuration par défaut pour la pagination
page_size = 5000  # taille de page par défaut
# max_pages non défini = pas de limite

[destinations.filesystem]
# Configuration pour MinIO/S3
bucket_url = "s3://bronze"
dataset_name = "bronze"
file_format = "parquet"
layout = "{table_name}/{load_id}.{file_id}.parquet"

# Options de partitionnement
partition_columns = []  # Pas de partitionnement par défaut

[destinations.postgres]
# Configuration PostgreSQL
database = "hubeau"
schema = "bronze"
host = "localhost"
port = 5432
# user et password doivent être dans secrets.toml

[destinations.duckdb]
# Configuration DuckDB
database = "hubeau.duckdb"
schema = "bronze"

[runtime]
# Paramètres d'exécution
log_level = "INFO"
dlthub_telemetry = false  # désactiver la télémétrie
progress = "tqdm"  # barre de progression

# Paramètres de performance
max_parallel_items = 1000
buffer_max_items = 10000

[normalizers]
# Configuration de normalisation des noms
naming_convention = "snake_case"  # Convention de nommage
json_normalizer = "relational"    # Normalisation JSON

[extract]
# Paramètres d'extraction
max_retries = 3
retry_backoff = 2.0  # Facteur de backoff exponentiel
retry_on_status = [429, 500, 502, 503, 504]

[load]
# Paramètres de chargement
raise_on_failed_jobs = false
truncate_tables_before_load = false