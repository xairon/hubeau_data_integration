# Configuration DLT optimisée pour performances
# Documentation: https://dlthub.com/docs/reference/performance

# ====================================
# NORMALIZE - Parallélisation de la normalisation
# ====================================
[normalize]
workers = 2  # ↓ Réduit à 2 workers (moins de RAM, évite OOM)
pool_type = "process"  # Utiliser multiprocessing pour vrai parallélisme

# ====================================
# LOAD - Parallélisation du chargement
# ====================================
[load]
workers = 2  # ↓ Réduit à 2 workers (moins de RAM, évite OOM)
pool_type = "process"

# ====================================
# DATA WRITER - Buffering optimisé
# ====================================
[data_writer]
buffer_max_items = 10000  # ↓ Réduit à 10K (5x moins de RAM, flush plus fréquent)
file_max_items = 50000    # ↓ Réduit à 50K (fichiers plus petits, moins de RAM)
file_max_bytes = 52428800  # ↓ Réduit à 50MB (flush plus agressif, évite OOM)
disable_compression = false

# ====================================
# RUNTIME - Configuration générale
# ====================================
[runtime]
dlthub_telemetry = false  # Désactiver télémétrie pour privacy
log_level = "INFO"
sentry_dsn = ""  # Pas de Sentry

# ====================================
# DESTINATION FILESYSTEM - Configuration Parquet
# ====================================
[destination.filesystem]
layout = "{table_name}/{load_id}.{file_id}.parquet"

# Configuration Parquet spécifique
[destination.filesystem.parquet_writer]
# PyArrow Parquet writer options
row_group_size = 50000  # ↓ Réduit à 50K lignes (moins de RAM pendant écriture)
compression = "snappy"   # Compression rapide
# compression_level = null  # Snappy n'a pas de level (commenté car null invalide en TOML)
version = "2.6"  # Version Parquet moderne
use_dictionary = true  # Dictionnaires pour colonnes répétitives
write_statistics = true  # Stats pour query optimization

# ====================================
# EXTRACT - Configuration extraction
# ====================================
[extract]
# Pas de limite sur la taille des batches
max_table_nesting = 1000

# ====================================
# EXTRACTION - Optimisations API
# ====================================
[extract.http]
retry_status_codes = [429, 500, 502, 503, 504]  # Retry sur ces codes
max_retries = 5  # Plus de retries
retry_backoff_factor = 1.5  # Backoff exponentiel
timeout = 60  # Timeout plus long pour grosses requêtes

# ====================================
# SOURCES - Configuration par défaut
# ====================================
[sources]
# Taille de page par défaut plus grande
default_page_size = 5000
max_parallel_items = 10  # Parallélisation des items

