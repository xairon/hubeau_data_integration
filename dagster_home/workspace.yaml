# Dagster Workspace Configuration
# Configuration GRPC pour architecture distribuée (orchestrator + workers)

load_from:
  # Code server distant via GRPC
  # L'orchestrator se connecte aux workers via GRPC
  # HOT RELOAD: Manual reload via Dagster UI "Reload definitions" button
  # (auto-reload not supported in this Dagster version)
  - grpc_server:
      host: dlt_worker  # Nom du service Docker
      port: 4000
      location_name: hubeau_pipeline
