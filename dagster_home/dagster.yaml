# Configuration Dagster pour Hub'Eau
# Limitation stricte des runs concurrents pour éviter les conflits DLT

storage:
  postgres:
    postgres_db:
      hostname:
        env: DAGSTER_PG_HOST
      port:
        env: DAGSTER_PG_PORT
      db_name:
        env: DAGSTER_PG_DB
      username:
        env: DAGSTER_PG_USER
      password:
        env: DAGSTER_PG_PASSWORD

# Concurrence par LANE (2026-07-08) : plusieurs runs simultanés, mais chaque pipeline
# DLT plafonné à 1 (le risque « FileNotFoundError pendant normalize » ne concerne que
# 2 runs du MÊME pipeline DLT — piézo vs hydro sont des pipelines distincts, parallèle sûr ;
# le backfill temp ERA5 n'utilise pas DLT). Objectif : le backfill historique tourne en
# parallèle SANS jamais affamer la chaîne nocturne, et à ×3 le débit (file CDS).
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 5
    tag_concurrency_limits:
      # --- Pipelines DLT : jamais 2 fois le même en parallèle ---
      - {key: "dagster/concurrency_key", value: "daily_piezometry_bronze", limit: 1}
      - {key: "dagster/concurrency_key", value: "daily_hydrometry_bronze", limit: 1}
      - {key: "dagster/concurrency_key", value: "piezometry_chroniques_bronze", limit: 1}
      - {key: "dagster/concurrency_key", value: "hydrometry_chroniques_bronze", limit: 1}
      - {key: "dagster/concurrency_key", value: "piezometry_stations_bronze", limit: 1}
      - {key: "dagster/concurrency_key", value: "hydrometry_stations_bronze", limit: 1}
      - {key: "dagster/concurrency_key", value: "reference_data_bronze", limit: 1}
      # --- dbt : chaîne transform/quality/index/docs jamais dupliquée ---
      - {key: "dagster/concurrency_key", value: "dbt_pipeline", limit: 1}
      # --- ERA5 grille (update quotidien) : 1 ---
      - {key: "dagster/concurrency_key", value: "era5_weekly", limit: 1}
      # --- Backfill historique ERA5 grille : jusqu'à 3 partitions CDS en parallèle (débit) ---
      - {key: "dagster/concurrency_key", value: "era5_historical", limit: 3}
      # --- Écriture bronze.era5_daily_temp_stats : 1 SEUL writer à la fois ---
      # Clé partagée par era5_daily_temp_update_job (nightly) ET era5_daily_temp_historical_load
      # (backfill). Empêche le doublon quand la partition de l'année courante chevauche la
      # fenêtre du nightly (table sans unicité, DELETE+INSERT non atomique). Incident 2026-07-07.
      # limit 1 ⇒ le backfill temp n'utilise qu'un slot global (≤ l'ancien limit 3) : n'affame
      # jamais la prod (clés DLT/dbt distinctes, max_concurrent_runs 5).
      - {key: "dagster/concurrency_key", value: "era5_daily_temp_write", limit: 1}

telemetry:
  enabled: false