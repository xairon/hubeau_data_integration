# Configuration Dagster pour Hub'Eau
# Limitation stricte des runs concurrents pour éviter les conflits DLT

storage:
  postgres:
    postgres_db:
      hostname:
        env: DAGSTER_PG_HOST
      port:
        env: DAGSTER_PG_PORT
      db_name:
        env: DAGSTER_PG_DB
      username:
        env: DAGSTER_PG_USER
      password:
        env: DAGSTER_PG_PASSWORD

# DLT ne supporte pas les runs concurrents avec le même pipeline
# Un seul run à la fois pour éviter les FileNotFoundError pendant normalize
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 1  # ⚠️ CRITIQUE: Un seul run pour éviter conflits DLT
    tag_concurrency_limits:
      - key: "dagster/concurrency_key"
        limit: 1

telemetry:
  enabled: false