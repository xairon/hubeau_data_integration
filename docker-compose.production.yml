# Docker Compose PRODUCTION pour VPS Hostinger (Bronze uniquement)
# Usage: docker-compose -f docker-compose.production.yml up -d

services:
  dagster_postgres:
    image: postgres:16-alpine
    container_name: brgm-dagster-postgres
    environment:
      POSTGRES_PASSWORD: ${DAGSTER_PG_PASSWORD}
      POSTGRES_DB: dagster
    volumes:
      - /srv/brgm-data/dagster_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d dagster"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.2

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: brgm-postgres
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      # Optimisations PostgreSQL pour éviter les problèmes de mémoire
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - /srv/brgm-data/postgres:/var/lib/postgresql/data
      - ./docker/init-scripts/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d postgres && psql -U postgres -d postgres -tAc 'SELECT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2

  dlt_worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    image: hubeau-worker:latest
    container_name: brgm-dlt-worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DAGSTER_HOME: /app/dagster_home
      PYTHONPATH: /app/src:/app
      # Database credentials
      PG_HOST: ${PG_HOST:-postgres}
      PG_PORT: ${PG_PORT:-5432}
      PG_DB: ${PG_DB:-postgres}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD}
      POSTGIS_HOST: ${POSTGIS_HOST:-postgis}
      POSTGIS_PORT: ${POSTGIS_PORT:-5432}
      POSTGIS_DB: ${POSTGIS_DB:-postgres}
      POSTGIS_USER: ${POSTGIS_USER:-postgres}
      POSTGIS_PASSWORD: ${PG_PASSWORD}
      # Hub'Eau schema
      HUBEAU_SCHEMA: ${HUBEAU_SCHEMA:-hubeau}
      # DLT PostgreSQL destination credentials
      DESTINATION__POSTGRES__CREDENTIALS__DATABASE: ${PG_DB:-postgres}
      DESTINATION__POSTGRES__CREDENTIALS__USERNAME: ${PG_USER:-postgres}
      DESTINATION__POSTGRES__CREDENTIALS__PASSWORD: ${PG_PASSWORD}
      DESTINATION__POSTGRES__CREDENTIALS__HOST: ${PG_HOST:-postgres}
      DESTINATION__POSTGRES__CREDENTIALS__PORT: ${PG_PORT:-5432}
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs:ro
      - ./scripts:/app/scripts:ro
      - ./dagster_home:/app/dagster_home:ro
    command: ["dagster", "api", "grpc", "-h", "0.0.0.0", "-p", "4000", "-m", "hubeau_pipeline"]
    expose:
      - "4000"  # GRPC API (internal)
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 4000)); s.close()"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: unless-stopped
    mem_limit: 2g
    cpus: 0.7

  dagster_webserver:
    build:
      context: .
      dockerfile: docker/orchestrator/Dockerfile
    image: hubeau-orchestrator:latest
    container_name: brgm-dagster-webserver
    depends_on:
      dagster_postgres:
        condition: service_healthy
      dlt_worker:
        condition: service_healthy
    environment:
      DAGSTER_HOME: /app/dagster_home
      DAGSTER_PG_HOST: ${DAGSTER_PG_HOST:-dagster_postgres}
      DAGSTER_PG_PORT: ${DAGSTER_PG_PORT:-5432}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
      DAGSTER_PG_USER: ${DAGSTER_PG_USER:-postgres}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD}
      PYTHONPATH: /app
      # Application database credentials (needed for resources.py module import)
      PG_HOST: ${PG_HOST:-postgres}
      PG_PASSWORD: ${PG_PASSWORD}
    volumes:
      - ./dagster_home:/app/dagster_home
      - ./configs:/app/configs:ro
    command: ["dagster-webserver","-h","0.0.0.0","-p","3000","-w","/app/dagster_home/workspace.yaml"]
    ports:
      - "8080:3000"
    restart: unless-stopped
    mem_limit: 1g
    cpus: 0.3

  dagster_daemon:
    image: hubeau-orchestrator:latest
    container_name: brgm-dagster-daemon
    depends_on:
      dagster_postgres:
        condition: service_healthy
      dlt_worker:
        condition: service_healthy
    environment:
      DAGSTER_HOME: /app/dagster_home
      DAGSTER_PG_HOST: ${DAGSTER_PG_HOST:-dagster_postgres}
      DAGSTER_PG_PORT: ${DAGSTER_PG_PORT:-5432}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
      DAGSTER_PG_USER: ${DAGSTER_PG_USER:-postgres}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD}
      PYTHONPATH: /app
      # Application database credentials (needed for resources.py module import)
      PG_HOST: ${PG_HOST:-postgres}
      PG_PASSWORD: ${PG_PASSWORD}
    volumes:
      - ./dagster_home:/app/dagster_home
      - ./configs:/app/configs:ro
    command: ["dagster-daemon","run"]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 0.7

  adminer:
    image: adminer:latest
    container_name: brgm-adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    mem_limit: 256m
    cpus: 0.1

# Pas de volumes nommés : tout est dans /srv/brgm-data/ pour faciliter les backups
# NOTE: Portainer est installé séparément sur le serveur, voir docs/PORTAINER_SETUP.md
