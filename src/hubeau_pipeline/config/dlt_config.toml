# ========================================
# Configuration DLT optimisee pour VPS 8GB RAM
# ========================================

[runtime]
log_level = "INFO"
log_format = "JSON"

[normalize]
# Reduction workers pour 8GB RAM
workers = 2

[load]
# Reduction workers et batch size
workers = 2
insert_max_rows_per_batch = 5000

[destination.postgres]
loader_file_format = "insert_values"

# Connection pool reduit
max_connections = 5
pool_size = 3
pool_timeout = 30

autocommit = false
create_indexes = true
create_schema_if_not_exists = true

[sources]
http_timeout = 120
http_retries = 5
http_backoff_factor = 2.0
