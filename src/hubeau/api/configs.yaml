apis:
  temperature:
    base_url: https://hubeau.eaufrance.fr/api/v1/temperature
    path: /station
    start_param: date_debut_mesure
    end_param: date_fin_mesure
    station_field: code_station
    date_field: date_mesure_temp
    description: "API température des cours d'eau"

  hydrometry:
    base_url: https://hubeau.eaufrance.fr/api/v2/hydrometrie
    path: /obs_elab
    start_param: date_debut_obs_elab
    end_param: date_fin_obs_elab
    station_field: code_station
    date_field: date_obs_elab
    description: "API hydrométrie (débits et hauteurs d'eau)"

  piezometry:
    base_url: https://hubeau.eaufrance.fr/api/v1/niveaux_nappes
    path: /chroniques
    start_param: date_debut_mesure
    end_param: date_fin_mesure
    station_field: code_bss
    date_field: date_mesure
    description: "API piézométrie (niveaux des nappes)"

  quality_rivers:
    base_url: https://hubeau.eaufrance.fr/api/v2/qualite_rivieres
    path: /station_pc
    start_param: date_debut_prelevement
    end_param: date_fin_prelevement
    station_field: code_station
    date_field: date_prelevement
    description: "API qualité des rivières"

  quality_groundwater:
    base_url: https://hubeau.eaufrance.fr/api/v1/qualite_nappes
    path: /analyses
    start_param: date_debut_prelevement
    end_param: date_fin_prelevement
    station_field: code_bss
    date_field: date_prelevement
    description: "API qualité des nappes"

  ecoulement:
    base_url: https://hubeau.eaufrance.fr/api/v1/ecoulement
    path: /observations
    start_param: date_observation_min
    end_param: date_observation_max
    station_field: code_station
    date_field: date_observation
    description: "API écoulement des cours d'eau"

  hydrobio:
    base_url: https://hubeau.eaufrance.fr/api/v1/hydrobio
    path: /indices
    start_param: date_debut_prelevement
    end_param: date_fin_prelevement
    station_field: code_station_hydrobio
    date_field: date_prelevement
    description: "API hydrobiologie"

  prelevements:
    base_url: https://hubeau.eaufrance.fr/api/v1/prelevements
    path: /chroniques
    start_param: annee
    end_param: annee
    station_field: code_ouvrage
    date_field: annee
    description: "API prélèvements d'eau"
    special_filtering: yearly  # Indique un filtrage spécial par année seulement

# Configuration des endpoints de référentiel (stations)
referentiels:
  temperature:
    endpoint: /station
    key_field: code_station

  hydrometry:
    stations_endpoint: /referentiel/stations
    sites_endpoint: /referentiel/sites
    key_field: code_station

  piezometry:
    endpoint: /stations
    key_field: code_bss

  quality_rivers:
    endpoint: /station_pc
    key_field: code_station

  quality_groundwater:
    endpoint: /stations
    key_field: code_bss

  ecoulement:
    stations_endpoint: /stations
    campagnes_endpoint: /campagnes
    key_field: code_station

  hydrobio:
    endpoint: /stations_hydrobio
    key_field: code_station_hydrobio

  prelevements:
    ouvrages_endpoint: /referentiel/ouvrages
    points_endpoint: /referentiel/points
    ouvrages_key: code_ouvrage
    points_key: code_point_prelevement

# Configuration des slicing modes par API
slicing_modes:
  temperature: station_month_chunked
  hydrometry: station_month_chunked
  piezometry: station_month_chunked
  quality_rivers: station_month_chunked
  quality_groundwater: station_month_chunked
  ecoulement: datetime
  hydrobio: datetime
  prelevements: dept

# Configuration des limites
limits:
  max_records_per_request: 20000
  truncation_threshold: 10000
  fallback_threshold: 5000
  max_fallbacks: 10