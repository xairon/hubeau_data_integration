version: 2

sources:
  - name: staging
    schema: bronze
    # Default freshness for all tables (can be overridden per table)
    freshness:
      warn_after: {count: 3, period: day}
      error_after: {count: 7, period: day}
    tables:
      - name: era5_france_timeseries
        description: Données météo ERA5-Land brutes (timeseries)
        # Le dataset CADS `reanalysis-era5-land` a une latence de publication INHÉRENTE
        # de ~2-3 semaines. La donnée la plus récente est donc normalement à ~J-21 ;
        # ce n'est PAS un retard d'ingestion (le job s'auto-rattrape dès que CADS publie).
        # Seuils calés pour ne sonner qu'en cas de VRAI blocage (ingestion arrêtée),
        # pas sur la latence normale du dataset. loaded_at_field = `time` (date donnée),
        # le seul signal pertinent ici (created_at non rafraîchi par les MERGE).
        freshness:
          warn_after: {count: 30, period: day}
          error_after: {count: 60, period: day}
        loaded_at_field: "time"
      - name: era5_daily_temp_stats
        description: >
          Statistiques journalières de température (moyenne/min/max) agrégées LOCALEMENT à
          partir de l'archive brute horaire `reanalysis-era5-land` (24 pas horaires/jour),
          PAS un produit dérivé CDS.
        # Source = archive horaire `reanalysis-era5-land` (même dataset que era5_france_timeseries),
        # agrégée localement en Tn/Tx/Tmoy journalières. Latence de publication INHÉRENTE de la
        # source ~2-3 semaines (borne d'intégration capée à J-lag). Seuils calés pour ne sonner
        # qu'en cas de blocage ingestion, pas sur la latence normale. loaded_at_field = `time`.
        freshness:
          warn_after: {count: 30, period: day}
          error_after: {count: 60, period: day}
        loaded_at_field: "time"
      - name: piezometry_stations_raw
        description: Métadonnées des stations piézométriques
        freshness: null  # Static reference data
      - name: piezometry_chroniques_raw
        description: Mesures piézométriques brutes
        # Freshness = recence d'INGESTION (pas la date de la donnee). Les colonnes Bronze
        # sont en text (DLT) ; _dlt_load_id encode l'epoch du chargement -> to_timestamp.
        freshness:
          warn_after: {count: 3, period: day}
          error_after: {count: 7, period: day}
        loaded_at_field: "to_timestamp(_dlt_load_id::double precision)"
      - name: hydrometry_sites_raw
        description: Sites hydrométriques bruts
        freshness: null  # Static reference data
      - name: hydrometry_stations_raw
        description: Stations hydrométriques brutes
        freshness: null  # Static reference data
      - name: hydrometry_obs_elab_raw
        description: Observations hydrométriques élaborées brutes
        # Freshness = recence d'INGESTION via _dlt_load_id (epoch text) -> to_timestamp.
        freshness:
          warn_after: {count: 3, period: day}
          error_after: {count: 7, period: day}
        loaded_at_field: "to_timestamp(_dlt_load_id::double precision)"
      # Référentiel TME (entités hydrogéologiques)
      - name: tme_entites_hydrogeo
        description: Attributs TME (niveau, etat, nature, milieu, theme, origine) depuis TME.csv local ou ZIP national
        freshness: null
