version: 2

sources:
  - name: staging
    schema: bronze
    # Default freshness for all tables (can be overridden per table)
    freshness:
      warn_after: {count: 3, period: day}
      error_after: {count: 7, period: day}
    tables:
      - name: era5_france_timeseries
        description: Données météo ERA5 brutes (timeseries)
        freshness:
          warn_after: {count: 14, period: day}  # ERA5 updated weekly
          error_after: {count: 21, period: day}
        loaded_at_field: "time"  # Column in table (not valid_time)
      - name: piezometry_stations_raw
        description: Métadonnées des stations piézométriques
        freshness: null  # Static reference data
      - name: piezometry_chroniques_raw
        description: Mesures piézométriques brutes
        freshness:
          warn_after: {count: 3, period: day}
          error_after: {count: 7, period: day}
        loaded_at_field: "date_mesure::timestamp"
      - name: hydrometry_sites_raw
        description: Sites hydrométriques bruts
        freshness: null  # Static reference data
      - name: hydrometry_stations_raw
        description: Stations hydrométriques brutes
        freshness: null  # Static reference data
      - name: hydrometry_obs_elab_raw
        description: Observations hydrométriques élaborées brutes
        freshness:
          warn_after: {count: 3, period: day}
          error_after: {count: 7, period: day}
        loaded_at_field: "date_obs_elab::timestamp"
      # BDLISA + Sandre (données intégrées via pipeline Dagster, plus de seeds)
      - name: bdlisa_entites_raw
        description: Référentiel BDLISA V3 brut (GeoPackage → PostGIS)
        freshness: null
      - name: bdlisa_entites
        description: Vue BDLISA schéma fixe (code_eh, libelle_eh, ...) pour dbt
        freshness: null
      - name: tme_entites_hydrogeo
        description: Attributs TME (niveau, etat, nature, milieu, theme, origine) depuis TME.csv — enrichit stg_tme_entites
        freshness: null
      - name: ref_niveau_eh
        description: Nomenclature Sandre - Niveau entité hydrogéologique
        freshness: null
      - name: ref_nature_eh
        description: Nomenclature Sandre - Nature entité hydrogéologique
        freshness: null
      - name: ref_etat_eh
        description: Nomenclature Sandre - État nappe
        freshness: null
      - name: ref_theme_eh
        description: Nomenclature Sandre - Thème / formation géologique
        freshness: null
      - name: ref_milieu_eh
        description: Nomenclature Sandre / BDLISA - Type de milieu (porosité)
        freshness: null
      - name: ref_origine_eh
        description: Nomenclature Sandre / BDLISA - Potentialités aquifères
        freshness: null
      # Référentiels géographiques (calques Superset)
      - name: referentiel_regions
        description: Contours régions (data.gouv.fr GeoJSON 1000m)
        freshness: null
      - name: referentiel_departements
        description: Contours départements (data.gouv.fr GeoJSON 1000m)
        freshness: null
      - name: referentiel_zones_hydro
        description: Zones hydrographiques BD Carthage (Sandre)
        freshness: null
