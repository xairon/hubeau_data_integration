version: 2

models:
  # ==============================================================================
  # STAGING MODELS - Data Quality Tests
  # ==============================================================================

  - name: stg_piezo_stations
    description: "Stations piézométriques (Silver)"
    columns:
      - name: code_bss
        description: "Code BSS unique de la station"
        tests:
          - not_null
          - unique
      - name: geometry
        description: "Point géographique PostGIS"
        tests:
          - not_null

  - name: stg_piezo_chroniques
    description: "Mesures piézométriques (Silver)"
    columns:
      - name: code_bss
        tests:
          - not_null
      - name: date_mesure
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - code_bss
            - date_mesure

  - name: stg_hydrometry_sites
    description: "Sites hydrométriques (Silver)"
    columns:
      - name: code_site
        tests:
          - not_null
          - unique
      - name: geometry
        description: "Point géographique PostGIS"
        tests:
          - not_null

  - name: stg_hydrometry_stations
    description: "Stations hydrométriques (Silver)"
    columns:
      - name: code_station
        tests:
          - not_null
          - unique
      - name: code_site
        tests:
          - not_null
          - relationships:
              to: ref('stg_hydrometry_sites')
              field: code_site
      - name: geometry
        description: "Point géographique PostGIS"
        tests:
          - not_null

  - name: stg_hydrometry_obs_elab
    description: "Observations hydrométriques élaborées (Silver)"
    columns:
      - name: code_site
        tests:
          - not_null
          - relationships:
              to: ref('stg_hydrometry_sites')
              field: code_site
      - name: date_obs_elab
        tests:
          - not_null
      - name: grandeur_hydro_elab
        tests:
          - not_null
          - accepted_values:
              values: ['QmnJ', 'QmxJ', 'H']
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - code_site
            - date_obs_elab
            - grandeur_hydro_elab

  - name: stg_tme_entites
    description: |
      Entités hydrogéologiques TME/BDLISA (Silver). Source : `bdlisa_entites` (vue sur
      bronze.bdlisa_entites_raw) + jointures aux nomenclatures Sandre `ref_*_eh`.
      Avec le layer 0 du GeoPackage BDLISA V3 Métropole, seuls `code_eh` et `libelle_eh`
      sont renseignés ; niveau/etat/nature/milieu/theme/origine et leurs libellés restent
      souvent NULL. Voir docs/ONBOARDING.md et scripts/inspect_bdlisa_gpkg.py.
    columns:
      - name: code_eh
        description: "Code entité hydrogéologique (source bdlisa_entites)"
        tests:
          - not_null
          - unique
      - name: libelle_eh
        description: "Libellé de l'entité (source bdlisa_entites)"
      - name: niveau_eh
        description: "Code niveau TME (1/2/3) — souvent NULL (layer 0 gpkg)"
      - name: libelle_niveau_eh
        description: "Libellé du niveau (national / régional / local) — ref_niveau_eh"
      - name: etat_eh
        description: "Code état nappe — souvent NULL (layer 0 gpkg)"
      - name: libelle_etat_eh
        description: "Libellé de l'état de la nappe — ref_etat_eh"
      - name: nature_eh
        description: "Code nature (GSA, UA, etc.) — souvent NULL (layer 0 gpkg)"
      - name: libelle_nature_eh
        description: "Libellé de la nature — ref_nature_eh"
      - name: milieu_eh
        description: "Code milieu / porosité — souvent NULL (layer 0 gpkg)"
      - name: libelle_milieu_eh
        description: "Libellé du type de milieu — ref_milieu_eh"
      - name: theme_eh
        description: "Code thème / formation géologique — souvent NULL (layer 0 gpkg)"
      - name: libelle_theme_eh
        description: "Libellé du thème — ref_theme_eh"
      - name: origine_eh
        description: "Code potentialités aquifères — souvent NULL (layer 0 gpkg)"
      - name: libelle_origine_eh
        description: "Libellé des potentialités aquifères — ref_origine_eh"
      - name: geometry
        description: "Géométrie PostGIS (polygone entité BDLISA)"

  - name: stg_era5_timeseries
    description: "Données météo ERA5 (Silver)"
    columns:
      - name: time
        tests:
          - not_null
      - name: latitude
        tests:
          - not_null
      - name: longitude
        tests:
          - not_null
      - name: temperature_2m
        description: "Température en °C"
        tests:
          - not_null
      - name: geometry
        description: "Point géographique PostGIS"
        tests:
          - not_null
    # Unicité garantie par la PK PostgreSQL (post_hook add_primary_key).
    # Test dbt_utils.unique_combination_of_columns retiré: OOM sur ~100M lignes ERA5.
