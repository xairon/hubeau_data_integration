version: 2

# ==============================================================================
# Exposures : consommateurs aval des modèles dbt.
# ------------------------------------------------------------------------------
# Rendent visibles dans le DAG / dbt docs les dépendances « qui casse si je
# touche ce modèle ». Listes établies par inspection réelle (2026-06-23) du
# backend junon (grep /app) et de docker/superset/datasources.yaml.
# ==============================================================================

exposures:
  - name: junon_observatory_api
    type: application
    maturity: high
    description: >
      API backend de l'observatoire Junon (FastAPI). Sert les pages
      observatoire piézo/hydro, situation (indices IPS/SSFI), stats mensuelles
      et annuelles. Requête directement les marts Gold et les tables d'indices.
    owner:
      name: Observatoire Junon (BRGM)
      email: ringuetnicolas2@gmail.com
    depends_on:
      - ref('dim_piezo_stations')
      - ref('dim_hydro_stations')
      - ref('fct_monthly_chroniques')
      - ref('fct_monthly_hydro')
      - ref('fct_yearly_stats')
      - ref('fct_yearly_hydro')
      - ref('hubeau_daily_chroniques')
      - ref('hydro_daily_chroniques')
      - source('gold_ips', 'station_current_index')
      - source('gold_ips', 'fct_monthly_index')
      - source('gold_ips', 'station_reference_stats')

  - name: superset_dashboards
    type: dashboard
    maturity: medium
    description: >
      Tableaux de bord BI Superset. Datasets déclarés dans
      docker/superset/datasources.yaml (cartes stations, chroniques quotidiennes,
      agrégats mensuels/annuels, mapping ERA5, référentiel TME).
    owner:
      name: Observatoire Junon (BRGM)
      email: ringuetnicolas2@gmail.com
    depends_on:
      - ref('stations_piezo_carte')
      - ref('dim_piezo_stations')
      - ref('hubeau_daily_chroniques')
      - ref('fct_monthly_chroniques')
      - ref('fct_yearly_stats')
      - ref('int_daily_measurements')
      - ref('int_era5_for_all_stations')
      - ref('int_era5_grid_points')
      - ref('int_station_era5_mapping')
      - ref('stg_piezo_stations')
      - ref('stg_tme_entites')
      - source('staging', 'tme_entites_hydrogeo')
