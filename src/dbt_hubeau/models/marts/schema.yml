  - name: dim_hydro_stations
    description: "Dimension Stations hydrométriques enrichie avec statistiques"
    columns:
      - name: code_station
        tests:
          - unique
          - not_null

  - name: dim_date
    description: "Dimension temps pour analyses (jour, mois, semaine, trimestre)"
    columns:
      - name: date
        tests: [unique, not_null]

  - name: dim_geography
    description: "Dimension géographique issue des stations piézo et hydro"
    columns:
      - name: code_commune
        description: "Code INSEE de la commune"
      - name: nom_commune
        description: "Nom de la commune"
      - name: code_departement
        description: "Code du département"
        tests:
          - not_null
      - name: nom_departement
        description: "Nom du département"
      - name: code_region
        description: "Code de la région"
      - name: nom_region
        description: "Nom de la région"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - code_commune
            - code_departement

  - name: fct_era5_monthly_grid
    description: >
      Agrégats météo mensuels ERA5 par point de grille 0.1° (toute la France, 1950→présent).
      Base du module Climat junon. etp_totale et bilan_hydrique en mm positifs
      (PEV ERA5 négative inversée à l'agrégation).
    columns:
      - name: era5_latitude
        tests: [not_null]
      - name: era5_longitude
        tests: [not_null]
      - name: mois
        tests: [not_null]
      - name: temperature_moyenne
        description: >
          Moyenne mensuelle des vraies moyennes journalières (source
          stg_era5_daily_temp_stats.t2m_mean, agrégées LOCALEMENT depuis l'archive brute
          horaire reanalysis-era5-land — les 24 pas horaires du jour, PAS un produit CDS) —
          fini le biais d'échantillonnage 00:00 UTC (cf. docs/ERA5.md). NULL possible.
        tests:
          - dbt_utils.accepted_range:
              min_value: -25
              max_value: 40
              config:
                severity: warn
                where: "temperature_moyenne IS NOT NULL"
      - name: temperature_min
        description: >
          Minimum mensuel des vraies températures minimales journalières (Tn, source
          stg_era5_daily_temp_stats.t2m_min). NULL possible.
        tests:
          # Bornes larges : min de cellule d'altitude en hiver peut plonger. Objectif =
          # attraper une régression d'unité (Kelvin ≈ 230-300, hors plage) sans warner sur le bruit.
          - dbt_utils.accepted_range:
              min_value: -45
              max_value: 50
              config:
                severity: warn
                where: "temperature_min IS NOT NULL"
      - name: temperature_max
        description: >
          Maximum mensuel des vraies températures maximales journalières (Tx, source
          stg_era5_daily_temp_stats.t2m_max). NULL possible.
        tests:
          - dbt_utils.accepted_range:
              min_value: -45
              max_value: 50
              config:
                severity: warn
                where: "temperature_max IS NOT NULL"
      - name: nb_jours_temp
        description: >
          Nombre de jours du mois disposant d'une température journalière (t2m_mean non-NULL).
          Découplé de nb_jours (précipitation) : le LEFT JOIN température peut être partiel.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 31
      - name: temp_complet
        description: >
          TRUE si nb_jours_temp = nombre de jours calendaires du mois. Gouverne l'usage du mois
          dans les normales de TEMPÉRATURE (STI) de fct_era5_climatology_grid, indépendamment
          de mois_complet (qui reste basé sur la précipitation).
      - name: precipitation_totale
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1500
              config:
                severity: warn
      - name: etp_totale
        description: "ETP mensuelle en mm POSITIFS (= SUM(-potential_evaporation))"
        tests:
          - dbt_utils.accepted_range:
              min_value: -50
              max_value: 2500
              config:
                severity: warn
      - name: nb_jours
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 31
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - era5_latitude
            - era5_longitude
            - mois
          config:
            severity: warn
      # Cohérence du bilan hydrique (tolérance flottants)
      - dbt_utils.expression_is_true:
          expression: "ABS(bilan_hydrique - (precipitation_totale - etp_totale)) < 0.01"
          config:
            severity: warn
            where: "bilan_hydrique IS NOT NULL"
      # Invariant température : Tn_mensuel <= T_moyenne <= Tx_mensuel (au grain mensuel).
      # where ignore les lignes température-NULL (LEFT JOIN non apparié) pour ne pas
      # faussement échouer ; si temperature_moyenne est non-NULL, min/max le sont aussi.
      - dbt_utils.expression_is_true:
          expression: "temperature_min <= temperature_moyenne AND temperature_moyenne <= temperature_max"
          config:
            severity: warn
            where: "temperature_moyenne IS NOT NULL"

  - name: fct_era5_climatology_grid
    description: >
      Normales 1991-2020 par cellule ERA5 × mois calendaire × fenêtre (1/3/6/12 mois) :
      paramètres gamma (SPI, méthode des moments, prob_zero) et moyenne/écart-type (STI).
    columns:
      - name: mois_calendaire
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 1, max_value: 12}
      - name: fenetre
        tests:
          - not_null
          - accepted_values:
              values: [1, 3, 6, 12]
              quote: false
      - name: nb_annees
        description: "Années de référence pour la normale de PRÉCIPITATION (mois_complet)."
        tests:
          - dbt_utils.accepted_range:
              min_value: 25
              max_value: 30
              config:
                severity: warn
      - name: nb_annees_temp
        description: >
          Années de référence pour la normale de TEMPÉRATURE : ne compte que les fenêtres dont
          tous les mois sont temp_complet=true. <= nb_annees. Sous-tend temp_moyenne/temp_stddev.
        tests:
          - dbt_utils.accepted_range:
              min_value: 25
              max_value: 30
              config:
                severity: warn
      - name: gamma_alpha
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 10000
              config:
                severity: warn
                where: "gamma_alpha IS NOT NULL"
      - name: gamma_beta
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 10000
              config:
                severity: warn
                where: "gamma_beta IS NOT NULL"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - era5_latitude
            - era5_longitude
            - mois_calendaire
            - fenetre

