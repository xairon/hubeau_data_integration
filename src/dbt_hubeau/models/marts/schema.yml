version: 2

models:
  # ==============================================================================
  # MARTS MODELS - Final Data Quality Tests
  # ==============================================================================

  - name: hubeau_daily_chroniques
    description: |
      Table finale combinant piézométrie, météo ERA5 et métadonnées TME.
      Chaque ligne = 1 station × 1 jour avec toutes les observations.
    
    columns:
      - name: code_bss
        description: "Code BSS unique de la station piézométrique"
        tests:
          - not_null
      
      - name: date
        description: "Date de la mesure (jour)"
        tests:
          - not_null
      
      - name: niveau_nappe_eau
        description: "Niveau piézométrique moyen journalier (m NGF)"
        tests:
          - not_null
      
      - name: temperature_2m
        description: "Température moyenne à 2m en °C (NULL si ERA5 absent pour cette date)"
        tests:
          - dbt_utils.accepted_range:
              min_value: -40
              max_value: 50
              config:
                severity: warn
      
      - name: total_precipitation
        description: "Précipitations totales journalières en m (NULL si ERA5 absent)"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 0.5
              config:
                severity: warn
      
      - name: station_latitude
        description: "Latitude de la station (NULL si mapping absent)"
        tests:
          - dbt_utils.accepted_range:
              min_value: 41.0
              max_value: 52.0
              config:
                severity: warn
      
      - name: station_longitude
        description: "Longitude de la station (NULL si mapping absent)"
        tests:
          - dbt_utils.accepted_range:
              min_value: -5.5
              max_value: 10.0
              config:
                severity: warn
    
    tests:
      # Unicité station + date
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - code_bss
            - date
      
      # Nombre minimum de lignes (sanity check)
      - dbt_utils.expression_is_true:
          expression: "1=1"  # Placeholder - le test compile toujours
          config:
            severity: warn

  - name: fct_monthly_chroniques
    description: "Agrégations mensuelles des mesures piézométriques et météo"
    columns:
      - name: code_bss
        tests:
          - not_null
      - name: mois
        tests:
          - not_null
      - name: niveau_moyen
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - code_bss
            - mois

  - name: fct_yearly_stats
    description: "Statistiques annuelles et classification sécheresse"
    columns:
      - name: code_bss
        tests:
          - not_null
      - name: annee
        tests:
          - not_null
      - name: classification_niveau_annuel
        tests:
          - accepted_values:
              values: ['TRES_BAS', 'BAS', 'NORMAL', 'HAUT', 'TRES_HAUT']

  - name: dim_piezo_stations
    description: "Dimension Stations enrichie avec statistiques globales et tendances"
    columns:
      - name: code_bss
        tests:
          - unique
          - not_null
      - name: tendance_classification
        tests:
          - accepted_values:
              values: ['HAUSSE', 'BAISSE', 'STABLE', 'INSUFFISANT']
      - name: niveau_alerte
        tests:
          - accepted_values:
              values: ['NORMAL', 'VIGILANCE', 'ALERTE']

  - name: stations_piezo_carte
    description: |
      Mart "prêt carte" pour Superset : une ligne par station avec géométrie (geom),
      entité TME (code_eh, libelle_eh, …) et indicateurs (niveau_alerte, tendance_classification).
      Évite les jointures côté BI pour les calques "stations piézo" avec libellés et alertes.
    columns:
      - name: code_bss
        tests: [unique, not_null]
      - name: geom
        description: "Géométrie PostGIS (point station)"
      - name: code_eh
        description: "Code entité hydrogéologique TME"
      - name: libelle_eh
        description: "Libellé entité hydrogéologique"
      - name: niveau_alerte
        description: "NORMAL / VIGILANCE / ALERTE"
      - name: tendance_classification
        description: "HAUSSE / BAISSE / STABLE / INSUFFISANT"

  - name: agg_station_trends
    description: "Tendances saisonnières par station"
    columns:
      - name: code_bss
        tests:
          - not_null
      - name: saison
        tests:
          - accepted_values:
              values: ['HIVER', 'PRINTEMPS', 'ETE', 'AUTOMNE']
      - name: classification_tendance
        tests:
          - accepted_values:
              values: ['HAUSSE_FORTE', 'HAUSSE_LEGERE', 'STABLE', 'BAISSE_LEGERE', 'BAISSE_FORTE']

  - name: hydro_daily_chroniques
    description: "Table finale hydrométrie combinant observations et météo ERA5"
    columns:
      - name: code_station
        tests:
          - not_null
      - name: date
        tests:
          - not_null
      - name: grandeur_hydro_elab
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - code_station
            - date
            - grandeur_hydro_elab

  - name: fct_monthly_hydro
    description: "Agrégations mensuelles des mesures hydrométriques et météo"
    columns:
      - name: code_station
        tests:
          - not_null
      - name: mois
        tests:
          - not_null
      - name: grandeur_hydro_elab
        tests:
          - not_null
      - name: resultat_moyen
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - code_station
            - mois
            - grandeur_hydro_elab

  - name: fct_yearly_hydro
    description: "Statistiques annuelles hydrométriques et classification par quantiles"
    columns:
      - name: code_station
        tests:
          - not_null
      - name: annee
        tests:
          - not_null
      - name: grandeur_hydro_elab
        tests:
          - not_null
      - name: classification_resultat_annuel
        tests:
          - accepted_values:
              values: ['TRES_BAS', 'BAS', 'NORMAL', 'HAUT', 'TRES_HAUT']

  - name: agg_hydro_trends
    description: "Tendances saisonnières hydrométriques par station"
    columns:
      - name: code_station
        tests:
          - not_null
      - name: saison
        tests:
          - accepted_values:
              values: ['HIVER', 'PRINTEMPS', 'ETE', 'AUTOMNE']
      - name: classification_tendance
        tests:
          - accepted_values:
              values: ['HAUSSE_FORTE', 'HAUSSE_LEGERE', 'STABLE', 'BAISSE_LEGERE', 'BAISSE_FORTE']

  - name: dim_hydro_stations
    description: "Dimension Stations hydrométriques enrichie avec statistiques"
    columns:
      - name: code_station
        tests:
          - unique
          - not_null

  - name: stations_hydro_carte
    description: |
      Mart "prêt carte" pour Superset : une ligne par station hydrométrique avec géométrie (geom)
      et indicateurs hydrométriques principaux. Évite les jointures côté BI.
    columns:
      - name: code_station
        tests: [unique, not_null]
      - name: geom
        description: "Géométrie PostGIS (point station)"

  - name: dim_date
    description: "Dimension temps pour analyses (jour, mois, semaine, trimestre)"
    columns:
      - name: date
        tests: [unique, not_null]

  - name: dim_geography
    description: "Dimension géographique issue des stations piézo et hydro"
    columns:
      - name: code_commune
        description: "Code INSEE de la commune"
      - name: nom_commune
        description: "Nom de la commune"
      - name: code_departement
        description: "Code du département"
        tests:
          - not_null
      - name: nom_departement
        description: "Nom du département"
      - name: code_region
        description: "Code de la région"
      - name: nom_region
        description: "Nom de la région"

