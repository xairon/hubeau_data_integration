version: 2

models:
  # ==============================================================================
  # MARTS MODELS - Final Data Quality Tests
  # ==============================================================================

  - name: hubeau_daily_chroniques
    description: |
      Table finale combinant piézométrie, météo ERA5 et métadonnées TME.
      Chaque ligne = 1 station × 1 jour avec toutes les observations.
    
    columns:
      - name: code_bss
        description: "Code BSS unique de la station piézométrique"
        tests:
          - not_null
      
      - name: date
        description: "Date de la mesure (jour)"
        tests:
          - not_null
      
      - name: niveau_nappe_eau
        description: >
          Niveau piézométrique moyen journalier (m NGF). NULLABLE : certaines stations
          ne mesurent que profondeur_nappe (sans niveau NGF). Le staging garde les lignes
          ayant niveau OU profondeur — donc niveau peut être NULL par conception.

      - name: temperature_2m
        description: >
          Température moyenne journalière à 2m en °C — VRAIE moyenne des 24 pas horaires
          (source silver.stg_era5_daily_temp_stats, agrégée localement depuis l'archive brute
          ERA5-Land). Le biais d'échantillonnage 00:00 UTC (~2-4°C de biais froid l'été) ne
          s'applique plus depuis le cutover station 2026-07-15. NULL si stat journalière absente.
        tests:
          - dbt_utils.accepted_range:
              min_value: -40
              max_value: 50
              config:
                severity: warn
                where: "temperature_2m IS NOT NULL"

      - name: total_precipitation
        description: "Précipitations totales journalières en mm (NULL si ERA5 absent)"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 500
              config:
                severity: warn
                where: "total_precipitation IS NOT NULL"

      - name: potential_evaporation
        description: >
          Évaporation potentielle journalière ERA5 en mm — convention flux descendant :
          valeurs NÉGATIVES (ETP positive = -potential_evaporation). NULL si ERA5 absent.
        tests:
          - dbt_utils.accepted_range:
              min_value: -100
              max_value: 5
              config:
                severity: warn
                where: "potential_evaporation IS NOT NULL"

      - name: station_latitude
        description: "Latitude de la station (NULL si mapping absent)"
        tests:
          - dbt_utils.accepted_range:
              min_value: 41.0
              max_value: 52.0
              config:
                severity: warn
      
      - name: station_longitude
        description: "Longitude de la station (NULL si mapping absent)"
        tests:
          - dbt_utils.accepted_range:
              min_value: -5.5
              max_value: 10.0
              config:
                severity: warn
    
    tests:
      # Unicité (code_bss, date) garantie par la PK PostgreSQL (post_hook add_primary_key).
      # Test dbt_utils.unique_combination_of_columns retiré : full-scan coûteux/OOM-prone
      # sur l'hypertable (cf. même décision sur ERA5).

      # Sanity : au moins une mesure présente (niveau OU profondeur) sur données récentes.
      - dbt_utils.expression_is_true:
          expression: "niveau_nappe_eau IS NOT NULL OR profondeur_nappe IS NOT NULL"
          config:
            severity: warn
            where: "date >= CURRENT_DATE - INTERVAL '30 days'"

  - name: fct_monthly_chroniques
    description: "Agrégations mensuelles des mesures piézométriques et météo"
    columns:
      - name: code_bss
        tests:
          - not_null
      - name: mois
        tests:
          - not_null
      - name: niveau_moyen
        description: >
          Niveau moyen mensuel (m NGF). NULLABLE : stations à profondeur seule (sans niveau NGF),
          cf. niveau_nappe_eau de hubeau_daily_chroniques.
      - name: temperature_moyenne
        tests:
          - dbt_utils.accepted_range:
              min_value: -30
              max_value: 40
              config:
                severity: warn
                where: "temperature_moyenne IS NOT NULL"
      - name: precipitation_totale
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1500
              config:
                severity: warn
                where: "precipitation_totale IS NOT NULL"
      - name: evaporation_moyenne
        description: "AVG des PEV journalières (mm, convention négative ERA5)"
        tests:
          - dbt_utils.accepted_range:
              min_value: -100
              max_value: 5
              config:
                severity: warn
                where: "evaporation_moyenne IS NOT NULL"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - code_bss
            - mois

  - name: fct_yearly_stats
    description: "Statistiques annuelles et classification sécheresse"
    columns:
      - name: code_bss
        tests:
          - not_null
      - name: annee
        tests:
          - not_null
      - name: classification_niveau_annuel
        tests:
          - accepted_values:
              values: ['TRES_BAS', 'BAS', 'NORMAL', 'HAUT', 'TRES_HAUT']
      - name: temperature_moyenne_annuelle
        tests:
          - dbt_utils.accepted_range:
              min_value: -30
              max_value: 40
              config:
                severity: warn
                where: "temperature_moyenne_annuelle IS NOT NULL"
      - name: precipitation_totale_annuelle
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 5000
              config:
                severity: warn
                where: "precipitation_totale_annuelle IS NOT NULL"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - code_bss
            - annee

  - name: dim_piezo_stations
    description: "Dimension Stations enrichie avec statistiques globales et tendances"
    columns:
      - name: code_bss
        tests:
          - unique
          - not_null
      - name: tendance_classification
        tests:
          - accepted_values:
              values: ['HAUSSE', 'BAISSE', 'STABLE', 'INSUFFISANT']
      - name: niveau_alerte
        tests:
          - accepted_values:
              values: ['NORMAL', 'VIGILANCE', 'ALERTE']
      - name: qualite_tendance
        tests:
          - accepted_values:
              values: ['NON_CALCULEE', 'FIABLE', 'INDICATIVE', 'FAIBLE']

  - name: hydro_daily_chroniques
    description: "Table finale hydrométrie combinant observations et météo ERA5"
    columns:
      - name: code_station
        tests:
          - not_null
      - name: date
        tests:
          - not_null
      - name: grandeur_hydro_elab
        tests:
          - not_null

      - name: resultat_obs_elab
        description: "Valeur journalière agrégée (débit en l/s pour QmnJ)"
        tests:
          - not_null

      - name: temperature_2m
        description: >
          Température moyenne journalière à 2m en °C — VRAIE moyenne des 24 pas horaires
          (source silver.stg_era5_daily_temp_stats, agrégée localement depuis l'archive brute
          ERA5-Land). Le biais d'échantillonnage 00:00 UTC ne s'applique plus depuis le cutover
          station 2026-07-15. NULL si stat journalière absente.
        tests:
          - dbt_utils.accepted_range:
              min_value: -40
              max_value: 50
              config:
                severity: warn
                where: "temperature_2m IS NOT NULL"

      - name: total_precipitation
        description: "Précipitations totales journalières en mm (NULL si ERA5 absent)"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 500
              config:
                severity: warn
                where: "total_precipitation IS NOT NULL"

      - name: potential_evaporation
        description: >
          Évaporation potentielle journalière ERA5 en mm — convention flux descendant :
          valeurs NÉGATIVES (ETP positive = -potential_evaporation). NULL si ERA5 absent.
        tests:
          - dbt_utils.accepted_range:
              min_value: -100
              max_value: 5
              config:
                severity: warn
                where: "potential_evaporation IS NOT NULL"

      - name: station_latitude
        description: "Latitude de la station (NULL si mapping absent)"
        tests:
          - dbt_utils.accepted_range:
              min_value: 41.0
              max_value: 52.0
              config:
                severity: warn
                where: "station_latitude IS NOT NULL"

      - name: station_longitude
        description: "Longitude de la station (NULL si mapping absent)"
        tests:
          - dbt_utils.accepted_range:
              min_value: -5.5
              max_value: 10.0
              config:
                severity: warn
                where: "station_longitude IS NOT NULL"

    tests:
      # Unicité (code_station, date, grandeur_hydro_elab) garantie par la PK PostgreSQL
      # (post_hook add_primary_key). Test dbt_utils retiré : full-scan coûteux sur l'hypertable.

      # Sanity check: données récentes non vides
      - dbt_utils.expression_is_true:
          expression: "resultat_obs_elab IS NOT NULL"
          config:
            severity: warn
            where: "date >= CURRENT_DATE - INTERVAL '30 days'"

  - name: fct_monthly_hydro
    description: "Agrégations mensuelles des mesures hydrométriques et météo"
    columns:
      - name: code_station
        tests:
          - not_null
      - name: mois
        tests:
          - not_null
      - name: grandeur_hydro_elab
        tests:
          - not_null
      - name: resultat_moyen
        tests:
          - not_null
      - name: temperature_moyenne
        tests:
          - dbt_utils.accepted_range:
              min_value: -30
              max_value: 40
              config:
                severity: warn
                where: "temperature_moyenne IS NOT NULL"
      - name: precipitation_totale
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1500
              config:
                severity: warn
                where: "precipitation_totale IS NOT NULL"
      - name: evaporation_moyenne
        description: "AVG des PEV journalières (mm, convention négative ERA5)"
        tests:
          - dbt_utils.accepted_range:
              min_value: -100
              max_value: 5
              config:
                severity: warn
                where: "evaporation_moyenne IS NOT NULL"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - code_station
            - mois
            - grandeur_hydro_elab

  - name: fct_yearly_hydro
    description: "Statistiques annuelles hydrométriques et classification par quantiles"
    columns:
      - name: code_station
        tests:
          - not_null
      - name: annee
        tests:
          - not_null
      - name: grandeur_hydro_elab
        tests:
          - not_null
      - name: classification_resultat_annuel
        tests:
          - accepted_values:
              values: ['TRES_BAS', 'BAS', 'NORMAL', 'HAUT', 'TRES_HAUT']
      - name: temperature_moyenne_annuelle
        tests:
          - dbt_utils.accepted_range:
              min_value: -30
              max_value: 40
              config:
                severity: warn
                where: "temperature_moyenne_annuelle IS NOT NULL"
      - name: precipitation_totale_annuelle
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 5000
              config:
                severity: warn
                where: "precipitation_totale_annuelle IS NOT NULL"
    tests:
      - dbt_utils.unique_combination_of_columns:
