name: 'hubeau_pipeline'
version: '1.0.0'
config-version: 2

profile: 'hubeau_pipeline'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Hooks exécutés au début de chaque run dbt (idempotents)
on-run-start:
  - "CREATE INDEX IF NOT EXISTS idx_era5_lat_lon_time ON bronze.era5_france_timeseries (latitude, longitude, time)"
  - "CREATE INDEX IF NOT EXISTS idx_era5_time ON bronze.era5_france_timeseries (time)"
  - "CREATE INDEX IF NOT EXISTS idx_piezo_chroniques_full ON bronze.piezometry_chroniques_raw (code_bss, date_mesure)"
  - "CREATE INDEX IF NOT EXISTS idx_piezo_stations_coords ON bronze.piezometry_stations_raw (x, y)"
  - "CREATE INDEX IF NOT EXISTS idx_piezo_stations_code_bss ON bronze.piezometry_stations_raw (code_bss)"

models:
  hubeau_pipeline:
    # Config par défaut pour tous les modèles
    +materialized: view
    
    staging:
      # Tables nettoyées (Silver Layer)
      +schema: silver
      +materialized: table
      
    intermediate:
      # Tables intermédiaires (Gold Layer)
      +schema: gold
      +materialized: table
      
    marts:
      # Tables finales (Gold Layer)
      +schema: gold
      +materialized: table

seeds:
  hubeau_pipeline:
    # Seeds dans Bronze Layer (données de référence)
    +schema: bronze
