name: 'hubeau_pipeline'
version: '1.0.0'
config-version: 2

profile: 'hubeau_pipeline'

# Pin dbt: 1.7.0 est compatible Dagster ; 1.8+ introduit des breaking changes
# (notamment dans le comportement des stratégies incrémentales sur hypertables).
require-dbt-version: [">=1.7.0", "<1.8.0"]

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

# Variables globales pour les modèles incrémentaux
vars:
  # Fenêtre de rechargement (jours) côté staging (corrections tardives).
  piezometry_incremental_lookback_days: 7
  # Fenêtre courte pour le streaming quotidien (fact daily).
  streaming_lookback_days: 7

# Hooks exécutés au début de chaque run dbt (idempotents, safe si tables n'existent pas encore)
on-run-start:
  # TimescaleDB: autoriser la décompression illimitée pour les DML incrémentaux (delete+insert) sur hypertables compressées
  - "SET timescaledb.max_tuples_decompressed_per_dml_transaction = 0;"
  - "DO $$ BEGIN IF EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema='bronze' AND table_name='era5_france_timeseries') THEN CREATE INDEX IF NOT EXISTS idx_era5_lat_lon_time ON bronze.era5_france_timeseries (latitude, longitude, time); CREATE INDEX IF NOT EXISTS idx_era5_time ON bronze.era5_france_timeseries (time); END IF; END $$;"
  - "DO $$ BEGIN IF EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema='bronze' AND table_name='piezometry_chroniques_raw') THEN CREATE INDEX IF NOT EXISTS idx_piezo_chroniques_full ON bronze.piezometry_chroniques_raw (code_bss, date_mesure); END IF; END $$;"
  - "DO $$ BEGIN IF EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema='bronze' AND table_name='piezometry_stations_raw') THEN CREATE INDEX IF NOT EXISTS idx_piezo_stations_coords ON bronze.piezometry_stations_raw (x, y); CREATE INDEX IF NOT EXISTS idx_piezo_stations_code_bss ON bronze.piezometry_stations_raw (code_bss); END IF; END $$;"

models:
  hubeau_pipeline:
    # Pousse descriptions/colonnes des schema.yml en commentaires PostgreSQL
    # -> visibles dans CloudBeaver / Adminer / Superset (pas seulement dbt docs).
    # Appliqué au prochain `dbt run` de chaque modèle.
    +persist_docs:
      relation: true
      columns: true
    staging:
      # Tables nettoyées (Silver Layer)
      +schema: silver
      +materialized: table

    # Tables de rejet / exception : trace des lignes filtrées (audit, qualité, conformité)
    rejects:
      +schema: silver_rejects
      +materialized: table

    intermediate:
      # Tables intermédiaires (Gold Layer)
      +schema: gold
      +materialized: table

    marts:
      # Tables finales (Gold Layer)
      +schema: gold
      +materialized: table
