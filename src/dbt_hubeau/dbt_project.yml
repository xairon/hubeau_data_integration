name: 'hubeau_pipeline'
version: '1.0.0'
config-version: 2

profile: 'hubeau_pipeline'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Hooks exécutés au début de chaque run dbt (idempotents)
on-run-start:
  - "CREATE INDEX IF NOT EXISTS idx_era5_lat_lon_time ON staging.era5_france_timeseries (latitude, longitude, time)"
  - "CREATE INDEX IF NOT EXISTS idx_era5_time ON staging.era5_france_timeseries (time)"
  - "CREATE INDEX IF NOT EXISTS idx_piezo_chroniques_full ON staging.piezometry_chroniques_raw (code_bss, date_mesure)"
  - "CREATE INDEX IF NOT EXISTS idx_piezo_stations_coords ON staging.piezometry_stations_raw (x, y)"
  - "CREATE INDEX IF NOT EXISTS idx_piezo_stations_code_bss ON staging.piezometry_stations_raw (code_bss)"

models:
  hubeau_pipeline:
    # Config par défaut pour tous les modèles
    +materialized: view
    
    staging:
      # Vues légères sur les tables raw (schéma source)
      +schema: staging
      +materialized: view
      
    intermediate:
      # Tables temporaires pour calculs intermédiaires
      +schema: hubeau
      +materialized: table
      
    marts:
      # Tables finales propres pour l'analyse
      +schema: hubeau
      +materialized: table

