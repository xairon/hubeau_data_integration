# GitLab CI/CD Pipeline pour déploiement automatique sur VPS Hostinger
# Trigger: Push sur branche main

stages:
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  PROJECT_DIR: /srv/brgm

# Stage 1: Tests (optionnel, à activer plus tard)
test:code:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install pytest ruff
  script:
    - echo "✓ Tests désactivés pour l'instant"
    # - ruff check src/
    # - pytest tests/ -v
  only:
    - main
  when: manual  # Déclencher manuellement pour l'instant

# Stage 2: Build de l'image Docker
build:docker:
  stage: build
  image: docker:24-cli
  before_script:
    - echo "Skipping registry login for local build"
  script:
    - echo "🏗️ Build de l'image Docker..."
    - docker build -f docker/dagster/Dockerfile -t hubeau-dagster:$CI_COMMIT_SHORT_SHA .
    - docker tag hubeau-dagster:$CI_COMMIT_SHORT_SHA hubeau-dagster:latest
    - echo "✅ Image buildée avec succès"
  only:
    - main
  tags:
    - hubeau

# Stage 3: Déploiement sur VPS
deploy:production:
  stage: deploy
  image: docker:24-cli
  before_script:
    - apk add --no-cache bash curl
    - chmod +x scripts/deploy.sh
  script:
    - echo "🚀 Déploiement sur VPS Hostinger..."
    - cd $PROJECT_DIR
    - git pull origin main
    - bash scripts/deploy.sh
    - echo "✅ Déploiement terminé"
  environment:
    name: production
    url: http://srv991054.hstgr.cloud:8080
  only:
    - main
  tags:
    - hubeau
  when: manual  # Nécessite confirmation manuelle pour éviter déploiements accidentels

# Job de rollback en cas de problème
rollback:production:
  stage: deploy
  image: docker:24-cli
  before_script:
    - apk add --no-cache bash
  script:
    - echo "🔄 Rollback du déploiement..."
    - cd $PROJECT_DIR
    - git checkout HEAD~1
    - bash scripts/deploy.sh
    - echo "✅ Rollback terminé"
  environment:
    name: production
    url: http://srv991054.hstgr.cloud:8080
  only:
    - main
  tags:
    - hubeau
  when: manual
