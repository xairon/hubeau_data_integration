# GitLab CI/CD Pipeline pour déploiement automatique sur VPS Hostinger
# Trigger: Push sur branche main

stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  PROJECT_DIR: /srv/brgm
  # Portainer accessible sur https://srv991054.hstgr.cloud:9443 après déploiement

# Stage 1: Build des images Docker (automatique sur chaque push)
build:image:
  stage: build
  image: docker:24-cli
  before_script:
    - apk add --no-cache bash rsync
  script:
    - echo "🚀 Build automatique déclenché par push sur main"
    - echo "📦 Synchronisation des fichiers vers /srv/brgm..."
    # Le runner GitLab clone dans /builds/, on copie vers /srv/brgm
    - rsync -av --delete --exclude='.git' --exclude='dagster_home/history' --exclude='dagster_home/storage' --exclude='__pycache__' ./ /srv/brgm/
    - echo "🏗️ Build de l'image Orchestrator..."
    - cd /srv/brgm
    - docker build -f docker/orchestrator/Dockerfile -t hubeau-orchestrator:$CI_COMMIT_SHORT_SHA .
    - docker tag hubeau-orchestrator:$CI_COMMIT_SHORT_SHA hubeau-orchestrator:latest
    - echo "✅ Image hubeau-orchestrator:latest buildée (tag $CI_COMMIT_SHORT_SHA)"
    - echo "🏗️ Build de l'image Worker..."
    - docker build -f docker/worker/Dockerfile -t hubeau-worker:$CI_COMMIT_SHORT_SHA .
    - docker tag hubeau-worker:$CI_COMMIT_SHORT_SHA hubeau-worker:latest
    - echo "✅ Image hubeau-worker:latest buildée (tag $CI_COMMIT_SHORT_SHA)"
  only:
    - main
  tags:
    - hubeau

# Stage 2: Déploiement sur VPS (automatique après le build)
deploy:production:
  stage: deploy
  image: docker:24-cli
  before_script:
    - apk add --no-cache bash
  script:
    - echo "🔄 Déploiement automatique sur production..."
    - cd /srv/brgm
    - echo "🔐 Vérification des variables obligatoires..."
    - |
      if [ -z "$DAGSTER_PG_PASSWORD" ]; then
        echo "❌ ERREUR: DAGSTER_PG_PASSWORD non définie dans GitLab CI/CD Variables"
        exit 1
      fi
      if [ -z "$MINIO_PASS" ]; then
        echo "❌ ERREUR: MINIO_PASS non définie dans GitLab CI/CD Variables"
        exit 1
      fi
      if [ -z "$PG_PASSWORD" ]; then
        echo "❌ ERREUR: PG_PASSWORD non définie dans GitLab CI/CD Variables"
        exit 1
      fi
    - echo "✅ Toutes les variables obligatoires sont définies"
    - echo "🔐 Export des variables GitLab CI/CD pour Docker Compose..."
    - export DAGSTER_PG_HOST=${DAGSTER_PG_HOST:-dagster_postgres}
    - export DAGSTER_PG_PORT=${DAGSTER_PG_PORT:-5432}
    - export DAGSTER_PG_DB=${DAGSTER_PG_DB:-dagster}
    - export DAGSTER_PG_USER=${DAGSTER_PG_USER:-postgres}
    - export DAGSTER_PG_PASSWORD
    - export MINIO_ENDPOINT MINIO_USER MINIO_PASS MINIO_REGION MINIO_BRONZE_BUCKET
    - export PG_HOST PG_PASSWORD POSTGIS_HOST
    - echo "✅ Variables exportées (Docker Compose les lira automatiquement)"
    - echo "🔍 Debug - DAGSTER_PG_HOST=$DAGSTER_PG_HOST"
    - echo "🔍 Debug - DAGSTER_PG_USER=$DAGSTER_PG_USER"
    - echo "🔍 Debug - DAGSTER_PG_DB=$DAGSTER_PG_DB"
    - echo "🔍 Debug - DAGSTER_PG_PASSWORD défini=$([ -n "$DAGSTER_PG_PASSWORD" ] && echo 'OUI' || echo 'NON')"
    - echo "🛑 Arrêt des anciens conteneurs..."
    - docker compose -f docker-compose.production.yml down
    - |
      if [ "$FORCE_POSTGRES_RESET" = "true" ]; then
        echo "⚠️  FORCE_POSTGRES_RESET=true détecté dans GitLab CI/CD Variables"
        echo "🗑️  Suppression du volume PostgreSQL Dagster pour forcer la réinitialisation..."
        if [ -d "/srv/brgm-data/dagster_pg" ]; then
          rm -rf /srv/brgm-data/dagster_pg
          echo "✅ Volume /srv/brgm-data/dagster_pg supprimé"
        else
          echo "ℹ️  Volume /srv/brgm-data/dagster_pg n'existe pas (déjà supprimé ou première installation)"
        fi
        echo "📝 PostgreSQL sera recréé avec le mot de passe depuis GitLab Variables"
      else
        echo "ℹ️  FORCE_POSTGRES_RESET non défini ou = false - Volume PostgreSQL conservé"
        echo "💡 Pour réinitialiser PostgreSQL: définir FORCE_POSTGRES_RESET=true dans GitLab CI/CD Variables"
      fi
    - echo "🚀 Démarrage avec la nouvelle image..."
    - docker compose -f docker-compose.production.yml up -d
    - echo "⏳ Attente des services (90s pour start_period)..."
    - sleep 90
    - echo "✅ Vérification des conteneurs..."
    - docker compose -f docker-compose.production.yml ps
    - echo "🔍 Test de connexion PostgreSQL Dagster..."
    - |
      if docker exec brgm-dagster-postgres psql -U postgres -d dagster -c "SELECT version();" > /dev/null 2>&1; then
        echo "✅ PostgreSQL Dagster accessible et fonctionnel"
        docker exec brgm-dagster-postgres psql -U postgres -d dagster -c "SELECT COUNT(*) as table_count FROM information_schema.tables WHERE table_schema='public';" | grep -A 1 "table_count"
      else
        echo "❌ ERREUR: PostgreSQL Dagster non accessible"
        echo "📊 Logs PostgreSQL (50 dernières lignes):"
        docker logs brgm-dagster-postgres --tail 50
        exit 1
      fi
    - echo "🔍 Vérification des variables d'environnement dans dagster_webserver..."
    - |
      echo "Variables DAGSTER_PG dans le conteneur webserver:"
      docker exec brgm-dagster-webserver env | grep DAGSTER_PG | sed 's/PASSWORD=.*/PASSWORD=***MASKED***/' || echo "❌ Aucune variable DAGSTER_PG trouvée"
    - echo "📊 Logs DLT Worker (dernières 50 lignes):"
    - docker logs brgm-dlt-worker --tail 50 || echo "Worker logs not available"
    - echo "📊 Logs Dagster Webserver (dernières 20 lignes):"
    - docker logs brgm-dagster-webserver --tail 20 || echo "Webserver logs not available"
    - echo "🔍 Worker health check:"
    - docker inspect brgm-dlt-worker --format='{{json .State.Health}}' | python3 -m json.tool || echo "Health check not available"
    - echo "✅ Déploiement terminé!"
  environment:
    name: production
    url: http://srv991054.hstgr.cloud:8080
  only:
    - main
  tags:
    - hubeau
  dependencies:
    - build:image

# Job de rollback en cas de problème
rollback:production:
  stage: deploy
  image: docker:24-cli
  before_script:
    - apk add --no-cache bash
  script:
    - echo "🔄 Rollback - Redémarrage des services..."
    - cd /srv/brgm
    - docker compose -f docker-compose.production.yml restart
    - sleep 20
    - docker compose -f docker-compose.production.yml ps
    - echo "✅ Services redémarrés"
  environment:
    name: production
    url: http://srv991054.hstgr.cloud:8080
  only:
    - main
  tags:
    - hubeau
  when: manual
