# GitLab CI/CD Pipeline pour déploiement automatique sur VPS Hostinger
# Trigger: Push sur branche main

stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  PROJECT_DIR: /srv/brgm
  # Portainer accessible sur https://srv991054.hstgr.cloud:9443 après déploiement

# Stage 1: Build des images Docker (automatique sur chaque push)
build:image:
  stage: build
  image: docker:24-cli
  before_script:
    - apk add --no-cache bash rsync
  script:
    - echo "🚀 Build automatique déclenché par push sur main"
    - echo "📦 Synchronisation des fichiers vers /srv/brgm..."
    # Le runner GitLab clone dans /builds/, on copie vers /srv/brgm
    - rsync -av --delete --exclude='.git' --exclude='dagster_home/history' --exclude='dagster_home/storage' --exclude='__pycache__' ./ /srv/brgm/
    - echo "🏗️ Build de l'image Orchestrator..."
    - cd /srv/brgm
    - docker build -f docker/orchestrator/Dockerfile -t hubeau-orchestrator:$CI_COMMIT_SHORT_SHA .
    - docker tag hubeau-orchestrator:$CI_COMMIT_SHORT_SHA hubeau-orchestrator:latest
    - echo "✅ Image hubeau-orchestrator:latest buildée (tag $CI_COMMIT_SHORT_SHA)"
    - echo "🏗️ Build de l'image Worker..."
    - docker build -f docker/worker/Dockerfile -t hubeau-worker:$CI_COMMIT_SHORT_SHA .
    - docker tag hubeau-worker:$CI_COMMIT_SHORT_SHA hubeau-worker:latest
    - echo "✅ Image hubeau-worker:latest buildée (tag $CI_COMMIT_SHORT_SHA)"
  only:
    - main
  tags:
    - hubeau

# Stage 2: Déploiement sur VPS (automatique après le build)
deploy:production:
  stage: deploy
  image: docker:24-cli
  before_script:
    - apk add --no-cache bash
  script:
    - echo "🔄 Déploiement automatique sur production..."
    - cd /srv/brgm
    - echo "🔐 Génération du fichier .env.production depuis les secrets GitLab..."
    - echo "# Fichier généré automatiquement par le pipeline GitLab CI/CD" > .env.production
    - echo "# NE PAS ÉDITER MANUELLEMENT - Les changements seront écrasés" >> .env.production
    - echo "" >> .env.production
    - echo "# Dagster Orchestration Database" >> .env.production
    - echo "DAGSTER_PG_HOST=${DAGSTER_PG_HOST}" >> .env.production
    - echo "DAGSTER_PG_PORT=5432" >> .env.production
    - echo "DAGSTER_PG_DB=dagster" >> .env.production
    - echo "DAGSTER_PG_USER=postgres" >> .env.production
    - echo "DAGSTER_PG_PASSWORD=${DAGSTER_PG_PASSWORD}" >> .env.production
    - echo "" >> .env.production
    - echo "# PostgreSQL Data Storage" >> .env.production
    - echo "PG_HOST=${PG_HOST}" >> .env.production
    - echo "PG_PORT=5432" >> .env.production
    - echo "PG_DB=postgres" >> .env.production
    - echo "PG_USER=postgres" >> .env.production
    - echo "PG_PASSWORD=${PG_PASSWORD}" >> .env.production
    - echo "" >> .env.production
    - echo "# PostGIS Geospatial Database" >> .env.production
    - echo "POSTGIS_HOST=${POSTGIS_HOST}" >> .env.production
    - echo "POSTGIS_PORT=5432" >> .env.production
    - echo "POSTGIS_DB=postgres" >> .env.production
    - echo "POSTGIS_USER=postgres" >> .env.production
    - echo "POSTGIS_PASSWORD=${PG_PASSWORD}" >> .env.production
    - echo "" >> .env.production
    - echo "# MinIO Object Storage" >> .env.production
    - echo "MINIO_ENDPOINT=${MINIO_ENDPOINT}" >> .env.production
    - echo "MINIO_USER=${MINIO_USER}" >> .env.production
    - echo "MINIO_PASS=${MINIO_PASS}" >> .env.production
    - echo "MINIO_REGION=${MINIO_REGION}" >> .env.production
    - echo "MINIO_BRONZE_BUCKET=${MINIO_BRONZE_BUCKET}" >> .env.production
    - echo "✅ Fichier .env.production créé"
    - echo "📄 Contenu du fichier .env.production (passwords masqués):"
    - cat .env.production | sed 's/PASSWORD=.*/PASSWORD=***MASKED***/g' | sed 's/PASS=.*/PASS=***MASKED***/g'
    - echo "🛑 Arrêt des anciens conteneurs..."
    - docker compose -f docker-compose.production.yml down
    - echo "🚀 Démarrage avec la nouvelle image..."
    - docker compose -f docker-compose.production.yml --env-file .env.production up -d
    - echo "⏳ Attente des services (90s pour start_period)..."
    - sleep 90
    - echo "✅ Vérification des conteneurs..."
    - docker compose -f docker-compose.production.yml ps
    - echo "📊 Logs DLT Worker (dernières 50 lignes):"
    - docker logs brgm-dlt-worker --tail 50 || echo "Worker logs not available"
    - echo "📊 Logs Dagster Webserver (dernières 20 lignes):"
    - docker logs brgm-dagster-webserver --tail 20 || echo "Webserver logs not available"
    - echo "🔍 Worker health check:"
    - docker inspect brgm-dlt-worker --format='{{json .State.Health}}' | python3 -m json.tool || echo "Health check not available"
    - echo "✅ Déploiement terminé!"
  environment:
    name: production
    url: http://srv991054.hstgr.cloud:8080
  only:
    - main
  tags:
    - hubeau
  dependencies:
    - build:image

# Job de rollback en cas de problème
rollback:production:
  stage: deploy
  image: docker:24-cli
  before_script:
    - apk add --no-cache bash
  script:
    - echo "🔄 Rollback - Redémarrage des services..."
    - cd /srv/brgm
    - docker compose -f docker-compose.production.yml restart
    - sleep 20
    - docker compose -f docker-compose.production.yml ps
    - echo "✅ Services redémarrés"
  environment:
    name: production
    url: http://srv991054.hstgr.cloud:8080
  only:
    - main
  tags:
    - hubeau
  when: manual
