# GitLab CI/CD Pipeline pour déploiement automatique sur VPS Hostinger
# Trigger: Push sur branche main

stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  PROJECT_DIR: /srv/brgm

# Stage 1: Build de l'image Docker (automatique sur chaque push)
build:image:
  stage: build
  image: docker:24-cli
  before_script:
    - apk add --no-cache bash rsync
  script:
    - echo "🚀 Build automatique déclenché par push sur main"
    - echo "📦 Synchronisation des fichiers vers /srv/brgm..."
    # Le runner GitLab clone dans /builds/, on copie vers /srv/brgm
    - rsync -av --delete --exclude='.git' --exclude='dagster_home/history' --exclude='dagster_home/storage' --exclude='__pycache__' ./ /srv/brgm/
    - echo "🏗️ Build de l'image Docker..."
    - cd /srv/brgm
    - docker build -f docker/dagster/Dockerfile -t hubeau-dagster:$CI_COMMIT_SHORT_SHA .
    - docker tag hubeau-dagster:$CI_COMMIT_SHORT_SHA hubeau-dagster:latest
    - echo "✅ Image buildée: hubeau-dagster:latest (tag: $CI_COMMIT_SHORT_SHA)"
  only:
    - main
  tags:
    - hubeau

# Stage 2: Déploiement sur VPS (automatique après le build)
deploy:production:
  stage: deploy
  image: docker:24-cli
  before_script:
    - apk add --no-cache bash
  script:
    - echo "🔄 Déploiement automatique sur production..."
    - cd /srv/brgm
    - echo "🛑 Arrêt des anciens conteneurs..."
    - docker compose -f docker-compose.production.yml down
    - echo "🚀 Démarrage avec la nouvelle image..."
    - docker compose -f docker-compose.production.yml up -d
    - echo "⏳ Attente des services (60s)..."
    - sleep 60
    - echo "✅ Vérification des conteneurs..."
    - docker compose -f docker-compose.production.yml ps
    - echo "📊 Logs Dagster (dernières 20 lignes):"
    - docker logs brgm-dagster-webserver --tail 20
    - echo "✅ Déploiement terminé!"
  environment:
    name: production
    url: http://srv991054.hstgr.cloud:8080
  only:
    - main
  tags:
    - hubeau
  dependencies:
    - build:image

# Job de rollback en cas de problème
rollback:production:
  stage: deploy
  image: docker:24-cli
  before_script:
    - apk add --no-cache bash
  script:
    - echo "🔄 Rollback - Redémarrage des services..."
    - cd /srv/brgm
    - docker compose -f docker-compose.production.yml restart
    - sleep 20
    - docker compose -f docker-compose.production.yml ps
    - echo "✅ Services redémarrés"
  environment:
    name: production
    url: http://srv991054.hstgr.cloud:8080
  only:
    - main
  tags:
    - hubeau
  when: manual
