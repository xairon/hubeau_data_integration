# GitLab CI/CD Pipeline pour déploiement automatique sur VPS Hostinger
# Trigger: Push sur branche main

stages:
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  PROJECT_DIR: /srv/brgm

# Stage 1: Tests (optionnel, à activer plus tard)
test:code:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install pytest ruff
  script:
    - echo "✓ Tests désactivés pour l'instant"
    # - ruff check src/
    # - pytest tests/ -v
  only:
    - main
  when: manual  # Déclencher manuellement pour l'instant

# Stage 2: Déploiement sur VPS (le runner tourne SUR le serveur)
deploy:production:
  stage: deploy
  image: docker:24-cli
  before_script:
    - apk add --no-cache bash rsync
  script:
    - echo "🚀 Déploiement automatique (runner local sur VPS)..."
    - echo "📦 Synchronisation des fichiers vers /srv/brgm..."
    # Le runner GitLab clone dans /builds/, on copie vers /srv/brgm
    - rsync -av --delete --exclude='.git' --exclude='dagster_home/history' --exclude='dagster_home/storage' --exclude='__pycache__' ./ /srv/brgm/
    - echo "🏗️ Build et déploiement..."
    - cd /srv/brgm
    - docker build -f docker/dagster/Dockerfile -t hubeau-dagster:latest .
    - echo "🔄 Redémarrage des services..."
    - docker compose -f docker-compose.production.yml up -d --build
    - echo "⏳ Attente des services..."
    - sleep 30
    - echo "✅ Vérification des conteneurs..."
    - docker compose -f docker-compose.production.yml ps
    - echo "✅ Déploiement terminé!"
  environment:
    name: production
    url: http://srv991054.hstgr.cloud:8080
  only:
    - main
  tags:
    - hubeau
  when: manual  # Nécessite confirmation manuelle

# Job de rollback en cas de problème
rollback:production:
  stage: deploy
  image: docker:24-cli
  before_script:
    - apk add --no-cache bash
  script:
    - echo "🔄 Rollback - Redémarrage des services..."
    - cd /srv/brgm
    - docker compose -f docker-compose.production.yml restart
    - sleep 20
    - docker compose -f docker-compose.production.yml ps
    - echo "✅ Services redémarrés"
  environment:
    name: production
    url: http://srv991054.hstgr.cloud:8080
  only:
    - main
  tags:
    - hubeau
  when: manual
