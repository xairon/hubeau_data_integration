image: python:3.9-slim

# Variables pour le job
variables:
  # Évite les prompts interactifs pendant l'installation
  DEBIAN_FRONTEND: noninteractive

stages:
  - build
  - deploy

# ============================================================================
# BUILD : images custom SANDBOX → GitLab Container Registry (via kaniko)
# ----------------------------------------------------------------------------
# kaniko ne nécessite pas de Docker privilégié (compatible runners verrouillés).
# Les images sont poussées sur $CI_REGISTRY_IMAGE avec le tag "sandbox".
# Le compose docker-compose.sandbox.yml les référence via REGISTRY_PREFIX.
# ============================================================================
.kaniko:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [ "" ]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
  rules:
    - if: '$CI_COMMIT_BRANCH == "feat/sandbox-deploy"'
    - if: '$CI_COMMIT_BRANCH == "main"'

build_worker:
  extends: .kaniko
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/docker/worker/Dockerfile" --destination "$CI_REGISTRY_IMAGE/hubeau-worker:sandbox"

build_orchestrator:
  extends: .kaniko
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/docker/orchestrator/Dockerfile" --destination "$CI_REGISTRY_IMAGE/hubeau-orchestrator:sandbox"

build_postgres:
  extends: .kaniko
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/docker/sandbox/postgres.Dockerfile" --destination "$CI_REGISTRY_IMAGE/hubeau-postgres-sandbox:sandbox"

pages:
  stage: deploy
  script:
    # 1. Installation des dépendances système nécessaires pour psycopg2 (driver postgres)
    - apt-get update && apt-get install -y git libpq-dev gcc
    
    # 2. Installation de dbt
    # Version ÉPINGLÉE : dbt_project.yml exige >=1.7.0,<1.8.0 (compatibilité Dagster).
    # Sans épinglage, pip prend la dernière version publiée et `dbt deps` échoue sur
    # « This version of dbt is not supported with the 'hubeau_pipeline' package ».
    # C'est ce qui cassait ce job depuis le 2026-07-07.
    - pip install "dbt-postgres>=1.7.0,<1.8.0"

    # 3. Configuration du profil dbt
    #    Ce job ne se connecte JAMAIS à la base : `dbt docs generate` tourne avec
    #    --empty-catalog --no-compile, et `dbt parse` n'ouvre pas de connexion non plus.
    #    Un profil syntaxiquement valide suffit donc, et AUCUN secret n'est nécessaire.
    #    La variable DBT_PROFILE_CONTENT reste honorée si elle est définie ; sinon on
    #    écrit un profil factice. Sans ce repli, le job échouait sur
    #    « The profiles.yml file at ./profiles.yml is empty ».
    - |
      if [ -n "$DBT_PROFILE_CONTENT" ] && [ -f "$DBT_PROFILE_CONTENT" ]; then
        cp "$DBT_PROFILE_CONTENT" profiles.yml
      elif [ -n "$DBT_PROFILE_CONTENT" ]; then
        echo "$DBT_PROFILE_CONTENT" > profiles.yml
      else
        cat > profiles.yml <<'PROFILE'
      hubeau_pipeline:
        target: docs
        outputs:
          docs:
            type: postgres
            host: localhost
            port: 5432
            user: docs
            password: docs
            dbname: docs
            schema: public
            threads: 1
      PROFILE
      fi

    # 4. Installation des dépendances du projet dbt
    - dbt deps --project-dir src/dbt_hubeau

    # 5. Génération de la documentation
    # étape 1 : "dbt parse" génère le manifest.json sans se connecter à la base
    - dbt parse --project-dir src/dbt_hubeau --profiles-dir .
    
    # étape 2 : "dbt docs generate" utilise ce manifest pour créer le site
    # --no-compile : utilise le manifest existant (créé par parse) au lieu de recompiler
    # --empty-catalog : ne cherche pas les infos de la base
    - dbt docs generate --project-dir src/dbt_hubeau --profiles-dir . --empty-catalog --no-compile

    # 6. Préparation du dossier public pour GitLab Pages
    - mkdir public
    # Déplacement des fichiers générés dans public/
    - mv src/dbt_hubeau/target/index.html public/
    - mv src/dbt_hubeau/target/manifest.json public/
    - mv src/dbt_hubeau/target/catalog.json public/
    # Copie des autres assets nécessaires (graphe, recherche...)
    - cp -r src/dbt_hubeau/target/static public/ 2>/dev/null || true
    - cp src/dbt_hubeau/target/*.json public/ 2>/dev/null || true
    - cp src/dbt_hubeau/target/*.js public/ 2>/dev/null || true

  artifacts:
    paths:
      - public
  only:
    # Exécuter uniquement sur la branche main
    - main
