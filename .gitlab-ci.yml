# GitLab CI/CD Pipeline pour déploiement automatique sur VPS Hostinger
# Trigger: Push sur branche main

stages:
  - test-connectivity
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  PROJECT_DIR: /srv/brgm
  # Solutions pour erreurs 503 Docker Hub
  FF_GITLAB_REGISTRY_HELPER_IMAGE: 1
  DOCKER_PULL_POLICY: "if-not-present"  # Préférer cache local
  # Désactiver BuildKit (pas disponible avec docker-cli 25 sans buildx)
  DOCKER_BUILDKIT: 0
  COMPOSE_DOCKER_CLI_BUILD: 0
  # Portainer accessible sur https://srv991054.hstgr.cloud:9443 après déploiement

# Stage 0: Test de connectivité Docker Hub (préventif)
test:docker-hub-connectivity:
  stage: test-connectivity
  image: alpine:3.19
  retry:
    max: 2
    when:
      - unknown_failure
      - api_failure
  before_script:
    - apk add --no-cache curl
  script:
    - echo "🌐 Test de connectivité Docker Hub..."
    - |
      if curl -s --max-time 30 https://registry-1.docker.io/v2/ > /dev/null; then
        echo "✅ Docker Hub accessible - Pipeline peut continuer"
      else
        echo "❌ Docker Hub non accessible - Pipeline sera retenté"
        echo "💡 Consultez https://status.docker.com/ pour le statut du service"
        exit 1
      fi
    - echo "🔍 Test de pull d'une image légère..."
    - |
      if docker pull alpine:3.19 > /dev/null 2>&1; then
        echo "✅ Pull d'image réussi"
      else
        echo "⚠️  Pull d'image échoué mais Docker Hub accessible"
      fi
  only:
    - main
  tags:
    - hubeau
  allow_failure: true  # Ne pas bloquer le pipeline si ce test échoue

# Stage 1: Build des images Docker (automatique sur chaque push)
build:image:
  stage: build
  # Utiliser une image plus récente et stable d'Alpine
  image: alpine:3.19
  # Retry strategy pour erreurs Docker Hub
  retry:
    max: 2  # Maximum autorisé par GitLab
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - unknown_failure
  before_script:
    # Installation avec retry automatique
    - echo "📦 Installation des dépendances depuis Alpine..."
    - |
      for i in {1..3}; do
        if apk add --no-cache docker-cli docker-cli-compose bash rsync curl; then
          echo "✅ Installation réussie au tentatif $i"
          break
        else
          echo "❌ Tentative $i échouée, retry dans 10s..."
          sleep 10
        fi
      done
    - docker --version || echo "❌ Docker CLI installation failed"
    - docker compose version || echo "⚠️  Docker Compose plugin non disponible"
    # Script de fallback pour erreurs Docker Hub
    - echo "🔧 Préparation du script de fallback Docker Hub..."
    - chmod +x scripts/fix-docker-pull.sh || echo "⚠️  Script déjà exécutable"
  script:
    - echo "🚀 Build automatique déclenché par push sur main"
    - echo "📦 Synchronisation des fichiers vers /srv/brgm..."
    # Le runner GitLab clone dans /builds/, on copie vers /srv/brgm
    - rsync -av --delete --exclude='.git' --exclude='dagster_home/history' --exclude='dagster_home/storage' --exclude='__pycache__' ./ /srv/brgm/
    - echo "🏗️ Build de l'image Orchestrator..."
    - cd /srv/brgm
    - docker build -f docker/orchestrator/Dockerfile -t hubeau-orchestrator:$CI_COMMIT_SHORT_SHA .
    - docker tag hubeau-orchestrator:$CI_COMMIT_SHORT_SHA hubeau-orchestrator:latest
    - echo "✅ Image hubeau-orchestrator:latest buildée (tag $CI_COMMIT_SHORT_SHA)"
    - echo "🏗️ Build de l'image Worker..."
    - docker build -f docker/worker/Dockerfile -t hubeau-worker:$CI_COMMIT_SHORT_SHA .
    - docker tag hubeau-worker:$CI_COMMIT_SHORT_SHA hubeau-worker:latest
    - echo "✅ Image hubeau-worker:latest buildée (tag $CI_COMMIT_SHORT_SHA)"
  only:
    - main
  tags:
    - hubeau

# Stage 2: Déploiement sur VPS (automatique après le build)
deploy:production:
  stage: deploy
  # Utiliser une image plus récente et stable d'Alpine
  image: alpine:3.19
  # Retry strategy pour erreurs Docker Hub
  retry:
    max: 2  # Maximum autorisé par GitLab
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - unknown_failure
  before_script:
    # Installation avec retry automatique
    - echo "📦 Installation des dépendances depuis Alpine..."
    - |
      for i in {1..3}; do
        if apk add --no-cache docker-cli docker-cli-compose bash curl; then
          echo "✅ Installation réussie au tentatif $i"
          break
        else
          echo "❌ Tentative $i échouée, retry dans 10s..."
          sleep 10
        fi
      done
    - docker --version || echo "❌ Docker CLI installation failed"
    - docker compose version || echo "⚠️  Docker Compose plugin non disponible"
    # Script de fallback pour erreurs Docker Hub
    - echo "🔧 Préparation du script de fallback Docker Hub..."
    - chmod +x scripts/fix-docker-pull.sh || echo "⚠️  Script déjà exécutable"
  script:
    - echo "🔄 Déploiement automatique sur production..."
    - cd /srv/brgm
    - echo "🔐 Vérification des variables obligatoires..."
    - |
      if [ -z "$DAGSTER_PG_PASSWORD" ]; then
        echo "❌ ERREUR: DAGSTER_PG_PASSWORD non définie dans GitLab CI/CD Variables"
        exit 1
      fi
      if [ -z "$PG_PASSWORD" ]; then
        echo "❌ ERREUR: PG_PASSWORD non définie dans GitLab CI/CD Variables"
        exit 1
      fi
    - echo "✅ Toutes les variables obligatoires sont définies"
    - echo "🔐 Export des variables GitLab CI/CD pour Docker Compose..."
    - export DAGSTER_PG_HOST=${DAGSTER_PG_HOST:-dagster_postgres}
    - export DAGSTER_PG_PORT=${DAGSTER_PG_PORT:-5432}
    - export DAGSTER_PG_DB=${DAGSTER_PG_DB:-dagster}
    - export DAGSTER_PG_USER=${DAGSTER_PG_USER:-postgres}
    - export DAGSTER_PG_PASSWORD=${DAGSTER_PG_PASSWORD}
    - export PG_HOST=${PG_HOST:-postgres}
    - export PG_PASSWORD=${PG_PASSWORD}
    - export POSTGIS_HOST=${POSTGIS_HOST:-postgis}
    - echo "✅ Variables exportées (Docker Compose les lira automatiquement)"
    - echo "🔍 Debug - DAGSTER_PG_HOST=$DAGSTER_PG_HOST"
    - echo "🔍 Debug - DAGSTER_PG_USER=$DAGSTER_PG_USER"
    - echo "🔍 Debug - DAGSTER_PG_DB=$DAGSTER_PG_DB"
    - echo "🔍 Debug - DAGSTER_PG_PASSWORD défini=$([ -n "$DAGSTER_PG_PASSWORD" ] && echo 'OUI' || echo 'NON')"
    - echo "🔍 Debug PostgreSQL:"
    - echo "  - PG_HOST=$PG_HOST"
    - echo "  - PG_PASSWORD défini=$([ -n "$PG_PASSWORD" ] && echo 'OUI' || echo 'NON')"
    - echo "🛑 Arrêt des anciens conteneurs..."
    - docker compose -f docker-compose.production.yml down
    - echo "🔍 DEBUG - Variables FORCE detectees"
    - env | grep FORCE || echo "  Aucune variable FORCE trouvée"
    - |
      if [ "$(echo "$FORCE_POSTGRES_RESET" | tr '[:upper:]' '[:lower:]' | tr -d ' ')" = "true" ]; then
        echo "⚠️  FORCE_POSTGRES_RESET=true détecté dans GitLab CI/CD Variables"
        echo "🗑️  Suppression du volume PostgreSQL Dagster pour forcer la réinitialisation..."
        if [ -d "/srv/brgm-data/dagster_pg" ]; then
          rm -rf /srv/brgm-data/dagster_pg
          echo "✅ Volume /srv/brgm-data/dagster_pg supprimé"
        else
          echo "ℹ️  Volume /srv/brgm-data/dagster_pg n'existe pas (déjà supprimé ou première installation)"
        fi
        echo "📝 PostgreSQL sera recréé avec le mot de passe depuis GitLab Variables"
      else
        echo "ℹ️  FORCE_POSTGRES_RESET non défini ou = false - Volume PostgreSQL conservé"
        echo "💡 Pour réinitialiser PostgreSQL: définir FORCE_POSTGRES_RESET=true dans GitLab CI/CD Variables"
      fi
    - echo "💡 Les scripts d'initialisation PostgreSQL Hub'Eau s'exécutent automatiquement à chaque déploiement"
    - echo "   (ils utilisent IF NOT EXISTS donc sont idempotents et sans risque)"
    - echo "🚀 Démarrage avec la nouvelle image..."
    - |
      if ! docker compose -f docker-compose.production.yml up -d; then
        echo "❌ docker compose up a échoué!"
        echo "📋 Logs Worker (toutes les lignes):"
        docker logs brgm-dlt-worker 2>/dev/null || echo "Worker container not found"
        echo "📋 Logs Dagster Postgres:"
        docker logs brgm-dagster-postgres --tail 50 2>/dev/null || echo "Postgres container not found"
        exit 1
      fi
    - echo "⏳ Attente que PostgreSQL démarre..."
    - |
      # Attendre que PostgreSQL soit prêt avant de vérifier l'initialisation
      max_wait=30
      waited=0
      while [ $waited -lt $max_wait ]; do
        if docker exec brgm-postgres pg_isready -U postgres -d postgres > /dev/null 2>&1; then
          echo "✅ PostgreSQL est prêt après ${waited}s"
          break
        fi
        echo "⏳ PostgreSQL pas encore prêt (${waited}s/${max_wait}s)..."
        sleep 2
        waited=$((waited + 2))
      done
    - echo "🔧 Exécution des scripts d'initialisation PostgreSQL Hub'Eau..."
    - |
      # Exécuter TOUS les scripts SQL à chaque déploiement
      # Les scripts utilisent IF NOT EXISTS donc sont idempotents - pas de risque
      echo "💡 Les scripts SQL utilisent CREATE ... IF NOT EXISTS - exécution sans risque à chaque déploiement"

      for script in /srv/brgm/docker/init-scripts/postgres/*.sql; do
        script_name=$(basename "$script")
        echo "📄 Exécution de $script_name..."

        # Capturer la sortie pour analyse
        output=$(docker exec -i brgm-postgres psql -U postgres -d postgres < "$script" 2>&1)

        # Filtrer les erreurs bénignes (normales pour scripts idempotents)
        errors=$(echo "$output" | grep -i "error" | grep -v "already exists" || true)

        if [ -n "$errors" ]; then
          echo "❌ Erreur lors de l'exécution de $script_name"
          echo "$errors"
          exit 1
        else
          echo "✅ $script_name exécuté avec succès"
        fi
      done
      echo "✅ Tous les scripts d'initialisation ont été exécutés"
    - echo "✅ Vérification de l'initialisation PostgreSQL Hub'Eau..."
    - |
      # ⚠️ NOTE: Les tables Hub'Eau sont créées AUTOMATIQUEMENT par DLT au premier run
      # Ce script vérifie seulement que le schéma et PostGIS sont prêts
      # Les tables seront créées par Dagster/DLT lors du premier asset run

      # Vérifier que le schéma existe
      schema_exists=$(docker exec brgm-postgres psql -U postgres -d postgres -tAc "SELECT COUNT(*) FROM information_schema.schemata WHERE schema_name='hubeau'" 2>/dev/null | tr -d ' ')

      if [ -z "$schema_exists" ] || [ "$schema_exists" -eq 0 ]; then
        echo "❌ ERREUR: Schéma hubeau n'existe pas"
        docker logs brgm-postgres --tail 100
        exit 1
      fi

      # Vérifier que PostGIS est installé
      postgis_exists=$(docker exec brgm-postgres psql -U postgres -d postgres -tAc "SELECT COUNT(*) FROM pg_extension WHERE extname='postgis'" 2>/dev/null | tr -d ' ')

      if [ -z "$postgis_exists" ] || [ "$postgis_exists" -eq 0 ]; then
        echo "❌ ERREUR: Extension PostGIS non installée"
        docker logs brgm-postgres --tail 100
        exit 1
      fi

      # Compter les tables (peut être 0 si première installation)
      table_count=$(docker exec brgm-postgres psql -U postgres -d postgres -tAc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='hubeau'" 2>/dev/null | tr -d ' ')

      echo "✅ Initialisation Hub'Eau réussie !"
      echo "   - Schéma hubeau: ✅ créé"
      echo "   - Extension PostGIS: ✅ installée"

      if [ -z "$table_count" ] || [ "$table_count" -eq 0 ]; then
        echo "   - Tables: 0 (DLT les créera au premier run)"
        echo ""
        echo "💡 Pour créer les tables Hub'Eau:"
        echo "   1. Accédez à Dagster UI (http://srv991054.hstgr.cloud:8080)"
        echo "   2. Lancez un asset CSV (ex: temperature_stations_csv)"
        echo "   3. DLT analysera le CSV et créera la table automatiquement"
      else
        echo "   - Tables: $table_count (déjà créées)"
      fi
    - echo "✅ Vérification des conteneurs..."
    - docker compose -f docker-compose.production.yml ps
    - echo "🔍 Test de connexion PostgreSQL Dagster..."
    - |
      if docker exec brgm-dagster-postgres psql -U postgres -d dagster -c "SELECT version();" > /dev/null 2>&1; then
        echo "✅ PostgreSQL Dagster accessible et fonctionnel"
        docker exec brgm-dagster-postgres psql -U postgres -d dagster -c "SELECT COUNT(*) as table_count FROM information_schema.tables WHERE table_schema='public';" | grep -A 1 "table_count"
      else
        echo "❌ ERREUR: PostgreSQL Dagster non accessible"
        echo "📊 Logs PostgreSQL (50 dernières lignes):"
        docker logs brgm-dagster-postgres --tail 50
        exit 1
      fi
    - echo "📊 Résumé final de l'initialisation Hub'Eau..."
    - |
      # Afficher un résumé (vérification déjà faite dans l'étape précédente)
      table_count=$(docker exec brgm-postgres psql -U postgres -d postgres -tAc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='hubeau'" | tr -d ' ')
      echo "✅ PostgreSQL Hub'Eau initialisé et vérifié"
      echo "📊 Résumé:"
      echo "   - Schéma: hubeau ✅"
      echo "   - PostGIS: installé ✅"

      if [ -z "$table_count" ] || [ "$table_count" -eq 0 ]; then
        echo "   - Tables: 0 (DLT les créera automatiquement au premier run)"
      else
        echo "   - Tables: $table_count (déjà créées par DLT)"
        # Afficher les premières tables comme confirmation
        echo "📋 Exemples de tables existantes:"
        docker exec brgm-postgres psql -U postgres -d postgres -tAc "SELECT '   - ' || table_name FROM information_schema.tables WHERE table_schema='hubeau' ORDER BY table_name LIMIT 5"
      fi
    - echo "🔍 Vérification des variables d'environnement dans dagster_webserver..."
    - |
      echo "Variables DAGSTER_PG dans le conteneur webserver:"
      docker exec brgm-dagster-webserver env | grep DAGSTER_PG | sed 's/PASSWORD=.*/PASSWORD=***MASKED***/' || echo "❌ Aucune variable DAGSTER_PG trouvée"
    - echo "🔍 Vérification des variables PG dans dlt_worker..."
    - |
      echo "=== Variables d'environnement dans dlt_worker ==="
      docker exec brgm-dlt-worker python -c "
      import os
      print('✅ Variables détectées dans dlt_worker:')
      print('   PG_PASSWORD:', 'SET' if os.getenv('PG_PASSWORD') else 'NOT SET')
      print('   PG_HOST:', os.getenv('PG_HOST', 'NOT SET'))
      " || echo "❌ Erreur lors de la vérification des variables"
    - echo "📊 Logs DLT Worker (dernières 50 lignes):"
    - docker logs brgm-dlt-worker --tail 50 || echo "Worker logs not available"
    - echo "📊 Logs Dagster Webserver (dernières 20 lignes):"
    - docker logs brgm-dagster-webserver --tail 20 || echo "Webserver logs not available"
    - echo "🔍 Worker health check:"
    - docker inspect brgm-dlt-worker --format='{{json .State.Health}}' | python3 -m json.tool || echo "Health check not available"
    - echo "✅ Déploiement terminé!"
  environment:
    name: production
    url: http://srv991054.hstgr.cloud:8080
  only:
    - main
  tags:
    - hubeau
  dependencies:
    - build:image

# Job de rollback en cas de problème
rollback:production:
  stage: deploy
  # Utiliser une image plus récente et stable d'Alpine
  image: alpine:3.19
  before_script:
    # Installation avec retry automatique
    - echo "📦 Installation des dépendances depuis Alpine..."
    - |
      for i in {1..3}; do
        if apk add --no-cache docker-cli docker-cli-compose bash curl; then
          echo "✅ Installation réussie au tentatif $i"
          break
        else
          echo "❌ Tentative $i échouée, retry dans 10s..."
          sleep 10
        fi
      done
    - docker --version || echo "❌ Docker CLI installation failed"
    - docker compose version || echo "⚠️  Docker Compose plugin non disponible"
    # Script de fallback pour erreurs Docker Hub
    - echo "🔧 Préparation du script de fallback Docker Hub..."
    - chmod +x scripts/fix-docker-pull.sh || echo "⚠️  Script déjà exécutable"
  script:
    - echo "🔄 Rollback - Redémarrage des services..."
    - cd /srv/brgm
    - docker compose -f docker-compose.production.yml restart
    - sleep 20
    - docker compose -f docker-compose.production.yml ps
    - echo "✅ Services redémarrés"
  environment:
    name: production
    url: http://srv991054.hstgr.cloud:8080
  only:
    - main
  tags:
    - hubeau
  when: manual
