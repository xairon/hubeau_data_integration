# GitLab CI/CD Pipeline pour Hub'Eau Data Integration
# https://scm.univ-tours.fr/ringuet/hubeau_data_integration

stages:
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

# Tests unitaires
test:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - python -m pytest tests/ -v --cov=src/hubeau_pipeline --cov-report=xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
  only:
    - main
    - merge_requests

# Build de l'image Docker
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -f docker/dagster/Dockerfile -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker build -f docker/dagster/Dockerfile -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main

# Déploiement (exemple pour environnement de test)
deploy_staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Déploiement vers l'environnement de staging"
    - echo "Image: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    # Ici vous pouvez ajouter vos commandes de déploiement spécifiques
    # Par exemple, mise à jour d'un docker-compose sur un serveur distant
  environment:
    name: staging
    url: https://staging.hubeau.univ-tours.fr
  only:
    - main
  when: manual

# Validation de la configuration Dagster
validate_dagster:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - python -c "from src.hubeau_pipeline.definitions import defs; print('Configuration Dagster valide')"
  only:
    - main
    - merge_requests

# Linting du code
lint:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install --upgrade pip
    - pip install black flake8
  script:
    - black --check src/ tests/
    - flake8 src/ tests/
  only:
    - main
    - merge_requests
