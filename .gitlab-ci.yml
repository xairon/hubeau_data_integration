# GitLab CI/CD Pipeline pour déploiement automatique sur VPS Hostinger
# Trigger: Push sur branche main

stages:
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  PROJECT_DIR: /srv/brgm

# Stage 1: Tests (optionnel, à activer plus tard)
test:code:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install pytest ruff
  script:
    - echo "✓ Tests désactivés pour l'instant"
    # - ruff check src/
    # - pytest tests/ -v
  only:
    - main
  when: manual  # Déclencher manuellement pour l'instant

# Stage 2: Build de l'image Docker
build:docker:
  stage: build
  image: docker:24-cli
  before_script:
    - echo "Skipping registry login for local build"
  script:
    - echo "🏗️ Build de l'image Docker..."
    - docker build -f docker/dagster/Dockerfile -t hubeau-dagster:$CI_COMMIT_SHORT_SHA .
    - docker tag hubeau-dagster:$CI_COMMIT_SHORT_SHA hubeau-dagster:latest
    - echo "✅ Image buildée avec succès"
  only:
    - main
  tags:
    - hubeau

# Stage 3: Déploiement sur VPS
deploy:production:
  stage: deploy
  image: docker:24-cli
  before_script:
    - apk add --no-cache bash curl rsync
  script:
    - echo "🚀 Déploiement sur VPS Hostinger..."
    - echo "📦 Copie des fichiers vers $PROJECT_DIR..."
    # Copier les fichiers depuis le workspace GitLab vers le serveur
    - rsync -av --exclude='.git' --exclude='dagster_home/history' --exclude='dagster_home/storage' --exclude='__pycache__' ./ $PROJECT_DIR/
    - echo "🔧 Exécution du script de déploiement..."
    - cd $PROJECT_DIR
    - chmod +x scripts/deploy.sh
    - bash scripts/deploy.sh
    - echo "✅ Déploiement terminé"
  environment:
    name: production
    url: http://srv991054.hstgr.cloud:8080
  only:
    - main
  tags:
    - hubeau
  when: manual  # Nécessite confirmation manuelle pour éviter déploiements accidentels

# Job de rollback en cas de problème
rollback:production:
  stage: deploy
  image: docker:24-cli
  before_script:
    - apk add --no-cache bash curl
  script:
    - echo "🔄 Rollback du déploiement..."
    - cd $PROJECT_DIR
    - echo "⚠️  Restauration de la dernière sauvegarde MinIO..."
    - |
      if [ -f /srv/brgm-data/backups/$(ls -t /srv/brgm-data/backups/minio_backup_*.tar.gz 2>/dev/null | head -1) ]; then
        echo "Sauvegarde trouvée, restauration en cours..."
      else
        echo "Aucune sauvegarde disponible, redémarrage des services..."
      fi
    - docker compose -f docker-compose.production.yml restart
    - echo "✅ Rollback terminé (services redémarrés)"
  environment:
    name: production
    url: http://srv991054.hstgr.cloud:8080
  only:
    - main
  tags:
    - hubeau
  when: manual
