resource:
  name: era5_daily_temp_stats
  # ERA5-Land archive HORAIRE brute (PAS le produit dérivé
  # `derived-era5-land-daily-statistics` : ce service post-traité côté CADS est
  # une file minuscule et globalement saturée, ~43h d'attente PAR ANNÉE
  # demandée -> backfill complet = ~6 semaines, inutilisable).
  #
  # La donnée horaire brute EST la donnée sur laquelle le CADS calcule ces
  # mêmes statistiques journalières -> on télécharge l'horaire (rapide, mesuré
  # 179s pour un mois complet, 17.7 MB) et on agrège nous-mêmes en local
  # (mean/min/max). Équivalence vérifiée empiriquement contre les données 1950
  # déjà en base (34 488 cellule-jours) : Tn/Tx identiques à 0.0000°C (100%),
  # moyenne à 0.01°C près (arrondi float de la colonne NUMERIC(6,2)).
  # Voir docstring de src/hubeau_pipeline/assets/bronze/era5_daily_temp_assets.py.
  dataset: reanalysis-era5-land

  # Variable ERA5 (nom officiel CDS)
  variable: 2m_temperature   # Température à 2m (K), servie sous le nom court `t2m`

  # 24 pas horaires -> l'agrégation locale journalière (mean/min/max) est
  # calculée sur les mêmes points que l'ancien service CADS `daily_statistic`.
  hours:
    - "00:00"
    - "01:00"
    - "02:00"
    - "03:00"
    - "04:00"
    - "05:00"
    - "06:00"
    - "07:00"
    - "08:00"
    - "09:00"
    - "10:00"
    - "11:00"
    - "12:00"
    - "13:00"
    - "14:00"
    - "15:00"
    - "16:00"
    - "17:00"
    - "18:00"
    - "19:00"
    - "20:00"
    - "21:00"
    - "22:00"
    - "23:00"

  # Zone géographique : France métropolitaine (identique à l'ingestion horaire existante)
  # Format: [North, West, South, East]
  area: [51.5, -5.5, 41.0, 10.0]

extraction:
  # Période historique complète
  time_range:
    start_year: 1950  # ERA5-Land commence en 1950
    end_year: null    # null = année courante

  # Résolution spatiale (métadonnée only — NON envoyé au CADS ; ERA5-Land servi en 0.1° natif)
  grid_resolution: 0.1

  # Délai de production Copernicus CDS pour ce produit (~6j observés, +1j marge)
  availability_lag_days: 7

performance:
  retry_times: 3
  retry_delay: 10.0  # 10 secondes entre retries (backoff exponentiel dans le code)
  # Téléchargement CONCURRENT des mois d'une même partition (archive horaire
  # brute, rapide et non saturée -> peut absorber plusieurs requêtes en
  # parallèle sans dégrader le temps de traitement, contrairement à l'ancien
  # produit dérivé). Un client cdsapi.Client dédié par thread.
  months_concurrency: 4

credentials:
  cds_api_url: https://cds.climate.copernicus.eu/api
  cds_api_key: ""  # Set via COPERNICUS_API_KEY env var (voir .env.example)
  cds_api_key_env: "COPERNICUS_API_KEY"
