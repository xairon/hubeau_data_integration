resource:
  name: hydrometry_observations_raw
  endpoint: /obs_elab.csv
  base_url: https://hubeau.eaufrance.fr/api/v2/hydrometrie
  # Bronze layer: no PK/FK constraints, duplicates allowed
  primary_key: null
extraction:
  default_params: {}
  # Date filter parameter names for this API
  date_filter_params:
    date_debut: date_debut_obs_elab  # Start date parameter name
    date_fin: date_fin_obs_elab      # End date parameter name
  station_slicing:
    station_param: code_entite
    batch_size: 50
performance:
  parallelism: 1
  batch_size: 5000
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 0.3
