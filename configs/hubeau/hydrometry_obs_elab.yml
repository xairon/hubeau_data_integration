resource:
  name: hydrometry_observations_raw
  endpoint: /obs_elab.csv
  base_url: https://hubeau.eaufrance.fr/api/v2/hydrometrie
  # Primary key pour déduplication (merge) - évite les doublons si job relancé
  primary_key: ["code_entite", "date_obs_elab"]
extraction:
  default_params:
    grandeur_hydro_elab: QmnJ  # Daily mean flow (Débit moyen journalier)
  # Date filter parameter names for this API
  date_filter_params:
    date_debut: date_debut_obs_elab  # Start date parameter name
    date_fin: date_fin_obs_elab      # End date parameter name
  station_slicing:
    station_param: code_entite
    batch_size: 20
performance:
  parallelism: 1
  batch_size: 5000
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 0.3
