resource:
  name: hydrometry_observations
  endpoint: /obs_elab.csv
  base_url: https://hubeau.eaufrance.fr/api/v2/hydrometrie
  primary_key:
  - code_station
  - date_obs_elab
  - grandeur_hydro_elab
extraction:
  default_params: {}
performance:
  parallelism: 5
  chunk_size: 10000
  batch_size: 8000
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 2.0
