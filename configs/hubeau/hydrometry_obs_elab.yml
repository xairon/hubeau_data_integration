source:
  name: hydrometry
  max_table_nesting: 2
resource:
  name: hydrometry_obs_elab
  endpoint: /obs_elab
  base_url: https://hubeau.eaufrance.fr/api/v2/hydrometrie
  primary_key:
  - code_station
  - date_obs_elab
  - grandeur_hydro_elab
  write_disposition: merge
  columns:
    id:
      data_type: text
      nullable: true
extraction:
  slicing_mode: station_month_chunked
  station_param: code_station
  station_chunk_size: 80
  start_param: date_debut_obs_elab
  end_param: date_fin_obs_elab
  pagination:
    type: page_based
    page_size: 5000
    max_pages: null
  default_params:
    format: json
  records_path: $.data
performance:
  parallelism: 5
  chunk_size: 10000
  retry_times: 3
  retry_delay: 2.0
  rate_limit:
    target_rps: 5.0
    max_concurrency: 1
transformers:
- validate_primary_keys
- normalize_dates:
    fields:
    - date_obs
destinations:
  postgres:
    dataset_name: bronze
    schema_name: hydrometry
    create_indexes: true
  filesystem:
    bucket_url: s3://hubeau-bronze
    file_format: parquet
    layout: '{table_name}/year={year}/{load_id}.parquet'
  duckdb:
    database: data/hydrometry.duckdb
