resource:
  name: hydrometry_obs_elab_raw
  endpoint: /obs_elab.csv
  base_url: https://hubeau.eaufrance.fr/api/v2/hydrometrie
  # PRIMARY KEY composite : une mesure par (code_site, date_obs_elab, grandeur_hydro_elab)
  # Must match dbt unique_key in stg_hydrometry_obs_elab.sql
  primary_key: ["code_site", "date_obs_elab", "grandeur_hydro_elab"]
extraction:
  default_params:
    grandeur_hydro_elab: QmnJ  # Daily mean flow (Débit moyen journalier)
  # Date filter parameter names for this API
  date_filter_params:
    date_debut: date_debut_obs_elab  # Start date parameter name
    date_fin: date_fin_obs_elab      # End date parameter name
  station_slicing:
    enabled: true
    station_param: code_entite  # CRITICAL: Hub'Eau obs_elab API uses code_entite (NOT code_site!)
    batch_size: 100  # Max 100 code_entite per API call (swagger limit). Codes are 8 chars → safe URL length.
performance:
  parallelism: 1
  batch_size: 5000
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 0.3
