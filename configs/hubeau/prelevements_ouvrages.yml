source:
  name: prelevements
  max_table_nesting: 2
resource:
  name: prelevements_ouvrages
  endpoint: /referentiel/ouvrages
  base_url: https://hubeau.eaufrance.fr/api/v1/prelevements
  primary_key:
  - code_ouvrage
  write_disposition: merge
  columns:
    id:
      data_type: text
      nullable: true
extraction:
  slicing_mode: global
  pagination:
    type: page_based
    page_size: 20000
    max_pages: null
  default_params: {}
performance:
  parallelism: 5
  chunk_size: 10000
  retry_times: 3
  retry_delay: 2.0
  rate_limit:
    target_rps: 5.0
    max_concurrency: 1
transformers:
- validate_primary_keys
- normalize_dates:
    fields:
    - date_obs
destinations:
  postgres:
    dataset_name: bronze
    schema_name: prelevements
    create_indexes: true
  filesystem:
    bucket_url: s3://hubeau-bronze
    file_format: parquet
    layout: '{table_name}/year={year}/{load_id}.parquet'
  duckdb:
    database: data/prelevements.duckdb
