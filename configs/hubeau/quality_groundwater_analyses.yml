    uri_laboratoire:
      data_type: text
      nullable: true
extraction:
  slicing_mode: station_month_chunked
  slicing_params:
    date_field: date_prelevement
    station_field: code_bss
    stations_per_chunk: 20
  pagination:
    type: page_based
  default_params: {}
performance:
  parallelism: 3
  chunk_size: 5000
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 2.0
transformers:
- validate_primary_keys
- normalize_dates:
    fields:
    - date_prelevement
    - date_maj_analyse
- validate_coordinates:
    lat_field: latitude
    lon_field: longitude
destinations:
  postgres:
    dataset_name: hubeau
