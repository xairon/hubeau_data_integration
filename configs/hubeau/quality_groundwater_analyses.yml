source:
  name: quality_groundwater
  max_table_nesting: 2
resource:
  name: quality_groundwater_analyses
  endpoint: /analyses
  base_url: https://hubeau.eaufrance.fr/api/v1/qualite_nappes
  primary_key:
  - code_bss
  - date_debut_prelevement  # Fix: API uses date_debut_prelevement, not date_prelevement
  - code_param  # Fix: API uses code_param, not code_parametre
  - code_fraction
  write_disposition: merge
  # Note: API doesn't have code_support field - removed from primary key
  # Fix: Column names updated to match API v1 response
  # API returns: code_param, code_fraction, date_debut_prelevement, etc.
  columns:
    code_bss:
      data_type: text
      nullable: false
    bss_id:
      data_type: text
      nullable: true
    urn_bss:
      data_type: text
      nullable: true
    longitude:
      data_type: double
      nullable: true
    latitude:
      data_type: double
      nullable: true
    date_debut_prelevement:
      data_type: date
      nullable: false
    code_param:  # API field, not code_parametre
      data_type: bigint
      nullable: false
    nom_param:
      data_type: text
      nullable: true
    uri_param:
      data_type: text
      nullable: true
    code_fraction:
      data_type: bigint
      nullable: false
    nom_fraction:
      data_type: text
      nullable: true
    uri_fraction:
      data_type: text
      nullable: true
    resultat:
      data_type: double
      nullable: true
    code_remarque_analyse:
      data_type: bigint
      nullable: true
    nom_remarque_analyse:
      data_type: text
      nullable: true
    uri_remarque_analyse:
      data_type: text
      nullable: true
    code_unite:
      data_type: text
      nullable: true
    nom_unite:
      data_type: text
      nullable: true
    symbole_unite:
      data_type: text
      nullable: true
    uri_unite:
      data_type: text
      nullable: true
    code_statut_analyse:
      data_type: text
      nullable: true
    nom_statut_analyse:
      data_type: text
      nullable: true
    uri_statut_analyse:
      data_type: text
      nullable: true
    code_qualification:
      data_type: text
      nullable: true
    nom_qualification:
      data_type: text
      nullable: true
    uri_qualification:
      data_type: text
      nullable: true
    limite_quantification:
      data_type: double
      nullable: true
    limite_detection:
      data_type: double
      nullable: true
    seuil_saturation:
      data_type: double
      nullable: true
    incertitude_analytique:
      data_type: double
      nullable: true
    codes_groupe_parametre:
      data_type: json
      nullable: true
    noms_groupe_parametre:
      data_type: json
      nullable: true
    uris_groupe_parametre:
      data_type: json
      nullable: true
    code_producteur:
      data_type: text
      nullable: true
    nom_producteur:
      data_type: text
      nullable: true
    uri_producteur:
      data_type: text
      nullable: true
    code_lieu_analyse:
      data_type: bigint
      nullable: true
    nom_lieu_analyse:
      data_type: text
      nullable: true
    uri_lieu_analyse:
      data_type: text
      nullable: true
    code_methode:
      data_type: bigint
      nullable: true
    nom_methode:
      data_type: text
      nullable: true
    uri_methode:
      data_type: text
      nullable: true
extraction:
  slicing_mode: station_month_chunked
  slicing_params:
    date_field: date_debut_prelevement  # Fix: API uses date_debut_prelevement
    station_field: code_bss
    stations_per_chunk: 20
  pagination:
    type: page_based
  default_params: {}
performance:
  parallelism: 3
  chunk_size: 5000
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 2.0
transformers:
- validate_primary_keys
- normalize_dates:
    fields:
    - date_debut_prelevement  # Fix: Updated field name
- validate_coordinates:
    lat_field: latitude
    lon_field: longitude
- handle_jsonb_arrays:
    fields:
    - codes_groupe_parametre
    - noms_groupe_parametre
    - uris_groupe_parametre
destinations:
  postgres:
    dataset_name: hubeau
