name: hydrometry_stations
source: hubeau
dataset_name: hydrometry_api
file_format: parquet
layout: "{table_name}.parquet"
base_url: https://hubeau.eaufrance.fr/api/v2/hydrometrie
path: /referentiel/stations
method: GET
params_default:
  format: json
  size: 5000  # ✅ OPTIMISATION: Augmenté de 1000 à 5000 - gain 3-5x
records_path: $.data
primary_keys: [code_station]
replication_key: date_maj_infos
pagination:
  type: page
  page_param: page
  page_size_param: size
  page_size: 5000
  until_expr: "len($.data) == 0"
slicer:
  mode: global  # Pas de filtrage nécessaire - récupération globale
rate_limit:
  target_rps: 5.0  # ✅ OPTIMISATION: Augmenté à 5.0 RPS (auto-adjust si 429) - gain 2.5x
  max_concurrency: 1
timeout: 60
comment: |
  API Hydrométrie Hub'Eau v2 - Référentiel des stations hydrométriques
  
  📊 Données de référence:
  - ~15,000 stations hydrométriques
  - Données de référence (pas de partition temporelle)
  - Mise à jour occasionnelle des informations de station
  
  🎯 Utilisation:
  - Référentiel pour les observations hydrométriques (observations_tr, obs_elab)
  - Filtrage des stations actives pour les observations
  - Informations géographiques et techniques des stations
  
  📋 Champs clés:
  - code_station: Identifiant unique de la station
  - libelle_station: Nom de la station
  - code_site: Code du site parent
  - coordonnee_x, coordonnee_y: Coordonnées géographiques
  - en_service: Station en service (true/false)
  - date_mise_en_service: Date de mise en service
  
  🔗 Documentation: https://hubeau.eaufrance.fr/page/api-hydrometrie
