source:
  name: hydrometry
  max_table_nesting: 2
resource:
  name: hydrometry_sites
  endpoint: /referentiel/sites
  base_url: https://hubeau.eaufrance.fr/api/v2/hydrometrie
  primary_key:
  - code_site
  write_disposition: replace
  columns:
    id:
      data_type: text
      nullable: true
extraction:
  slicing_mode: global
  pagination:
    type: page_based
    page_size: 5000
    max_pages: null
  default_params: {}
performance:
  parallelism: 5
  chunk_size: 10000
  retry_times: 3
  retry_delay: 2.0
  rate_limit:
    target_rps: 5.0
    max_concurrency: 1
transformers:
- validate_primary_keys
- normalize_dates:
    fields:
    - date_obs
- validate_coordinates:
    lat_field: latitude
    lon_field: longitude
destinations:
  postgres:
    dataset_name: bronze
    schema_name: hydrometry
    create_indexes: true
  filesystem:
    bucket_url: s3://hubeau-bronze
    file_format: parquet
    layout: '{table_name}/year={YYYY}/{load_id}.parquet'
  duckdb:
    database: data/hydrometry.duckdb
