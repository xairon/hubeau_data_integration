resource:
  name: hydrometry_sites
  endpoint: /referentiel/sites.csv
  base_url: https://hubeau.eaufrance.fr/api/v2/hydrometrie
  primary_key:
  - code_site
extraction:
  default_params: {}
performance:
  parallelism: 5
  chunk_size: 10000
  batch_size: 100000  # Optimisé avec micro-batching (2x augmentation - safe)
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 2.0
