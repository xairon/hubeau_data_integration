source:
  name: hydrometry
  max_table_nesting: 2
resource:
  name: hydrometry_sites
  endpoint: /referentiel/sites
  base_url: https://hubeau.eaufrance.fr/api/v2/hydrometrie
  primary_key: [code_site]
  write_disposition: replace
  columns:
    # Identifiants (3 attributs)
    code_site:
      data_type: text
      nullable: false
    libelle_site:
      data_type: text
      nullable: true
    type_site:
      data_type: text
      nullable: true

    # Localisation (10 attributs)
    coordonnee_x_site:
      data_type: double
      nullable: true
    coordonnee_y_site:
      data_type: double
      nullable: true
    code_projection:
      data_type: text
      nullable: true
    longitude_site:
      data_type: double
      nullable: true
    latitude_site:
      data_type: double
      nullable: true
    altitude_site:
      data_type: double
      nullable: true
    code_systeme_alti_site:
      data_type: text
      nullable: true

    # Administratif (6 attributs)
    code_commune_site:
      data_type: text
      nullable: true
    libelle_commune:
      data_type: text
      nullable: true
    code_departement:
      data_type: text
      nullable: true
    libelle_departement:
      data_type: text
      nullable: true
    code_region:
      data_type: text
      nullable: true
    libelle_region:
      data_type: text
      nullable: true

    # Hydrologie (6 attributs)
    code_cours_eau:
      data_type: text
      nullable: true
    libelle_cours_eau:
      data_type: text
      nullable: true
    uri_cours_eau:
      data_type: text
      nullable: true
    code_entite_hydro_site:
      data_type: text
      nullable: true
    code_troncon_hydro_site:
      data_type: text
      nullable: true
    code_zone_hydro_site:
      data_type: text
      nullable: true

    # Bassin Versant (3 attributs)
    surface_bv:
      data_type: double
      nullable: true
    premier_mois_etiage_site:
      data_type: integer
      nullable: true
    premier_mois_annee_hydro_site:
      data_type: integer
      nullable: true

    # Caractéristiques (4 attributs)
    statut_site:
      data_type: text
      nullable: true
    influence_generale_site:
      data_type: text
      nullable: true
    commentaire_influence_generale_site:
      data_type: text
      nullable: true
    commentaire_site:
      data_type: text
      nullable: true

    # Données (3 attributs)
    grandeur_hydro:
      data_type: text
      nullable: true
    date_premiere_donnee_dispo_site:
      data_type: date
      nullable: true
    date_maj_site:
      data_type: timestamp
      nullable: true

    # Réglementaire (2 attributs)
    type_contexte_loi_stat_site:
      data_type: text
      nullable: true
    type_loi_site:
      data_type: text
      nullable: true

    # Géométrie
    geometry:
      data_type: json
      nullable: true

extraction:
  slicing_mode: global
  pagination:
    type: page_based
  default_params: {}
performance:
  parallelism: 5
  chunk_size: 10000
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 2.0
transformers:
- validate_primary_keys
- normalize_dates:
    fields:
    - date_premiere_donnee_dispo_site
    - date_maj_site
- validate_coordinates:
    lat_field: latitude_site
    lon_field: longitude_site
destinations:
  postgres:
    dataset_name: hubeau