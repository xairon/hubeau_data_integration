resource:
  name: temperature_chroniques
  endpoint: /chronique.csv
  base_url: https://hubeau.eaufrance.fr/api/v1/temperature
  primary_key:
  - code_station
  - date_mesure_temp
  - code_parametre
extraction:
  default_params: {}
performance:
  parallelism: 5
  chunk_size: 10000
  batch_size: 100000  # Optimisé avec micro-batching (2x augmentation - safe)
  retry_times: 5
  retry_delay: 2.0
  rate_limit: 2.0
