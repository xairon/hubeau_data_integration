name: temperature_chroniques
source: hubeau
dataset_name: temperature_api
file_format: parquet
layout: "{table_name}/{load_id}.{file_id}.parquet"
base_url: https://hubeau.eaufrance.fr/api/v1/temperature
path: /chronique
method: GET
params_default:
  format: json
  size: 20000  # ✅ Test avec taille de page maximale (20K)
records_path: $.data
primary_keys: [code_station, date_mesure_temp]
# replication_key: date_mesure_temp  # ✅ OPTIMISATION: Commenté pour mode APPEND (partitions uniques) - gain 3-5x
pagination:
  type: page
  page_param: page
  page_size_param: size
  page_size: 20000  # ✅ Test avec taille de page maximale (20K)
  until_expr: "len($.data) == 0"
# ✅ STRATÉGIE ULTRA-OPTIMISÉE TEMPÉRATURE: Mode station_month_chunked
# Utilise UNIQUEMENT les stations actives (fournies par Dagster)
# Évite de requêter les départements vides (~60% des départements!)
slicer:
  mode: station_month_chunked  # ✅ Nouveau mode optimisé par stations
  station_param: code_station  # Paramètre station pour l'API
  station_chunk_size: 20  # ✅ 50 stations par requête (50÷50 = 1 chunk, optimisé)
  start_param: date_debut_mesure
  end_param: date_fin_mesure
  start_date: "{{ partition_date }}"  # Utilise la partition Dagster (ex: "2024-01-01")
  end_offset_days: 0  # ✅ Pas d'offset pour éviter les fenêtres supplémentaires
  # Les stations seront injectées dynamiquement par Dagster via stations_data
fallbacks:
  truncation_threshold: 20000  # ✅ Cohérent avec la taille de page (20K)
  split_chain: [station_month]  # Si troncature → découpage station×mois (dernier recours)
# Note: Les stations sont maintenant fournies par l'asset temperature_stations_reference
rate_limit:
  target_rps: 5.0  # ✅ OPTIMISATION: Augmenté à 5.0 RPS (auto-adjust si 429) - gain 7x
  max_concurrency: 5
timeout: 60
backoff_initial: 2.0  # Backoff plus long
backoff_max: 120.0
comment: |
  API Température des Cours d'Eau - Chroniques de température

  ✅ STRATÉGIE ULTRA-OPTIMISÉE - MODE STATION_MONTH_CHUNKED:
  - ~760 stations totales (dont ~50 encore en service)
  - Limite: 20,000 records par requête
  - Solution: Mode station_month_chunked (stations actives uniquement!)

  Stratégie ULTRA-optimisée (NOUVELLE):
  1. Dagster récupère les ~50 stations actives depuis l'API
  2. Mode station_month_chunked: 10 stations × 12 mois = ~60 requêtes
  3. Évite 100% des départements vides (~60 départements sans stations!)
  4. Fallback station_month: Découpage station×mois si troncature
  5. Partitions: Annuelles Dagster

  Avantages vs mode dept_datetime précédent:
  - Optimisation: ~60 requêtes vs 156 (-60% de requêtes!)
  - Aucune requête sur départements vides
  - Utilise UNIQUEMENT les stations actives (fournies par Dagster)
  - Compatible API: multi-stations supporté par Hub'Eau

  Calcul des requêtes ULTRA-OPTIMISÉ:
  - ~50 stations actives ÷ 10 (chunk_size) = 5 chunks
  - 5 chunks × 12 mois exacts = 60 requêtes total (2024 uniquement)
  - vs ancien mode dept_datetime: 156 requêtes (-60%!)
  - vs ancien code original: 760 stations × 12 mois = 9,120 requêtes (-99%!)
  - Optimisation: Pages de 20K records + fenêtres mensuelles exactes

  Données:
  - Mise à jour trimestrielle depuis Naïades
  - ~200,000 observations par an
  - Période couverte: 20+ années

