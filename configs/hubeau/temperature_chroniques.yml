source:
  name: temperature
  max_table_nesting: 2
resource:
  name: temperature_chroniques
  endpoint: /chronique
  base_url: https://hubeau.eaufrance.fr/api/v1/temperature
  primary_key:
  - code_station
  - date_mesure_temp
  write_disposition: merge
extraction:
  slicing_mode: station_month_chunked
  station_param: code_station
  station_chunk_size: 20
  start_param: date_debut_mesure
  end_param: date_fin_mesure
  pagination:
    type: page_based
    page_size: 20000
    max_pages: null
  default_params:
    format: json
  records_path: $.data
temporal_filter:
  start_param: date_debut_mesure
  end_param: date_fin_mesure
  start_date: "2020-01-01"
  end_offset_days: 0
performance:
  parallelism: 5
  chunk_size: 10000
  retry_times: 3
  retry_delay: 2.0
  rate_limit:
    target_rps: 5.0
    max_concurrency: 5
transformers:
- validate_primary_keys
- normalize_dates:
    fields:
    - date_mesure_temp
destinations:
  filesystem:
    bucket_url: s3://bronze
    file_format: parquet
    layout: '{table_name}/year={YYYY}/{load_id}.parquet'
