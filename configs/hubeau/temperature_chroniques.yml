resource:
  name: temperature_chroniques_raw
  endpoint: /chronique.csv
  base_url: https://hubeau.eaufrance.fr/api/v1/temperature
  # Bronze layer: no PK/FK constraints, duplicates allowed
  primary_key: null
extraction:
  default_params: {}
  # Date filter parameter names for this API
  date_filter_params:
    date_debut: date_debut_mesure  # Start date parameter name
    date_fin: date_fin_mesure      # End date parameter name
performance:
  parallelism: 1
  batch_size: 5000
  retry_times: 5
  retry_delay: 2.0
  rate_limit: 0.3
