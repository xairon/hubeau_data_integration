name: temperature_chroniques
source: hubeau
dataset_name: hubeau
base_url: https://hubeau.eaufrance.fr/api/v1/temperature
path: /chronique
method: GET
params_default:
  format: json
  size: 1000
records_path: $.data
primary_keys: [code_station, date_mesure]
replication_key: date_mesure
pagination:
  type: page
  page_param: page
  page_size_param: size
  page_size: 1000
  until_expr: "len($.data) == 0"
# ⚠️ LOGIQUE CRITIQUE TEMPÉRATURE: Mode datetime avec fallback automatique vers station_month
slicer:
  mode: datetime  # ✅ Mode datetime avec fallback automatique vers station_month
  start_param: date_debut_mesure
  end_param: date_fin_mesure
  window_days: 30  # Fenêtre mensuelle
  start_date: "{{ partition_date }}"  # Utilise la partition Dagster (ex: "2024-01-01")
  end_offset_days: 1
fallbacks:
  truncation_threshold: 20000  # ⚠️ LIMITE STRICTE 20K !
  split_chain: [station_month]  # Si troncature → déjà station×mois
# Note: Les stations sont maintenant fournies par l'asset temperature_stations_reference
rate_limit:
  target_rps: 0.7  # Rate limit très respectueux (API très sensible)
  max_concurrency: 1
timeout: 60
backoff_initial: 2.0  # Backoff plus long
backoff_max: 120.0
comment: |
  API Température des Cours d'Eau - Chroniques de température
  
  ⚠️ LOGIQUE CRITIQUE - MODE DATETIME AVEC FALLBACK AUTOMATIQUE:
  - ~760 stations (dont ~50 encore en service)
  - Limite: 20,000 records par requête
  - API supporte code_departement MAIS trop de données par département
  - Solution: Mode datetime avec fallback automatique vers station_month
  
  Stratégie (comme l'ancien code):
  1. Mode datetime: Tentative de récupération globale par mois
  2. Détection troncature: Si > 20k records → fallback automatique
  3. Fallback station_month: Découpage station par station × mois
  4. Partitions: Annuelles Dagster
  
  Avantages:
  - Optimisation: Essaie d'abord le mode global (plus rapide)
  - Fallback intelligent: Se découpe automatiquement si nécessaire
  - Compatible API: Utilise les paramètres supportés par Hub'Eau
  
  Erreurs fréquentes:
  - 500 Internal Server Error si trop de stations dans une requête
  - 400 Bad Request si URL trop longue
  - Troncature à 20k si requête annuelle globale
  
  Données:
  - Mise à jour trimestrielle depuis Naïades
  - ~200,000 observations par an
  - Période couverte: 20+ années

