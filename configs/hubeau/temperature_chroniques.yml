source:
  name: temperature
  max_table_nesting: 0
resource:
  name: temperature_chroniques
  endpoint: /chronique
  base_url: https://hubeau.eaufrance.fr/api/v1/temperature
  primary_key:
  - code_station
  - date_mesure_temp
  write_disposition: merge
  columns:
    code_station:
      data_type: text
      nullable: false
    libelle_station:
      data_type: text
      nullable: true
    uri_station:
      data_type: text
      nullable: true
    localisation:
      data_type: text
      nullable: true
    longitude:
      data_type: double
      nullable: true
    latitude:
      data_type: double
      nullable: true
    geometry:
      data_type: json
      nullable: true
    code_commune:
      data_type: text
      nullable: true
    libelle_commune:
      data_type: text
      nullable: true
    code_cours_eau:
      data_type: text
      nullable: true
    libelle_cours_eau:
      data_type: text
      nullable: true
    uri_cours_eau:
      data_type: text
      nullable: true
    code_parametre:
      data_type: text
      nullable: true
    libelle_parametre:
      data_type: text
      nullable: true
    date_mesure_temp:
      data_type: timestamp
      nullable: false
    heure_mesure_temp:
      data_type: time
      nullable: true
    resultat:
      data_type: double
      nullable: true
    code_unite:
      data_type: text
      nullable: true
