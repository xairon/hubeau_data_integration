resource:
  name: temperature_chroniques
  endpoint: /chronique.csv
  base_url: https://hubeau.eaufrance.fr/api/v1/temperature
  primary_key:
  - code_station
  - date_mesure_temp
  - heure_mesure_temp
extraction:
  default_params: {}
performance:
  parallelism: 5
  batch_size: 5000
  retry_times: 5
  retry_delay: 2.0
  rate_limit: 0.3
