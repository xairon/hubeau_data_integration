source:
  name: ecoulement
  max_table_nesting: 2
resource:
  name: ecoulement_observations
  endpoint: /observations
  base_url: https://hubeau.eaufrance.fr/api/v1/ecoulement
  primary_key:
  - code_station
  - date_observation
  write_disposition: merge
  columns:
    code_station:
      data_type: text
      nullable: false
    libelle_station:
      data_type: text
      nullable: true
    latitude:
      data_type: double
      nullable: true
    longitude:
      data_type: double
      nullable: true
    date_obs:
      data_type: timestamp
      nullable: false
    resultat:
      data_type: double
      nullable: true
    code_parametre:
      data_type: text
      nullable: true
extraction:
  slicing_mode: global
  pagination:
    type: page_based
  default_params:
    format: json
  records_path: $.data
performance:
  parallelism: 5
  chunk_size: 10000
  retry_times: 3
  retry_delay: 2.0
  rate_limit:
    target_rps: 5.0
    max_concurrency: 1
transformers:
- validate_primary_keys
- normalize_dates:
    fields:
    - date_obs
    - date_observation
destinations:
  postgres:
    dataset_name: bronze
    schema_name: ecoulement
    create_indexes: true
  filesystem:
    bucket_url: s3://bronze
    file_format: parquet
    layout: '{table_name}/year={YYYY}/data.parquet'
  duckdb:
    database: data/ecoulement.duckdb
