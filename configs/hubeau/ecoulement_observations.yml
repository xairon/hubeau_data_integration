name: ecoulement_observations
source: hubeau
dataset_name: hubeau
base_url: https://hubeau.eaufrance.fr/api/v1/ecoulement
path: /observations
method: GET
params_default:
  format: json
  size: 20000  # ✅ Optimisation: Pages de 20K records
records_path: $.data
primary_keys: [code_station, date_observation]
replication_key: date_observation
pagination:
  type: page
  page_param: page
  page_size_param: size
  page_size: 20000  # ✅ Optimisation: Pages de 20K records
  until_expr: "len($.data) == 0"
slicer:
  mode: datetime  # ✅ Mode datetime pour données temps réel (30 derniers jours)
  start_param: date_observation_min
  end_param: date_observation_max
  window_days: 1  # Fenêtre quotidienne (données temps réel)
  start_date: "{{ partition_date }}"  # Utilise la partition Dagster (ex: "2024-01-01")
  end_offset_days: 0  # Pas d'offset pour données temps réel
fallbacks:
  truncation_threshold: 20000  # ✅ Cohérent avec la taille de page (20K)
  split_chain: [dept_datetime]  # Si troncature → découpage par département×temps
rate_limit:
  target_rps: 1.5
  max_concurrency: 1
timeout: 60
comment: |
  API Écoulement des Cours d'Eau (ONDE - Observatoire National Des Étiages)
  - Observations d'écoulement saisonnières (généralement mai-octobre)
  - ~3,500 stations
  - ~15,000 observations par an
  - Basé sur des campagnes de terrain
  
  ⚠️ LOGIQUE SPÉCIALE: Les campagnes définissent les dates d'observation valides
  - Utiliser l'endpoint /campagnes pour récupérer les dates
  - Filtrer les observations par dates de campagnes
  - Éviter les requêtes hors période de campagne (peu de données)

