resource:
  name: ecoulement_observations_raw
  endpoint: /observations.csv
  base_url: https://hubeau.eaufrance.fr/api/v1/ecoulement
  # Bronze layer: no PK/FK constraints, duplicates allowed
  primary_key: null
extraction:
  default_params: {}
  # Date filter parameter names for this API
  date_filter_params:
    date_debut: date_observation_min  # Start date parameter name
    date_fin: date_observation_max    # End date parameter name
performance:
  parallelism: 1
  batch_size: 5000
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 0.3
