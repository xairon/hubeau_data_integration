resource:
  name: ecoulement_observations
  endpoint: /observations.csv
  base_url: https://hubeau.eaufrance.fr/api/v1/ecoulement
  primary_key:
  - code_station
  - date_observation
extraction:
  default_params: {}
performance:
  parallelism: 5
  chunk_size: 10000
  batch_size: 5000  # Réduit de 50k → 5k (SIGKILL OOM sur batch 2 @ 50k)
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 2.0
