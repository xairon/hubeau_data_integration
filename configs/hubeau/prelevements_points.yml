name: prelevements_points
source: hubeau
dataset_name: prelevements_api
file_format: parquet
layout: "{table_name}/{table_name}.parquet"
base_url: https://hubeau.eaufrance.fr/api/v1/prelevements
path: /referentiel/points_prelevement
method: GET
params_default:
  format: json
  size: 20000  # ✅ OPTIMISATION: Taille max pour contourner limite API 20K par département
records_path: $.data
primary_keys: [code_point_prelevement]
replication_key: date_maj_infos
pagination:
  type: page
  page_param: page
  page_size_param: size
  page_size: 20000  # ✅ Taille max pour récupérer 20K par page (limite API par département)
  until_expr: "len($.data) == 0"
slicer:
  mode: dept  # ✅ Récupération par département pour contourner limite pagination 20K
  param: code_departement
  reference:
    path: configs/hubeau/reference_departments.yml
    key: departments
rate_limit:
  target_rps: 5.0  # ✅ OPTIMISATION: Augmenté à 5.0 RPS (auto-adjust si 429) - gain 2.5x
  max_concurrency: 1
timeout: 60
comment: |
  API Prélèvements Hub'Eau - Référentiel des POINTS de prélèvement

  📊 Données de référence:
  - ~186,000 points de prélèvement (limite API pagination: 20K)
  - Un point = emplacement spécifique de mesure sur un ouvrage
  - Données de référence (pas de partition temporelle)
  - Mise à jour occasionnelle des informations de point

  🎯 Stratégie:
  - Mode dept: Récupération département par département
  - Contourne la limite de pagination de l'API (20K records max)
  - 102 départements × ~1,800 points/dept en moyenne

  ⚠️ DISTINCTION:
  - POINTS: ~186,000 points de mesure (ce fichier)
  - OUVRAGES: ~168,000 installations techniques (voir prelevements_ouvrages.yml)
  - Les chroniques utilisent code_ouvrage (pas code_point_prelevement)

  🎯 Utilisation:
  - Référentiel complet des points de prélèvement
  - Métadonnées détaillées par point de mesure
  - Relation: 1 ouvrage → N points de prélèvement

  📋 Champs clés:
  - code_point_prelevement: Identifiant unique du point
  - code_ouvrage: Identifiant de l'ouvrage parent
  - code_departement: Code département
  - nom_point: Nom du point de prélèvement
  - coordonnees: Coordonnées géographiques
