source:
  name: piezometry
  max_table_nesting: 2
resource:
  name: piezometry_chroniques
  endpoint: /chroniques_tr
  base_url: https://hubeau.eaufrance.fr/api/v1/niveaux_nappes
  primary_key:
  - code_bss
  - timestamp_mesure
  write_disposition: merge
  columns:
    code_station:
      data_type: text
      nullable: false
    libelle_station:
      data_type: text
      nullable: true
    latitude:
      data_type: double
      nullable: true
    longitude:
      data_type: double
      nullable: true
    date_obs:
      data_type: timestamp
      nullable: false
    resultat:
      data_type: double
      nullable: true
    code_parametre:
      data_type: text
      nullable: true
extraction:
  slicing_mode: station_month_chunked
  station_param: code_bss
  station_chunk_size: 20
  start_param: date_debut_mesure
  end_param: date_fin_mesure
  pagination:
    type: page_based
    page_size: 20000
    max_pages: null
  default_params:
    format: json
  records_path: $.data
temporal_filter:
  date_field: timestamp_mesure
  start_param: date_debut_mesure
  end_param: date_fin_mesure
  start_date: "2020-01-01"
  end_offset_days: 0
performance:
  parallelism: 5
  chunk_size: 10000
  retry_times: 3
  retry_delay: 2.0
  rate_limit:
    target_rps: 5.0
    max_concurrency: 1
transformers:
- validate_primary_keys
- normalize_dates:
    fields:
    - date_obs
    - date_debut
    - date_fin
destinations:
  filesystem:
    bucket_url: s3://bronze
    file_format: parquet
    layout: '{table_name}/year={YYYY}/{load_id}.parquet'
