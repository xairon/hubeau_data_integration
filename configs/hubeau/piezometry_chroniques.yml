resource:
  name: piezometry_chroniques
  endpoint: /chroniques.csv
  base_url: https://hubeau.eaufrance.fr/api/v1/niveaux_nappes
  primary_key:
  - code_bss
  - date_mesure
extraction:
  default_params:
    size: 5000
    date_debut_mesure: "2020-01-01"
performance:
  parallelism: 5
  batch_size: 5000
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 0.3
