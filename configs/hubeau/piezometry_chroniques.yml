source:
  name: piezometry
  max_table_nesting: 2
resource:
  name: piezometry_chroniques
  endpoint: /chroniques_tr.csv
  base_url: https://hubeau.eaufrance.fr/api/v1/niveaux_nappes
  primary_key: [code_bss, timestamp_mesure]
  write_disposition: append
  columns:
    # Identifiants (3 attributs)
    code_bss:
      data_type: text
      nullable: false
    bss_id:
      data_type: text
      nullable: true
    urn_bss:
      data_type: text
      nullable: true

    # Temporel (3 attributs)
    date_mesure:
      data_type: date
      nullable: true
    timestamp_mesure:
      data_type: timestamp
      nullable: false
    date_maj:
      data_type: timestamp
      nullable: true

    # Localisation (2 attributs)
    longitude:
      data_type: double
      nullable: true
    latitude:
      data_type: double
      nullable: true

    # Niveaux (3 attributs)
    altitude_station:
      data_type: double
      nullable: true
    altitude_repere:
      data_type: double
      nullable: true
    niveau_eau_ngf:
      data_type: double
      nullable: true
    profondeur_nappe:
      data_type: double
      nullable: true

extraction:
  slicing_mode: station_month_chunked
  pagination:
    type: page_based
  default_params: {}
performance:
  parallelism: 5
  chunk_size: 10000
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 2.0
transformers:
- validate_primary_keys
- normalize_dates:
    fields:
    - date_mesure
    - timestamp_mesure
    - date_maj
- validate_coordinates:
    lat_field: latitude
    lon_field: longitude
destinations:
  postgres:
    dataset_name: hubeau
