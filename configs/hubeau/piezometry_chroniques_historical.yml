source:
  name: piezometry
  max_table_nesting: 0
resource:
  name: piezometry_chroniques_historical
  endpoint: /chroniques
  base_url: https://hubeau.eaufrance.fr/api/v1/niveaux_nappes
  primary_key:
  - code_bss
  - timestamp_mesure
  write_disposition: merge
  columns:
    code_bss:
      data_type: text
      nullable: false
    bss_id:
      data_type: text
      nullable: true
    urn_bss:
      data_type: text
      nullable: true
    date_mesure:
      data_type: date
      nullable: true
    timestamp_mesure:
      data_type: timestamp
      nullable: false
    date_maj:
      data_type: timestamp
      nullable: true
    longitude:
      data_type: double
      nullable: true
    latitude:
      data_type: double
      nullable: true
    altitude_station:
      data_type: double
      nullable: true
    altitude_repere:
      data_type: double
      nullable: true
    niveau_eau_ngf:
      data_type: double
      nullable: true
    niveau_eau_relative:
      data_type: double
      nullable: true
    profondeur_nappe:
      data_type: double
      nullable: true
    niveau_eau_indicateur:
      data_type: double
      nullable: true
    qualification:
      data_type: text
      nullable: true
    statut:
      data_type: text
      nullable: true
    mode_obtention:
      data_type: text
      nullable: true
    continuite:
      data_type: text
      nullable: true
    producteur:
      data_type: text
      nullable: true
