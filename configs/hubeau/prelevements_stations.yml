name: prelevements_stations
source: hubeau
dataset_name: prelevements_api
file_format: parquet
layout: "{table_name}/{table_name}.parquet"
base_url: https://hubeau.eaufrance.fr/api/v1/prelevements
path: /referentiel/ouvrages  # ⚠️ Utiliser /ouvrages au lieu de /points_prelevement (chroniques = ouvrages)
method: GET
params_default:
  format: json
  size: 5000  # ✅ OPTIMISATION: Augmenté de 1000 à 5000 - gain 3-5x
records_path: $.data
primary_keys: [code_ouvrage]  # ⚠️ code_ouvrage au lieu de code_point_prelevement
replication_key: date_maj_infos
pagination:
  type: page
  page_param: page
  page_size_param: size
  page_size: 5000
  until_expr: "len($.data) == 0"
slicer:
  mode: dept  # ✅ Récupération par département pour contourner limite pagination 20K
  param: code_departement
  reference:
    path: configs/hubeau/reference_departments.yml
    key: departments
rate_limit:
  target_rps: 5.0  # ✅ OPTIMISATION: Augmenté à 5.0 RPS (auto-adjust si 429) - gain 2.5x
  max_concurrency: 1
timeout: 60
comment: |
  API Prélèvements Hub'Eau - Référentiel des ouvrages de prélèvement

  📊 Données de référence:
  - >20,000 ouvrages de prélèvement (limite API pagination: 20K)
  - Un ouvrage = ensemble de points de prélèvement + infrastructure
  - Données de référence (pas de partition temporelle)
  - Mise à jour occasionnelle des informations d'ouvrage

  🎯 Stratégie:
  - Mode dept: Récupération département par département
  - Contourne la limite de pagination de l'API (20K records max)
  - 102 départements × ~200 ouvrages/dept en moyenne

  🎯 Utilisation:
  - Référentiel pour les chroniques de prélèvement (attachées aux ouvrages)
  - Filtrage des ouvrages actifs pour les chroniques
  - Informations géographiques et techniques des ouvrages

  ⚠️ IMPORTANT:
  - Les chroniques de prélèvement sont rattachées aux OUVRAGES (code_ouvrage)
  - PAS aux points de prélèvement individuels (code_point_prelevement)
  - Un ouvrage peut avoir plusieurs points de prélèvement
