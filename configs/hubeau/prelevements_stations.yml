name: prelevements_stations
source: hubeau
dataset_name: prelevements_api
base_url: https://hubeau.eaufrance.fr/api/v1/prelevements
path: /points_prelevement
method: GET
params_default:
  format: json
  size: 5000
records_path: $.data
primary_keys: [code_point_prelevement]
replication_key: date_maj_infos
pagination:
  type: page
  page_param: page
  page_size_param: size
  page_size: 5000
  until_expr: "len($.data) == 0"
slicer:
  mode: global  # Pas de filtrage nécessaire - récupération globale
rate_limit:
  target_rps: 2.0
  max_concurrency: 1
timeout: 60
comment: |
  API Prélèvements Hub'Eau - Référentiel des points de prélèvement
  
  📊 Données de référence:
  - ~80,000 points de prélèvement
  - Données de référence (pas de partition temporelle)
  - Mise à jour occasionnelle des informations de station
  
  🎯 Utilisation:
  - Référentiel pour les chroniques de prélèvement
  - Filtrage des points actifs pour les chroniques
  - Informations géographiques et techniques des points
