name: quality_groundwater_stations
source: hubeau
dataset_name: quality_groundwater_api
file_format: parquet
layout: "{table_name}.parquet"
base_url: https://hubeau.eaufrance.fr/api/v1/qualite_nappes
path: /stations
method: GET
params_default:
  format: json
  size: 5000  # ✅ OPTIMISATION: Augmenté de 1000 à 5000 - gain 3-5x
records_path: $.data
primary_keys: [code_bss]
replication_key: date_maj_infos
pagination:
  type: page
  page_param: page
  page_size_param: size
  page_size: 5000
  until_expr: "len($.data) == 0"
slicer:
  mode: dept  # ✅ Récupération par département pour contourner limite pagination 20K
  param: num_departement
  reference:
    path: configs/hubeau/reference_departments.yml
    key: departments
rate_limit:
  target_rps: 5.0  # ✅ OPTIMISATION: Augmenté à 5.0 RPS (auto-adjust si 429) - gain 2.5x
  max_concurrency: 1
timeout: 60
comment: |
  API Qualité Nappes Hub'Eau - Référentiel des stations de surveillance
  
  📊 Données de référence:
  - >20,000 stations de surveillance (BSS) (limite API pagination: 20K)
  - Données de référence (pas de partition temporelle)
  - Mise à jour occasionnelle des informations de station
  
  🎯 Stratégie:
  - Mode dept: Récupération département par département
  - Contourne la limite de pagination de l'API (20K records max)
  - 102 départements × ~200 stations/dept en moyenne
  
  🎯 Utilisation:
  - Référentiel pour les analyses physico-chimiques des nappes
  - Filtrage des stations actives pour les analyses
  - Informations géographiques et techniques des stations