source:
  name: quality_groundwater
  max_table_nesting: 0
resource:
  name: quality_groundwater_stations
  endpoint: /stations.csv
  base_url: https://hubeau.eaufrance.fr/api/v1/qualite_nappes
  primary_key:
  - code_bss
  write_disposition: merge
  columns:
    code_bss:
      data_type: text
      nullable: false
    bss_id:
      data_type: text
      nullable: true
    urn_bss:
      data_type: text
      nullable: true
    longitude:
      data_type: double
      nullable: true
    latitude:
      data_type: double
      nullable: true
    altitude:
      data_type: double
      nullable: true
    precision_coordonnees:
      data_type: text
      nullable: true
    geometry:
      data_type: json
      nullable: true
    code_insee:
      data_type: text
      nullable: true
    nom_commune:
      data_type: text
      nullable: true
    num_departement:
      data_type: text
      nullable: true
    nom_departement:
      data_type: text
      nullable: true
    nom_region:
      data_type: text
      nullable: true
    circonscriptions_administrative_bassin:
      data_type: json
      nullable: true
    bassin_dce:
      data_type: text
      nullable: true
    code_bassin_dce:
      data_type: text
      nullable: true
    urn_bassin_dce:
      data_type: text
      nullable: true
    code_nature_pe:
      data_type: integer
      nullable: true
    nom_nature_pe:
      data_type: text
      nullable: true
    uri_nature_pe:
      data_type: text
      nullable: true
    libelle_pe:
      data_type: text
      nullable: true
    code_etat_pe:
      data_type: text
      nullable: true
    nom_etat_pe:
      data_type: text
      nullable: true
    uri_etat_pe:
      data_type: text
      nullable: true
    commentaire_pe:
      data_type: text
      nullable: true
    code_caracteristique_aquifere:
      data_type: text
      nullable: true
    nom_caracteristique_aquifere:
      data_type: text
      nullable: true
    uri_caracteristique_aquifere:
      data_type: text
      nullable: true
    code_mode_gisement:
      data_type: integer
      nullable: true
    nom_mode_gisement:
      data_type: text
      nullable: true
    uri_mode_gisement:
      data_type: text
      nullable: true
    profondeur_investigation:
      data_type: double
      nullable: true

    # Entités hydrogéologiques BDLISA
    codes_entite_hg_bdlisa:
      data_type: text
      nullable: true
    noms_entite_hg_bdlisa:
      data_type: text
      nullable: true
    urns_bdlisa:
      data_type: json
      nullable: true

    # Masses d'eau - Rapportage (RAP)
    codes_masse_eau_rap:
      data_type: text
      nullable: true
    noms_masse_eau_rap:
      data_type: text
      nullable: true
    urns_masse_eau_rap:
      data_type: json
      nullable: true

    # Masses d'eau - État des lieux (EDL)
    codes_masse_eau_edl:
      data_type: text
      nullable: true
    noms_masse_eau_edl:
      data_type: text
      nullable: true
    urns_masse_eau_edl:
      data_type: json
      nullable: true

    # Réseaux de surveillance
    codes_reseau:
      data_type: json
      nullable: true
    noms_reseau:
      data_type: json
      nullable: true
    uris_reseau:
      data_type: json
      nullable: true
    date_debut_mesure:
      data_type: date
      nullable: true
    date_fin_mesure:
      data_type: date
      nullable: true
