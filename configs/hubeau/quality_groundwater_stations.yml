performance:
  parallelism: 5
  chunk_size: 10000
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 2.0
transformers:
- validate_primary_keys
- normalize_dates:
    fields:
    - date_debut_mesure
    - date_fin_mesure
- validate_coordinates:
    lat_field: latitude
    lon_field: longitude
- handle_geometry_field:
    geometry_field: geometry
    lat_field: latitude
    lon_field: longitude
- handle_jsonb_arrays:
    fields:
    - circonscriptions_administrative_bassin
    - urns_bdlisa
    - urns_masse_eau_rap
    - urns_masse_eau_edl
    - codes_reseau
    - noms_reseau
    - uris_reseau
destinations:
  postgres:
    dataset_name: hubeau
