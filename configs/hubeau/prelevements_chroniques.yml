source:
  name: prelevements
  max_table_nesting: 2
resource:
  name: prelevements_chroniques
  endpoint: /chroniques
  base_url: https://hubeau.eaufrance.fr/api/v1/prelevements
  primary_key:
  - code_ouvrage
  - annee
  - code_usage
  write_disposition: merge
  columns:
    code_station:
      data_type: text
      nullable: false
    libelle_station:
      data_type: text
      nullable: true
    latitude:
      data_type: double
      nullable: true
    longitude:
      data_type: double
      nullable: true
    date_obs:
      data_type: timestamp
      nullable: false
    resultat:
      data_type: double
      nullable: true
    code_parametre:
      data_type: text
      nullable: true
extraction:
  slicing_mode: datetime
  start_param: annee
  end_param: annee
  pagination:
    type: page_based
    page_size: 20000
    max_pages: null
  default_params:
    format: json
  records_path: $.data
performance:
  parallelism: 5
  chunk_size: 10000
  retry_times: 3
  retry_delay: 2.0
  rate_limit:
    target_rps: 5.0
    max_concurrency: 1
transformers:
- validate_primary_keys
- normalize_dates:
    fields:
    - date_obs
    - date_debut
    - date_fin
destinations:
  postgres:
    dataset_name: bronze
    schema_name: prelevements
    create_indexes: true
  filesystem:
    bucket_url: s3://hubeau-bronze
    file_format: parquet
    layout: '{table_name}/year={year}/{load_id}.parquet'
  duckdb:
    database: data/prelevements.duckdb
