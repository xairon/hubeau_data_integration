resource:
  name: prelevements_chroniques_raw
  endpoint: /chroniques.csv
  base_url: https://hubeau.eaufrance.fr/api/v1/prelevements
  # Bronze layer: no PK/FK constraints, duplicates allowed
  primary_key: null
extraction:
  default_params: {}
  # Date filter parameter names for this API
  # NOTE: prelevements uses 'annee' (single year integer), not a date range
  date_filter_params:
    date_debut: annee  # Year parameter (e.g., annee=2020)
    date_fin: null     # No end date parameter for this API
performance:
  parallelism: 1
  batch_size: 5000
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 0.3
