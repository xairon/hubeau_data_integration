source:
  name: prelevements
  max_table_nesting: 0
resource:
  name: prelevements_chroniques
  endpoint: /chroniques
  base_url: https://hubeau.eaufrance.fr/api/v1/prelevements
  primary_key:
  - code_ouvrage
  - annee
  - code_usage
  write_disposition: merge
  columns:
    code_ouvrage:
      data_type: text
      nullable: false
    nom_ouvrage:
      data_type: text
      nullable: true
    uri_ouvrage:
      data_type: text
      nullable: true
    annee:
      data_type: integer
      nullable: false
    code_usage:
      data_type: text
      nullable: false
    libelle_usage:
      data_type: text
      nullable: true
    volume:
      data_type: double
      nullable: true
    code_statut_volume:
      data_type: text
      nullable: true
    libelle_statut_volume:
      data_type: text
      nullable: true
    code_qualification_volume:
      data_type: text
      nullable: true
    libelle_qualification_volume:
      data_type: text
      nullable: true
    code_statut_instruction:
      data_type: text
      nullable: true
    libelle_statut_instruction:
      data_type: text
      nullable: true
    code_mode_obtention_volume:
      data_type: text
      nullable: true
    libelle_mode_obtention_volume:
      data_type: text
      nullable: true
    prelevement_ecrasant:
      data_type: boolean
      nullable: true
    producteur_donnee:
      data_type: text
      nullable: true
    longitude:
      data_type: double
      nullable: true
    latitude:
      data_type: double
      nullable: true
    geometry:
      data_type: json
      nullable: true
    code_commune_insee:
      data_type: text
      nullable: true
    nom_commune:
      data_type: text
      nullable: true
    code_departement:
      data_type: text
      nullable: true
    libelle_departement:
      data_type: text
      nullable: true
extraction:
  slicing_mode: year
  year_param: annee
  start_year: 2012
  end_year: 2024
  pagination:
    type: page_based
  default_params: {}
# Fix: Disable incremental loading - this endpoint doesn't have date_mesure field
# Data is sliced by year (annee) and uses merge disposition instead
temporal_filter:
  date_field: annee  # Use year field instead of default date_mesure
  start_date: '2012'  # Not actually used with year slicing
performance:
  parallelism: 5
  chunk_size: 10000
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 2.0
transformers:
- validate_primary_keys
- validate_coordinates:
    lat_field: latitude
    lon_field: longitude
- handle_geometry_field:
    geometry_field: geometry
    lat_field: latitude
    lon_field: longitude
destinations:
  postgres:
    dataset_name: hubeau
