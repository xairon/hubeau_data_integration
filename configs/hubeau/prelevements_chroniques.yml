# ✅ Filtre temporel optimisé pour chaque département
temporal_filter:
  start_param: annee_min
  end_param: annee_max
  start_date: "{{ partition_date }}"  # Utilise la partition Dagster (année)
  end_offset_days: 0  # ✅ Pas d'offset pour éviter les fenêtres supplémentaires
fallbacks:
  truncation_threshold: 20000  # ✅ Cohérent avec la taille de page (20K)
  split_chain: [day]  # Si troncature → découper par jour
rate_limit:
  target_rps: 1.0  # Rate limit respectueux (API sensible)
  max_concurrency: 1
timeout: 60
comment: |
  API Prélèvements en Eau - Chroniques de prélèvement
  - ⚠️ LIMITE CRITIQUE: 20,000 records par requête !
  - Erreurs 400 Bad Request si limite dépassée
  - Chunking obligatoire: 1 département à la fois
  - Erreurs 500 fréquentes → max_retries élevé
  
  ~80,000 ouvrages, ~500,000 chroniques/an
  Filtrage temporel par année (annee_min/annee_max)

