name: prelevements_chroniques
source: hubeau
dataset_name: hubeau
base_url: https://hubeau.eaufrance.fr/api/v1/prelevements
path: /chroniques
method: GET
params_default:
  format: json
  size: 20000  # ✅ Optimisation: Pages de 20K records
records_path: $.data
primary_keys: [code_ouvrage, annee, mois]
replication_key: annee
pagination:
  type: page
  page_param: page
  page_size_param: size
  page_size: 20000  # ✅ Optimisation: Pages de 20K records
  until_expr: "len($.data) == 0"
