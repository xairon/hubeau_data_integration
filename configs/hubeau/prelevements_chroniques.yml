resource:
  name: prelevements_chroniques
  endpoint: /chroniques.csv
  base_url: https://hubeau.eaufrance.fr/api/v1/prelevements
  primary_key:
  - code_ouvrage
  - annee
  - code_usage
extraction:
  default_params: {}
performance:
  parallelism: 5
  chunk_size: 10000
  batch_size: 30000  # Optimisé avec micro-batching (3.75x augmentation - safe)
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 2.0
