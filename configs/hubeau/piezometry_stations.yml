source:
  name: piezometry
  max_table_nesting: 2
resource:
  name: piezometry_stations
  endpoint: /stations
  base_url: https://hubeau.eaufrance.fr/api/v1/niveaux_nappes
  primary_key: ["code_station"]
  write_disposition: replace
  columns:
    code_station:
      data_type: text
      nullable: false
    libelle_station:
      data_type: text
      nullable: true
    latitude:
      data_type: double
      nullable: true
    longitude:
      data_type: double
      nullable: true
