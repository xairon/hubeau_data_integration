  pagination:
    type: page_based
    page_size: 5000  # Safe pour API Hub'Eau (limite 20k records par requête)
    max_pages: null
  default_params:
    format: json
  records_path: $.data
performance:
  parallelism: 5
  chunk_size: 10000
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 2.0
transformers:
- validate_primary_keys
- normalize_dates:
    fields:
    - date_ouverture
    - date_fermeture
    - date_maj
- validate_coordinates:
    lat_field: latitude
    lon_field: longitude
destinations:
  postgres:
    dataset_name: bronze
    schema_name: piezometry
    create_indexes: true
  filesystem:
    bucket_url: s3://hubeau-bronze
    file_format: parquet
    layout: '{table_name}/year={year}/{load_id}.parquet'
  duckdb:
    database: data/piezometry.duckdb
