source:
  name: piezometry
  max_table_nesting: 2
resource:
  name: piezometry_stations
  endpoint: /stations
  base_url: https://hubeau.eaufrance.fr/api/v1/niveaux_nappes
  primary_key: [code_bss]
  write_disposition: merge
  columns:
    # Identifiants (3 attributs)
    code_bss:
      data_type: text
      nullable: false
    bss_id:
      data_type: text
      nullable: true
    urn_bss:
      data_type: text
      nullable: true

    # Localisation (5 attributs)
    x:
      data_type: double
      nullable: true
    y:
      data_type: double
      nullable: true
    longitude:
      data_type: double
      nullable: true
    latitude:
      data_type: double
      nullable: true
    geometry:
      data_type: json
      nullable: true

    # Administratif (4 attributs)
    code_commune_insee:
      data_type: text
      nullable: true
    nom_commune:
      data_type: text
      nullable: true
    code_departement:
      data_type: text
      nullable: true
    nom_departement:
      data_type: text
      nullable: true

    # Caractéristiques (2 attributs)
    altitude_station:
      data_type: double
      nullable: true
    profondeur_investigation:
      data_type: double
      nullable: true
    libelle_pe:
      data_type: text
      nullable: true

    # Temporel (3 attributs)
    date_debut_mesure:
      data_type: date
      nullable: true
    date_fin_mesure:
      data_type: date
      nullable: true
    nb_mesures_piezo:
      data_type: integer
      nullable: true
    date_maj:
      data_type: timestamp
      nullable: true

    # Géologie BDLISA (3 attributs)
    codes_bdlisa:
      data_type: json
      nullable: true
    urns_bdlisa:
      data_type: json
      nullable: true

    # Masses d'Eau (3 attributs)
    codes_masse_eau_edl:
      data_type: json
      nullable: true
    noms_masse_eau_edl:
      data_type: json
      nullable: true
    urns_masse_eau_edl:
      data_type: json
      nullable: true

extraction:
  slicing_mode: global
  pagination:
    type: page_based
  default_params: {}
performance:
  parallelism: 5
  chunk_size: 10000
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 2.0
transformers:
- validate_primary_keys
- normalize_dates:
    fields:
    - date_debut_mesure
    - date_fin_mesure
    - date_maj
- validate_coordinates:
    lat_field: latitude
    lon_field: longitude
destinations:
  postgres:
    dataset_name: hubeau
