resource:
  name: quality_rivers_stations
  endpoint: /station_pc.csv
  base_url: https://hubeau.eaufrance.fr/api/v2/qualite_rivieres
  primary_key:
  - code_station
extraction:
  default_params: {}
performance:
  parallelism: 5
  chunk_size: 10000
  batch_size: 15000  # Réduit pour améliorer stabilité et performance
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 2.0
