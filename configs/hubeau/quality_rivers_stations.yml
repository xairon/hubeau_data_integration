name: quality_rivers_stations
source: hubeau
dataset_name: quality_rivers_api
file_format: parquet
layout: "{table_name}/{load_id}.{file_id}.parquet"
base_url: https://hubeau.eaufrance.fr/api/v2/qualite_rivieres
path: /station_pc
method: GET
params_default:
  format: json
  size: 5000
records_path: $.data
primary_keys: [code_station]
replication_key: date_maj_infos
pagination:
  type: page
  page_param: page
  page_size_param: size
  page_size: 5000
  until_expr: "len($.data) == 0"
slicer:
  mode: dept  # ✅ Récupération par département pour contourner limite pagination 20K
  param: code_departement
  reference:
    path: configs/hubeau/reference_departments.yml
    key: departments
rate_limit:
  target_rps: 5.0  # ✅ OPTIMISATION: Augmenté à 5.0 RPS (auto-adjust si 429) - gain 2.5x
  max_concurrency: 1
timeout: 60
comment: |
  API Qualité Cours d'Eau Hub'Eau - Référentiel des stations de prélèvement

  📊 Données de référence:
  - >20,000 stations de prélèvement (limite API pagination: 20K)
  - Données de référence (pas de partition temporelle)
  - Mise à jour occasionnelle des informations de station

  🎯 Stratégie:
  - Mode dept: Récupération département par département
  - Contourne la limite de pagination de l'API (20K records max)
  - 102 départements × ~200 stations/dept en moyenne

  🎯 Utilisation:
  - Référentiel pour les analyses physico-chimiques
  - Filtrage des stations actives pour les analyses
  - Informations géographiques et techniques des stations
