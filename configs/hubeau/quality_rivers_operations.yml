source:
  name: quality_rivers
  max_table_nesting: 0
resource:
  name: quality_rivers_operations
  endpoint: /operation_pc.csv
  base_url: https://hubeau.eaufrance.fr/api/v2/qualite_rivieres
  primary_key:
  - code_station
  - date_prelevement
  - code_operation
  write_disposition: merge
  columns:
    code_station:
      data_type: text
      nullable: false
    libelle_station:
      data_type: text
      nullable: true
    uri_station:
      data_type: text
      nullable: true
    code_operation:
      data_type: text
      nullable: false
    code_prelevement:
      data_type: text
      nullable: true
    code_point_eau_surface:
      data_type: text
      nullable: true
    code_banque_reference:
      data_type: text
      nullable: true
    longitude:
      data_type: double
      nullable: true
    latitude:
      data_type: double
      nullable: true
    x_prelevement:
      data_type: double
      nullable: true
    y_prelevement:
      data_type: double
      nullable: true
    code_projection:
      data_type: text
      nullable: true
    libelle_projection:
      data_type: text
      nullable: true
    geometry:
      data_type: json
      nullable: true
    date_prelevement:
      data_type: date
      nullable: false
    heure_prelevement:
      data_type: time
      nullable: true
    date_fin:
      data_type: date
      nullable: true
    heure_fin:
      data_type: time
      nullable: true
    code_support:
      data_type: text
      nullable: true
    libelle_support:
      data_type: text
      nullable: true
    uri_support:
      data_type: text
      nullable: true
    code_methode:
      data_type: text
      nullable: true
    nom_methode:
      data_type: text
      nullable: true
    uri_methode:
      data_type: text
      nullable: true
    code_zone_verticale_prospectee:
      data_type: text
      nullable: true
    mnemo_zone_verticale_prospectee:
      data_type: text
      nullable: true
    profondeur:
      data_type: double
      nullable: true
    code_difficulte:
      data_type: text
      nullable: true
    mnemo_difficulte:
      data_type: text
      nullable: true
    code_accreditation:
      data_type: text
      nullable: true
    mnemo_accreditation:
      data_type: text
      nullable: true
    agrement:
      data_type: text
      nullable: true
    code_finalite:
      data_type: text
      nullable: true
    libelle_finalite:
      data_type: text
      nullable: true
    code_reseau:
      data_type: text
      nullable: true
    nom_reseau:
      data_type: text
      nullable: true
    uri_reseau:
      data_type: text
      nullable: true
    code_producteur:
      data_type: text
      nullable: true
    nom_producteur:
      data_type: text
      nullable: true
    uri_producteur:
      data_type: text
      nullable: true
    code_preleveur:
      data_type: text
      nullable: true
    nom_preleveur:
      data_type: text
      nullable: true
    uri_preleveur:
      data_type: text
      nullable: true
    commentaires:
      data_type: text
      nullable: true
extraction:
  slicing_mode: station_month_chunked
  slicing_params:
    date_field: date_prelevement
    station_field: code_station
    stations_per_chunk: 20
  pagination:
    type: page_based
  default_params: {}
performance:
  parallelism: 3
  chunk_size: 5000
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 2.0
transformers:
- validate_primary_keys
- normalize_dates:
    fields:
    - date_prelevement
    - date_fin
- validate_coordinates:
    lat_field: latitude
    lon_field: longitude
- handle_geometry_field:
    geometry_field: geometry
    lat_field: latitude
    lon_field: longitude
destinations:
  postgres:
    dataset_name: hubeau
