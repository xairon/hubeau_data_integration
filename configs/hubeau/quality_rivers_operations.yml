source:
  name: quality
  max_table_nesting: 2
resource:
  name: quality_rivers_operations
  endpoint: /operation_pc
  base_url: https://hubeau.eaufrance.fr/api/v2/qualite_rivieres
  primary_key: []
  write_disposition: merge
  columns:
    code_operation:
      data_type: text
      nullable: false
    date_operation:
      data_type: timestamp
      nullable: true
    code_station:
      data_type: text
      nullable: true
extraction:
  slicing_mode: global
  pagination:
    type: page_based
    page_size: 5000
    max_pages: null
  default_params:
    format: json
  records_path: $.data
performance:
  parallelism: 5
  chunk_size: 10000
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 2.0
transformers:
- validate_primary_keys
- normalize_dates:
    fields:
    - date_operation
    - date_debut
    - date_fin
destinations:
  postgres:
    dataset_name: bronze
    schema_name: quality
    create_indexes: true
  filesystem:
    bucket_url: s3://hubeau-bronze
    file_format: parquet
    layout: '{table_name}/year={year}/{load_id}.parquet'
  duckdb:
    database: data/quality.duckdb
