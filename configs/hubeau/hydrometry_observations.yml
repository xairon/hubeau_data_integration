name: hydrometry_observations
source: hubeau
dataset_name: hydrometry_api
file_format: parquet
layout: "{table_name}/{load_id}.{file_id}.parquet"
base_url: https://hubeau.eaufrance.fr/api/v2/hydrometrie
path: /observations_tr
method: GET
params_default:
  format: json
  size: 20000  # ✅ Optimisation: Pages de 20K records
records_path: $.data
primary_keys: [code_station, date_obs, grandeur_hydro]
# replication_key: date_obs  # ✅ OPTIMISATION: Commenté pour mode APPEND (partitions quotidiennes) - gain 3-5x
pagination:
  type: cursor
  cursor_param: cursor
  cursor_path: $.next
  page_size_param: size
  page_size: 20000  # ✅ Optimisation: Pages de 20K records
  until_expr: "len($.data) == 0"
slicer:
  mode: datetime  # ✅ Mode datetime pour données temps réel (30 derniers jours)
  start_param: date_debut_obs
  end_param: date_fin_obs
  window_days: 1  # Fenêtre quotidienne (données temps réel)
  start_date: "{{ partition_date }}"  # Utilise la partition Dagster (ex: "2024-01-01")
  end_offset_days: 0  # Pas d'offset pour données temps réel
fallbacks:
  truncation_threshold: 20000  # ✅ Cohérent avec la taille de page (20K)
  split_chain: [dept_datetime]  # Si troncature → découpage par département×temps
rate_limit:
  target_rps: 5.0  # ✅ OPTIMISATION: Augmenté à 5.0 RPS (auto-adjust si 429) - gain 2.5x
  max_concurrency: 1
timeout: 60
comment: |
  API Hydrométrie Hub'Eau v2 - Observations temps réel
  
  ⚠️ RESTRICTION CRITIQUE API v2 : Accès limité aux 30 derniers jours UNIQUEMENT
  - Erreur 400 si date_debut_obs < 30 jours
  - Pas d'accès à l'historique ancien
  - Utiliser obs_elab pour données élaborées (même restriction)
  
  📊 Données disponibles:
  - Débits, hauteurs d'eau, niveaux
  - Fréquence: 15min à 1h selon la station
  - Volume: ~50,000 observations/jour
  
  🎯 Stratégie optimale:
  - Mode dept: Chunking par département (5 départements par requête)
  - Pas de partition temporelle (données temps réel uniquement)
  - Utilisation des stations de référence pour filtrage
  
  📋 Champs clés:
  - code_station: Identifiant de la station
  - date_obs: Date/heure d'observation
  - grandeur_hydro: Type de grandeur (Q, H, N)
  - resultat_obs: Valeur observée
  - code_qualification: Qualité de la mesure
  
  🔗 Documentation: https://hubeau.eaufrance.fr/page/api-hydrometrie
