source:
  name: quality
  max_table_nesting: 2
resource:
  name: quality_rivers_conditions
  endpoint: /condition_environnementale_pc
  base_url: https://hubeau.eaufrance.fr/api/v2/qualite_rivieres
  primary_key:
  - code_station
  - date_operation
  - code_parametre_env
  write_disposition: merge
  columns:
    id:
      data_type: text
      nullable: true
extraction:
  slicing_mode: station_month_chunked
  station_param: code_station
  station_chunk_size: 50
  start_param: date_debut_operation
  end_param: date_fin_operation
  pagination:
    type: page_based
    page_size: 20000
    max_pages: null
  default_params:
    format: json
  records_path: $.data
performance:
  parallelism: 5
  chunk_size: 10000
  retry_times: 3
  retry_delay: 2.0
  rate_limit:
    target_rps: 5.0
    max_concurrency: 1
transformers:
- validate_primary_keys
- normalize_dates:
    fields:
    - date_observation
destinations:
  postgres:
    dataset_name: bronze
    schema_name: quality
    create_indexes: true
  filesystem:
    bucket_url: s3://hubeau-bronze
    file_format: parquet
    layout: '{table_name}/year={year}/{load_id}.parquet'
  duckdb:
    database: data/quality.duckdb
