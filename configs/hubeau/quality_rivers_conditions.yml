source:
  name: quality_rivers
  max_table_nesting: 0
resource:
  name: quality_rivers_conditions
  endpoint: /condition_environnementale_pc.csv
  base_url: https://hubeau.eaufrance.fr/api/v2/qualite_rivieres
  primary_key:
  - code_station
  - date_prelevement
  - code_parametre
  write_disposition: merge
  columns:
    code_station:
      data_type: text
      nullable: false
    libelle_station:
      data_type: text
      nullable: true
    uri_station:
      data_type: text
      nullable: true
    code_prelevement:
      data_type: text
      nullable: true
    code_operation_cep:
      data_type: text
      nullable: true
    code_banque_reference:
      data_type: text
      nullable: true
    code_point_eau_surface:
      data_type: text
      nullable: true
    code_parametre:
      data_type: text
      nullable: false
    libelle_parametre:
      data_type: text
      nullable: true
    uri_parametre:
      data_type: text
      nullable: true
    code_groupe_parametre:
      data_type: json
      nullable: true
    libelle_groupe_parametre:
      data_type: json
      nullable: true
    uri_groupe_parametre:
      data_type: json
      nullable: true
    resultat:
      data_type: double
      nullable: true
    libelle_resultat:
      data_type: text
      nullable: true
    code_unite:
      data_type: text
      nullable: true
    symbole_unite:
      data_type: text
      nullable: true
    uri_unite:
      data_type: text
      nullable: true
    date_prelevement:
      data_type: date
      nullable: false
    date_mesure:
      data_type: date
      nullable: true
    heure_mesure:
      data_type: time
      nullable: true
    date_maj:
      data_type: timestamp
      nullable: true
    code_qualification:
      data_type: text
      nullable: true
    libelle_qualification:
      data_type: text
      nullable: true
    code_statut:
      data_type: text
      nullable: true
    mnemo_statut:
      data_type: text
      nullable: true
    code_remarque:
      data_type: text
      nullable: true
    mnemo_remarque:
      data_type: text
      nullable: true
    code_methode:
      data_type: text
      nullable: true
    nom_methode:
      data_type: text
      nullable: true
    uri_methode:
      data_type: text
      nullable: true
    code_producteur:
      data_type: text
      nullable: true
    nom_producteur:
      data_type: text
      nullable: true
    uri_producteur:
      data_type: text
      nullable: true
    code_preleveur:
      data_type: text
      nullable: true
    nom_preleveur:
      data_type: text
      nullable: true
    uri_preleveur:
      data_type: text
      nullable: true
    longitude:
      data_type: double
      nullable: true
    latitude:
      data_type: double
      nullable: true
    geometry:
      data_type: json
      nullable: true
    code_masse_deau:
      data_type: text
      nullable: true
    code_eu_masse_deau:
      data_type: text
      nullable: true
    nom_masse_deau:
      data_type: text
      nullable: true
    commentaire:
      data_type: text
      nullable: true
extraction:
  slicing_mode: station_month_chunked
  slicing_params:
    date_field: date_prelevement
    station_field: code_station
    stations_per_chunk: 20
  pagination:
    type: page_based
  default_params: {}
performance:
  parallelism: 3
  chunk_size: 5000
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 2.0
transformers:
- validate_primary_keys
- normalize_dates:
    fields:
    - date_prelevement
    - date_mesure
    - date_maj
- validate_coordinates:
    lat_field: latitude
    lon_field: longitude
- handle_geometry_field:
    geometry_field: geometry
    lat_field: latitude
    lon_field: longitude
destinations:
  postgres:
    dataset_name: hubeau
