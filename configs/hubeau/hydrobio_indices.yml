resource:
  name: hydrobio_indices
  endpoint: /indices.csv
  base_url: https://hubeau.eaufrance.fr/api/v1/hydrobio
  primary_key:
  - code_station_hydrobio
  - date_prelevement
  - code_indice
  - code_support
extraction:
  default_params: {}
performance:
  parallelism: 5
  batch_size: 5000
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 0.3
