resource:
  name: hydrobio_taxons
  endpoint: /taxons.csv
  base_url: https://hubeau.eaufrance.fr/api/v1/hydrobio
  primary_key:
  - code_station_hydrobio
  - date_prelevement
  - code_appel_taxon
  - code_support
extraction:
  default_params: {}
performance:
  parallelism: 5
  chunk_size: 10000
  batch_size: 8000
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 2.0
