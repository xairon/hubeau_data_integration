resource:
  name: hydrobio_taxons
  endpoint: /taxons.csv
  base_url: https://hubeau.eaufrance.fr/api/v1/hydrobio
  primary_key:
  - code_station_hydrobio
  - date_prelevement
  - code_appel_taxon
  - code_support
extraction:
  default_params: {}
performance:
  parallelism: 5
  chunk_size: 1000  # ✅ CHANGEMENT #6: Réduit de 10000 à 1000 (hydrobio = pas de pagination)
  batch_size: 1000  # ✅ CHANGEMENT #6: Réduit de 30000 à 1000 pour économiser RAM
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 2.0
