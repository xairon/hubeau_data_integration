source:
  name: hydrobio
  max_table_nesting: 2
resource:
  name: hydrobio_taxons
  endpoint: /taxons
  base_url: https://hubeau.eaufrance.fr/api/v1/hydrobio
  primary_key:
  - code_station_hydrobio
  - date_prelevement
  - code_appel_taxon
  write_disposition: merge
  columns:
    id:
      data_type: text
      nullable: true
extraction:
  slicing_mode: station_month_chunked
  station_param: code_station_hydrobio
  station_chunk_size: 20
  start_param: date_debut_prelevement
  end_param: date_fin_prelevement
  pagination:
    type: page_based
    page_size: 20000
    max_pages: null
  default_params:
    format: json
  records_path: $.data
temporal_filter:
  start_param: date_debut_prelevement
  end_param: date_fin_prelevement
  start_date: "2020-01-01"
  end_offset_days: 0
performance:
  parallelism: 5
  chunk_size: 10000
  retry_times: 3
  retry_delay: 2.0
  rate_limit:
    target_rps: 5.0
    max_concurrency: 1
    backoff: exponential_jitter
    rps_decrease_on_429: true
    rps_increase_cooldown_s: 60
transformers:
- validate_primary_keys
- normalize_dates:
    fields:
    - date_obs
destinations:
  postgres:
    dataset_name: bronze
    schema_name: hydrobio
    create_indexes: true
  filesystem:
    bucket_url: s3://bronze
    file_format: parquet
    layout: '{table_name}/year={YYYY}/{load_id}.parquet'
  duckdb:
    database: data/hydrobio.duckdb
