source:
  name: ecoulement
  max_table_nesting: 0
resource:
  name: ecoulement_campagnes
  endpoint: /campagnes.csv
  base_url: https://hubeau.eaufrance.fr/api/v1/ecoulement
  primary_key:
  - code_departement
  - date_campagne
  write_disposition: merge
  columns:
    # Identifiants
    code_campagne:
      data_type: integer
      nullable: true
    date_campagne:
      data_type: date
      nullable: false

    # Classification
    code_type_campagne:
      data_type: integer
      nullable: true
    libelle_type_campagne:
      data_type: text
      nullable: true

    # Métriques
    nombre_modalite_ecoulement:
      data_type: integer
      nullable: true

    # Réseau
    code_reseau:
      data_type: text
      nullable: true
    libelle_reseau:
      data_type: text
      nullable: true
    uri_reseau:
      data_type: text
      nullable: true

    # Administratif
    code_departement:
      data_type: text
      nullable: false
    libelle_departement:
      data_type: text
      nullable: true
