source:
  name: ecoulement
  max_table_nesting: 2
resource:
  name: ecoulement_campagnes
  endpoint: /campagnes
  base_url: https://hubeau.eaufrance.fr/api/v1/ecoulement
  primary_key: []
  write_disposition: merge
  columns:
    id:
      data_type: text
      nullable: true
extraction:
  slicing_mode: global
  pagination:
    type: page_based
  default_params: {}
performance:
  parallelism: 5
  chunk_size: 10000
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 2.0
transformers:
- validate_primary_keys
- normalize_dates:
    fields:
    - date_debut
    - date_fin
destinations:
  postgres:
    dataset_name: hubeau
