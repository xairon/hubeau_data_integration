name: temperature_stations
source: hubeau
dataset_name: hubeau
base_url: https://hubeau.eaufrance.fr/api/v1/temperature
path: /station
method: GET
params_default:
  format: json
  size: 1000
records_path: $.data
primary_keys: [code_station]
replication_key: date_maj_infos
pagination:
  type: page
  page_param: page
  page_size_param: size
  page_size: 1000
  until_expr: "len($.data) == 0"
slicer:
  mode: global  # Pas de filtrage nécessaire - récupération globale
rate_limit:
  target_rps: 2.0
  max_concurrency: 1
timeout: 60
comment: |
  API Température Hub'Eau - Liste des stations
  - 849 stations de température
  - Données de référence (pas de partition temporelle)
  - Mise à jour occasionnelle des informations de station
