source:
  name: temperature
  max_table_nesting: 2
resource:
  name: temperature_stations
  endpoint: /station
  base_url: https://hubeau.eaufrance.fr/api/v1/temperature
  primary_key: []
  write_disposition: replace
  columns:
    code_station:
      data_type: text
      nullable: false
    libelle_station:
      data_type: text
      nullable: true
    latitude:
      data_type: double
      nullable: true
    longitude:
      data_type: double
      nullable: true
extraction:
  slicing_mode: global
  pagination:
    type: page_based
    page_size: 5000
    max_pages: null
  default_params: {}
performance:
  parallelism: 5
  chunk_size: 10000
  retry_times: 3
  retry_delay: 2.0
  rate_limit: 2.0
transformers:
- validate_primary_keys
- normalize_dates:
    fields:
    - date_ouverture
    - date_fermeture
    - date_maj
- validate_coordinates:
    lat_field: latitude
    lon_field: longitude
destinations:
  postgres:
    dataset_name: bronze
    schema_name: temperature
    create_indexes: true
  filesystem:
    bucket_url: s3://hubeau-bronze
    file_format: parquet
    layout: '{table_name}/year={year}/{load_id}.parquet'
  duckdb:
    database: data/temperature.duckdb
