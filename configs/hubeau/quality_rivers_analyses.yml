source:
  name: quality
  max_table_nesting: 2
resource:
  name: quality_rivers_analyses
  endpoint: /analyse_pc
  base_url: https://hubeau.eaufrance.fr/api/v2/qualite_rivieres
  primary_key:
  - code_station
  - date_prelevement
  - code_parametre
  write_disposition: merge
  columns:
    code_prelevement:
      data_type: text
      nullable: false
    date_prelevement:
      data_type: timestamp
      nullable: true
    code_parametre:
      data_type: text
      nullable: true
    resultat:
      data_type: double
      nullable: true
    unite:
      data_type: text
      nullable: true
extraction:
  slicing_mode: global
  pagination:
    type: page_based
  default_params:
    format: json
  records_path: $.data
  temporal_filter:
    start_param: date_debut_prelevement
    end_param: date_fin_prelevement
    start_date: "2020-01-01"
    end_offset_days: 0
performance:
  parallelism: 5
  chunk_size: 10000
  retry_times: 3
  retry_delay: 2.0
  rate_limit:
    target_rps: 5.0
    max_concurrency: 1
transformers:
- validate_primary_keys
- normalize_dates:
    fields:
    - date_prelevement
    - date_analyse
destinations:
  postgres:
    dataset_name: bronze
    schema_name: quality
    create_indexes: true
  filesystem:
    bucket_url: s3://bronze
    file_format: parquet
    layout: '{table_name}/year={YYYY}/{load_id}.parquet'
  duckdb:
    database: data/quality.duckdb
