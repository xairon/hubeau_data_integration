name: quality_rivers_analyses
source: hubeau
dataset_name: hubeau
base_url: https://hubeau.eaufrance.fr/api/v2/qualite_rivieres
path: /analyse_pc
method: GET
params_default:
  format: json
  size: 2000
records_path: $.data
primary_keys: [code_station, date_prelevement, libelle_parametre, code_unite]
replication_key: date_prelevement
pagination:
  type: page
  page_param: page
  page_size_param: size
