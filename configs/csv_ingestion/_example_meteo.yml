# EXAMPLE CSV Ingestion Config
# This is a template - copy and customize for your CSV files

source:
  # File pattern (supports wildcards)
  # Examples:
  #   - "meteo_data.csv" (exact match)
  #   - "meteo_*.csv" (all files starting with meteo_)
  #   - "data_202*.csv" (all files matching pattern)
  file_pattern: "meteo_data_*.csv"

  # CSV delimiter (optional - auto-detected if omitted)
  delimiter: ","

  # Date columns to parse (optional - speeds up date parsing)
  date_columns:
    - observation_date
    - created_at

destination:
  # Table name in PostgreSQL (will be prefixed with "staging_")
  # Result: staging.staging_meteo_data
  table_name: meteo_data

  # Write mode:
  #   - replace: TRUNCATE + INSERT (full refresh)
  #   - append: INSERT only (incremental)
  write_disposition: replace

  # Primary key for deduplication (optional)
  # Used by DLT to track state and avoid duplicates
  primary_key:
    - station_id
    - observation_date

metadata:
  # Description visible in Dagster UI
  description: "Meteorological observation data from external sources"

  # Owner/team responsible
  owner: "Data Engineering Team"

  # Tags for organization
  tags:
    - meteorology
    - external
    - bronze
    - staging

# ============================================================================
# USAGE:
# 1. Rename this file: _example_meteo.yml → meteo.yml
# 2. Customize the parameters above
# 3. Drop CSV in data/csv_inbox/
# 4. Asset "csv_meteo" will appear in Dagster UI
# 5. Materialize the asset (manual or auto with sensor)
# ============================================================================
