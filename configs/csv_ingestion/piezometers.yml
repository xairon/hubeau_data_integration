# CSV Ingestion Config - Piezometers
# Ce fichier contrôle comment le CSV est ingéré

source:
  # Nom du fichier CSV (peut inclure wildcards: piezometers*.csv)
  file_pattern: "piezometers_merged_clean.csv"

  # Séparateur CSV (détecté automatiquement si omis)
  delimiter: ","

  # Colonnes de date à parser (optionnel)
  date_columns:
    - time
    - date_de_début
    - date_de_fin

destination:
  # Nom de la table en staging (préfixé automatiquement par "staging_")
  table_name: piezometers

  # Mode d'écriture: replace (full refresh) ou append (incrémental)
  write_disposition: replace

  # Primary key (optionnel - pour déduplication)
  primary_key:
    - pz
    - time

metadata:
  description: "Données piézomètres - surveillance nappes phréatiques"
  owner: "Data Team"
  tags:
    - piezometry
    - groundwater
    - bronze
